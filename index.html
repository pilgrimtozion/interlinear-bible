// ── Strong's Word Study search ─────────────────────────────────────────────
function WordStudyResults({strongs, isNT, onNavigate, onClose}){
  const [results,setResults]=useState(null);
  const [loading,setLoading]=useState(false);

  async function runSearch(){
    setLoading(true);
    // Determine which testaments to fetch based on Strong's prefix
    const toFetch = strongs.startsWith("G") ? ["NT"] : strongs.startsWith("H") ? ["OT"] : ["NT","OT"];
    // Fetch all books for relevant testaments, store into INTERLINEAR for searching
    await Promise.all(toFetch.flatMap(t=>
      Object.keys(BOOKS[t]||{}).map(async book=>{
        const data = await fetchInterlinearBook(t, book);
        if(data&&data.chapters){
          if(!INTERLINEAR[t][book]) INTERLINEAR[t][book]={};
          Object.entries(data.chapters).forEach(([ch,verses])=>{
            const n=parseInt(ch);
            if(!INTERLINEAR[t][book][n]) INTERLINEAR[t][book][n]=verses;
          });
        }
      })
    ));
    // Search all loaded data
    const hits={};
    ["NT","OT"].forEach(t=>{
      Object.entries(INTERLINEAR[t]||{}).forEach(([bk,chaps])=>{
        Object.entries(chaps).forEach(([ch,verses])=>{
          const vArr=Array.isArray(verses)?verses:Object.values(verses);
          vArr.forEach(verse=>{
            (verse.words||[]).forEach(w=>{
              if(w.s===strongs){
                if(!hits[bk])hits[bk]={test:t,refs:[]};
                hits[bk].refs.push({ch:parseInt(ch),v:verse.v,o:w.o,t:w.t,b:w.b||""});
              }
            });
          });
        });
      });
    });
    Object.values(hits).forEach(h=>{
      const seen=new Set();
      h.refs=h.refs.filter(r=>{const k=r.ch+":"+r.v;if(seen.has(k))return false;seen.add(k);return true;});
    });
    setResults(hits);
    setLoading(false);
  }

  if(!results&&!loading) return(
    <button className={"ws-btn"+(isNT?"":" ot")} onClick={runSearch}>
      📖 Find {strongs} across all books
    </button>
  );

  if(loading) return(
    <div className="ws-results">
      <div className="ws-results-hdr">Searching all books…</div>
      <div className="ws-hit-none">Fetching scripture data, please wait…</div>
    </div>
  );

  const _bookOrder=[...Object.keys(BOOKS.NT||{}),...Object.keys(BOOKS.OT||{})];
  const _bookIdx=Object.fromEntries(_bookOrder.map((b,i)=>[b,i]));
  const books=Object.keys(results).sort((a,b)=>(_bookIdx[a]??999)-(_bookIdx[b]??999));
  const total=books.reduce((s,b)=>s+results[b].refs.length,0);
  return(
    <div className="ws-results">
      <div className="ws-results-hdr">
        {total>0?`${total} occurrence${total>1?"s":""} across ${books.length} book${books.length>1?"s":""}`:
          `${strongs} not found in any book`}
      </div>
      {total===0&&<div className="ws-hit-none">This Strong's number was not found.</div>}
      {books.map(bk=>{
        const {test,refs}=results[bk];
        return(
          <div key={bk} className="ws-book-group">
            <div className="ws-book-name">{bk}</div>
            {refs.slice(0,30).map((r,i)=>(
              <div key={i} className="ws-hit" onClick={()=>{onNavigate&&onNavigate(bk+" "+r.ch+":"+r.v);onClose&&onClose();}}>
                <span className={"ws-hit-ref "+(test==="NT"?"nt":"ot")}>{r.ch}:{r.v}</span>
                <span className="ws-hit-word">{r.o}</span>
                <span style={{fontSize:".7rem",color:"var(--text3)",fontStyle:"italic",marginLeft:".2rem"}}>{r.t}</span>{r.b&&<span style={{fontSize:".75rem",color:"var(--text2)",marginLeft:".35rem",fontWeight:"500"}}>— {r.b}</span>}
              </div>
            ))}
            {refs.length>30&&<div className="ws-hit-none">+ {refs.length-30} more…</div>}
          </div>
        );
      })}
    </div>
  );
}

function StrongsPanel({entry,strongs,word,isNT,onClose,onNavigate}){
  const [sdEntry,setSdEntry]=useState(null);
  const [sdLoading,setSdLoading]=useState(false);


  // SW update: check flag immediately (catches race where event fired before mount)
  useEffect(()=>{
    if(entry||!strongs){setSdEntry(null);return;}
    const kind=strongs[0]; // 'G' or 'H'
    if(_SD[kind]){setSdEntry(_SD[kind][strongs]||null);return;}
    setSdLoading(true);
    fetch('/data/strongs_'+kind.toLowerCase()+'.json')
      .then(r=>r.json())
      .then(data=>{_SD[kind]=data;setSdEntry(data[strongs]||null);setSdLoading(false);})
      .catch(()=>setSdLoading(false));
  },[strongs,entry]);

  if(!entry&&!word&&!strongs)return null;
  const eff=entry||sdEntry;
  const heb=strongs&&strongs[0]==="H";
  const bridge=LXX[strongs];
  return(
    <div className="overlay" onClick={onClose}>
      <div className="sp" onClick={e=>e.stopPropagation()}>
        <button className="close-btn" onClick={onClose}>×</button>
        {strongs&&<div className={"sp-num"+(isNT?"":" ot")}>{strongs}</div>}
        <div className={"sp-lemma"+(heb?" heb":"")}>{eff?eff.l:(word&&word.o)||""}</div>
        <div className="sp-tr">{eff?eff.t:(word&&word.t)||""}</div>
        {eff&&eff.p&&<span className="sp-pos">{eff.p}</span>}
        {eff&&eff.d&&<p className="sp-def">{eff.d}</p>}
        {eff&&eff.k&&!eff.p&&<p className="sp-def" style={{fontSize:".82rem",color:"var(--text3)",marginTop:".2rem"}}><em>KJV:</em> {eff.k}</p>}
        {!eff&&sdLoading&&<p className="sp-def" style={{color:"var(--text3)",fontSize:".82rem",fontStyle:"italic"}}>Loading definition…</p>}
        {!eff&&!sdLoading&&strongs&&GLOSS[strongs]&&<p className="sp-def">{GLOSS[strongs].l}</p>}
        {!eff&&!sdLoading&&(!strongs||!GLOSS[strongs])&&<p className="sp-def" style={{color:"var(--text3)",fontSize:".82rem"}}>No lexical data available for this word.</p>}
        {bridge&&<div className="lxx-bridge">
          <div className="lxx-title">{heb?"⧁ LXX Greek Translation":"⧁ Hebrew Background (LXX)"}</div>
          {heb&&<p style={{fontSize:".7rem",color:"var(--text3)",margin:"-.2rem 0 .4rem"}}>In the Septuagint, this Hebrew word is translated:</p>}
          <div className="lxx-pair"><span className={"lxx-word"+(heb?"":" heb")}>{bridge.lbl}</span><span className="lxx-code">{bridge.cp}</span></div>
          <p className="lxx-note">{bridge.note}</p>
        </div>}
        {strongs&&<WordStudyResults strongs={strongs} isNT={isNT} onNavigate={onNavigate} onClose={onClose}/>}
      </div>
    </div>
  );
}

function parseRef(ref){
  if(!ref)return null;
  const m=ref.trim().match(/^(\d?\s*[a-zA-Z]+(?:\s+[a-zA-Z]+)?)\s+(\d+)(?::\s*(\d+))?$/);
  if(!m)return null;
  const raw=m[1].trim().toLowerCase().replace(/\s+/g,"");
  const book=BOOK_MAP[raw];
  if(!book)return null;
  const ch=parseInt(m[2]);
  const v=m[3]?parseInt(m[3]):1;
  const test=BOOKS.NT[book]?"NT":BOOKS.OT[book]?"OT":null;
  if(!test)return null;
  return{test,book,ch,v};
}

// ── All Notes Panel ────────────────────────────────────────────────────────────
function NotesPanel({notes, onClose, onNavigate, inline}){
  const migrateNote=raw=>Array.isArray(raw)?raw:(raw?[raw]:[]);
  const NT_ORDER=Object.keys(BOOKS.NT||{});
  const OT_ORDER=Object.keys(BOOKS.OT||{});
  const BOOK_ORDER=[...NT_ORDER,...OT_ORDER];
  const bkIdx=Object.fromEntries(BOOK_ORDER.map((b,i)=>[b,i]));

  // Build grouped structure: { "NT|John|3" : {test,book,ch,isNT, verses:[{v, items:[]}]} }
  const grouped={};
  Object.entries(notes).forEach(([key,raw])=>{
    const items=migrateNote(raw);
    if(!items.length)return;
    const parts=key.split("|");
    if(parts.length<4)return;
    const [t,bk,chStr,vStr]=parts;
    const gk=t+"|"+bk+"|"+chStr;
    if(!grouped[gk])grouped[gk]={test:t,book:bk,ch:parseInt(chStr),isNT:t==="NT",verses:[]};
    grouped[gk].verses.push({v:parseInt(vStr),items});
  });

  const sortedGroups=Object.entries(grouped).sort(([,a],[,b])=>{
    const bi=(bkIdx[a.book]??999)-(bkIdx[b.book]??999);
    return bi!==0?bi:a.ch-b.ch;
  });

  if(inline) return(
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div className="theo-body">
        {sortedGroups.length===0
            ?<div style={{padding:"2rem 1rem",color:"var(--text3)",textAlign:"center",fontSize:".85rem",lineHeight:1.7}}>No notes yet.<br/>Hover over any verse and tap <strong>+</strong> to add one.</div>
            :sortedGroups.map(([gk,grp])=>(
              <div key={gk} style={{marginBottom:"1.1rem"}}>
                <div style={{fontSize:".72rem",fontWeight:700,color:grp.isNT?"var(--nt)":"var(--ot)",marginBottom:".4rem",textTransform:"uppercase",letterSpacing:".06em"}}>
                  {grp.book} {grp.ch}
                </div>
                {grp.verses.sort((a,b)=>a.v-b.v).map(({v,items})=>(
                  <div key={v} className={"arc-verse"+(grp.isNT?"":" ot")} style={{cursor:"pointer"}}
                    onClick={()=>{onNavigate&&onNavigate(`${grp.book} ${grp.ch}:${v}`);onClose();}}>
                    <span className={"arc-verse-ref "+(grp.isNT?"nt":"ot")}>v.{v}</span>
                    <div style={{flex:1}}>
                      {items.map((item,i)=>(
                        <div key={i} style={{fontSize:".8rem",color:"var(--text)",lineHeight:1.55}}>
                          {item.type==="link"
                            ?<span>🔗 <em style={{color:"var(--text2)"}}>{item.ref}</em></span>
                            :<span>📝 {item.text&&item.text.length>90?item.text.slice(0,87)+"…":item.text}</span>}
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            ))
          }
      </div>
    </div>
  );
  return(
    <div className="theo-overlay" onClick={onClose}>
      <div className="theo-panel" onClick={e=>e.stopPropagation()}>
        <div className="theo-header">
          <span className="theo-title">📝 My Notes</span>
          <button className="theo-close" onClick={onClose}>×</button>
        </div>
        <div className="theo-body">
          {sortedGroups.length===0
            ?<div style={{padding:"2rem 1rem",color:"var(--text3)",textAlign:"center",fontSize:".85rem",lineHeight:1.7}}>No notes yet.<br/>Hover over any verse and tap <strong>+</strong> to add one.</div>
            :sortedGroups.map(([gk,grp])=>(
              <div key={gk} style={{marginBottom:"1.1rem"}}>
                <div style={{fontSize:".72rem",fontWeight:700,color:grp.isNT?"var(--nt)":"var(--ot)",marginBottom:".4rem",textTransform:"uppercase",letterSpacing:".06em"}}>
                  {grp.book} {grp.ch}
                </div>
                {grp.verses.sort((a,b)=>a.v-b.v).map(({v,items})=>(
                  <div key={v} className={"arc-verse"+(grp.isNT?"":" ot")} style={{cursor:"pointer"}}
                    onClick={()=>{onNavigate&&onNavigate(`${grp.book} ${grp.ch}:${v}`);onClose();}}>
                    <span className={"arc-verse-ref "+(grp.isNT?"nt":"ot")}>v.{v}</span>
                    <div style={{flex:1}}>
                      {items.map((item,i)=>(
                        <div key={i} style={{fontSize:".8rem",color:"var(--text)",lineHeight:1.55}}>
                          {item.type==="link"
                            ?<span>🔗 <em style={{color:"var(--text2)"}}>{item.ref}</em></span>
                            :<span>📝 {item.text&&item.text.length>90?item.text.slice(0,87)+"…":item.text}</span>}
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            ))
          }
        </div>
      </div>
    </div>
  );
}

              onSelect={vn=>{setActiveV(vn);setMobileView("interlinear");}}
              hlMode={hlMode} book={book} ch={ch}
              hlBg={(()=>{var hk=nk(test,book,ch,v.v);var hc=highlights[hk];var col=hc?HL_COLORS.find(function(x){return x.k===hc;}):null;return col?col.bg:null;})()}
              hlHex={(()=>{var hk=nk(test,book,ch,v.v);var hc=highlights[hk];var col=hc?HL_COLORS.find(function(x){return x.k===hc;}):null;return col?col.hex:null;})()}
              onHighlight={applyHighlight} onCompare={vn=>setParallelV(vn)}/>
          ))}
          <div className="footer">
            <strong style={{color:"var(--text3)"}}>The Pilgrim's Interlinear</strong><br/>
            English text:{" "}
            {translation==="WEB"
              ?<><a href="https://ebible.org/eng-web/copyright.htm" target="_blank" rel="noopener" style={{color:"inherit"}}>World English Bible</a> (Public Domain)</>
              :<span>{translationCopyright||TRANSLATIONS.find(t=>t.id===translation)?.label||""}</span>
            } ·{" "}
            Interlinear: <a href="https://interlinearbible.com" target="_blank" rel="noopener" style={{color:"inherit"}}>Berean Interlinear Bible</a> (Public Domain) ·{" "}
            {isNT?"Greek NT: SBL Greek New Testament":"Hebrew OT: Westminster Leningrad Codex"}<br/>
            Strong&#39;s Hebrew &amp; Greek: <a href="https://github.com/openscriptures/strongs" target="_blank" rel="noopener" style={{color:"inherit"}}>OpenScriptures</a> (CC&#8209;BY 4.0)
          </div>
        </div>
        <div className={"right-col"+(mobileView==="list"?" mob-hide":"")}>
          {interlinearVerses
            ?interlinearVerses.map(v=>{var _hk=nk(test,book,ch,v.v);var _hc=highlights[_hk];var _hcol=_hc?HL_COLORS.find(function(x){return x.k===_hc;}):null;return <VerseBlock key={v.v} id={"rv-"+v.v} verse={v} isNT={isNT} activeV={activeV} selKey={sel?sel.key:null} onClick={handleWord} hlBg={_hcol?_hcol.bg:null} hlHex={_hcol?_hcol.hex:null} book={book} ch={ch} onNavigate={handleNavigate}/>;})
            :<div className="no-interlinear">
              {fetchingInterlinear
                ?"Loading interlinear data…"
                :<span>No interlinear data found for {book} {ch}.<br/>
                  <span style={{fontSize:".78rem"}}>Add data files to your GitHub repo by running <code>generate_interlinear_data.py</code>.</span>
                </span>
              }
            </div>
          }
        </div>
        <div className="side-toolbar">
          <button className={"side-tool-btn"+(showBookIntro?" active":"")} title="Book Introduction" onClick={()=>{setShowBookIntro(true);}}>📖</button>
          <div className="side-tool-sep"/>
          <button className={"side-tool-btn"+(showHotTopics?" active":"")} title="Hot Topics" onClick={()=>{setShowHotTopics(true);}}>🔥</button>
          <div className="side-tool-sep"/>
          <button className={"side-tool-btn"+(showNotes?" active":"")} title="Notes" onClick={()=>{setShowNotes(true);}}>📝</button>
          <div className="side-tool-sep"/>
          <button className={"side-tool-btn"+(showPlaces?" active":"")} title="Places" onClick={()=>{setShowPlaces(true);}}>📍</button>
          <div className="side-tool-sep"/>
          <button className={"side-tool-btn"+(showTheo?" active":"")} title="Topics" onClick={()=>{setShowTheo(true);}}>⧁</button>
          <div className="side-tool-sep"/>
          <button className={"side-tool-btn"+(showCulture?" active":"")} title="Cultural Context" onClick={()=>{setShowCulture(true);}}>🏺</button>
          <div className="side-tool-sep"/>
          <button className={"side-tool-btn"+(showHighlights||hlMode?" active":"")}
            title="Highlights"
            style={hlMode?{background:activeHlColor.hex+'33',color:activeHlColor.hex}:{}}
            onClick={()=>{setShowHighlights(true);}}>🖌</button>
        </div>
      </div>
      {/* Mobile bottom tab bar */}
      <div className="mob-tabs">
        <button className={"mob-tab"+(mobileView==="list"?" mob-on"+(isNT?"":" mob-ot"):"")}
                onClick={()=>setMobileView("list")}>
          <span className="mob-tab-icon">☰</span>
          <span>Verses</span>
        </button>
        <button className={"mob-tab"+(mobileView==="interlinear"?" mob-on"+(isNT?"":" mob-ot"):"")}
                onClick={()=>setMobileView("interlinear")}>
          <span className="mob-tab-icon">{isNT?"α":"א"}</span>
          <span>Interlinear</span>
        </button>
        <button className={"mob-tab"+((showNotes||showPlaces||showTheo||showHighlights||hlMode||showBookIntro||showHotTopics)?" mob-on"+(isNT?"":" mob-ot"):"")}
                onClick={()=>setShowToolsSheet(true)}>
          <span className="mob-tab-icon">⚙</span>
          <span>Tools</span>
        </button>
      </div>
      {showToolsSheet&&(
        <>
          <div className="tools-sheet-backdrop" onClick={()=>setShowToolsSheet(false)}/>
          <div className="tools-sheet">
            <div className="tools-sheet-handle"/>
            <div className="tools-sheet-title">Tools</div>
            <div className="tools-sheet-row" onClick={()=>{setShowBookIntro(true);setShowToolsSheet(false);}}>
              <span className="tools-sheet-icon">📖</span>
              <div className="tools-sheet-info">
                <div className="tools-sheet-label">Book Introduction</div>
                <div className="tools-sheet-desc">Author, date, genre, themes and overview for {book}</div>
              </div>
            </div>
            <div className="tools-sheet-row" onClick={()=>{setShowHotTopics(true);setShowToolsSheet(false);}}>
              <span className="tools-sheet-icon">🔥</span>
              <div className="tools-sheet-info">
                <div className="tools-sheet-label">Hot Topics</div>
                <div className="tools-sheet-desc">Key verses on debated theological and ethical questions</div>
              </div>
            </div>
            <div className="tools-sheet-row" onClick={()=>{setShowNotes(true);setShowToolsSheet(false);}}>
              <span className="tools-sheet-icon">📝</span>
              <div className="tools-sheet-info">
                <div className="tools-sheet-label">Notes</div>
                <div className="tools-sheet-desc">Add and review your verse notes and cross-references</div>
              </div>
            </div>
            <div className="tools-sheet-row" onClick={()=>{setShowPlaces(true);setShowToolsSheet(false);}}>
              <span className="tools-sheet-icon">📍</span>
              <div className="tools-sheet-info">
                <div className="tools-sheet-label">Places</div>
                <div className="tools-sheet-desc">Biblical locations and their narrative through Scripture</div>
              </div>
            </div>
            <div className="tools-sheet-row" onClick={()=>{setShowTheo(true);setShowToolsSheet(false);}}>
              <span className="tools-sheet-icon">⧁</span>
              <div className="tools-sheet-info">
                <div className="tools-sheet-label">Topics</div>
                <div className="tools-sheet-desc">Theological arcs traced from seed to fulfillment</div>
              </div>
            </div>
            <div className="tools-sheet-row" onClick={()=>{setShowCulture(true);setShowToolsSheet(false);}}>
              <span className="tools-sheet-icon">🏺</span>
              <div className="tools-sheet-info">
                <div className="tools-sheet-label">Cultural Context</div>
                <div className="tools-sheet-desc">Customs, idioms, and social background for {book} {ch}</div>
              </div>
            </div>
            <div className="tools-sheet-row" onClick={()=>{setShowHighlights(true);setShowToolsSheet(false);}}>
              <span className="tools-sheet-icon" style={hlMode?{color:activeHlColor.hex}:{}}>🖌</span>
              <div className="tools-sheet-info">
                <div className="tools-sheet-label">Highlights{hlMode&&<span className="tools-sheet-badge">Active</span>}</div>
                <div className="tools-sheet-desc">Color-code verses and review by theme</div>
              </div>
            </div>
          </div>
        </>
      )}
      {showHighlights&&<HighlightsPanel
        highlights={highlights}
        hlLabels={hlLabels}
        hlColor={hlColor}
        onSelectColor={c=>{setHlColor(c);setHlMode(true);setShowHighlights(false);}}
        onLabelChange={saveHlLabels}
        onClose={()=>setShowHighlights(false)}
        onNavigate={handleNavigate}/>}
      {showNotes&&<NotesPanel notes={notes} onClose={()=>setShowNotes(false)} onNavigate={handleNavigate}/>}
      {showPlaces&&<PlacesPanel book={book} ch={ch} onClose={()=>setShowPlaces(false)} onNavigate={ref=>{handleNavigate(ref);setShowPlaces(false);}}/>}
      {showBookIntro&&<BookIntroPanel book={book} onClose={()=>setShowBookIntro(false)}/>}
      {showHotTopics&&<HotTopicsPanel onClose={()=>setShowHotTopics(false)} onNavigate={ref=>{handleNavigate(ref);setShowHotTopics(false);}}/>}
      {showTheo&&<TheologyPanel onClose={()=>setShowTheo(false)} onNavigate={ref=>{handleNavigate(ref);setShowTheo(false);}}/>}
      {showCulture&&<CulturePanel book={book} ch={ch} onClose={()=>setShowCulture(false)}/>}
      {showAbout&&<AboutModal onClose={()=>setShowAbout(false)}/>}
      {showWhatsNew&&<WhatsNewModal onClose={()=>{setShowWhatsNew(false);localStorage.setItem('jm-seen-v65','1');}}/>}
      {showAccountModal&&fbUser&&<AccountModal user={fbUser} onSignOut={fbSignOut} onClose={()=>setShowAccountModal(false)}/>}
      {parallelV&&<ParallelPanel book={book} ch={ch} verseNum={parallelV} isNT={isNT} interlinearVerses={interlinearVerses} onClose={()=>setParallelV(null)}/>}
      {sel&&<StrongsPanel entry={entry} strongs={sel.word.s} word={sel.word} isNT={isNT} onClose={()=>setSel(null)} onNavigate={ref=>{handleNavigate(ref);setSel(null);}}/>}
      {addingNote&&<NoteModal verse={addingNote} onSave={data=>handleSaveNote(addingNote,data)} onClose={()=>setAddingNote(null)}/>}

    </div>
  );
}

// Reverse-index: normalized transliteration → Strong's number, built after each dict loads.
// Used to patch words where the source data has s:"" but word.t gives us a lookup key.
var _SD_TLIT_G={};
var _SD_TLIT_H={};
function _buildTlit(dict,target){
  Object.keys(dict).forEach(function(k){
    var e=dict[k];
    if(e.t){var n=e.t.toLowerCase().replace(/[^a-z]/g,'');if(!target[n])target[n]=k;}
  });
}

// Load both Strong's dictionaries before first render so all glosses are available immediately.
// Files are served from SW cache on repeat visits — effectively instant.
Promise.all([
  fetch('/data/strongs_g.json').then(function(r){return r.ok?r.json():null;}).then(function(d){if(d){_SD['G']=d;_buildTlit(d,_SD_TLIT_G);}}).catch(function(){}),
  fetch('/data/strongs_h.json').then(function(r){return r.ok?r.json():null;}).then(function(d){if(d){_SD['H']=d;_buildTlit(d,_SD_TLIT_H);}}).catch(function(){})
]).finally(function(){
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App,null));
});
</script>
<script>
if ('serviceWorker' in navigator) {
  // New SW takes control → reload immediately with fresh assets
  navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js')
      .then(reg => {
        // Check every time app comes to foreground (critical for mobile PWA)
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update();
        });
        // Hourly backstop
        setInterval(() => reg.update(), 60 * 60 * 1000);
      })
      .catch(e => console.warn('SW registration failed:', e));
  });
}
</script>
</body>
