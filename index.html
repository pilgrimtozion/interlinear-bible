<script type="text/babel">
const {useState,useEffect,useRef} = React;


const LXX = {
  // Creation & Existence
  G2316:{cp:"H430",lbl:"\u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd",note:"The LXX renders Elohim as theos throughout. Every NT reference to God draws on the Hebrew Elohim — plural of majesty, the Creator of Genesis 1."},
  G746:{cp:"H7225",lbl:"\u05e8\u05b5\u05d0\u05e9\u05c1\u05b4\u05d9\u05ea",note:"John opens with en arche — the exact LXX rendering of bereshit in Gen 1:1. John is writing a new Genesis."},
  G5457:{cp:"H216",lbl:"\u05d0\u05d5\u05b9\u05e8",note:"The LXX renders or as phos throughout. John's light in 1:4-5 echoes God's first creative word in Gen 1:3. Jesus as the light of the world stands in direct continuity."},
  G4653:{cp:"H2822",lbl:"\u05d7\u05b9\u05e9\u05c1\u05b6\u05da\u05b0",note:"The LXX uses skotia/skotos for choshek. The darkness of John 1:5 deliberately mirrors the darkness over the deep in Gen 1:2."},
  G1096:{cp:"H1961",lbl:"\u05d4\u05b8\u05d9\u05b8\u05d4",note:"Ginomai renders hayah in the LXX. John's egeneto (came into being) vs. en (was eternally) reflects the Hebrew distinction between becoming and pre-existent being."},
  G1510:{cp:"H1961",lbl:"\u05d4\u05b8\u05d9\u05b8\u05d4",note:"The LXX uses eimi to render hayah. The divine name YHWH derives from this root — He who is. John's en signals eternal, continuous existence."},
  G3056:{cp:"H1697",lbl:"\u05d3\u05bc\u05b8\u05d1\u05b8\u05e8",note:"Logos reflects the Hebrew davar — God's creative word in Gen 1. The LXX renders davar as logos throughout (Ps 33:6: by the logos of the Lord the heavens were made)."},
  G2222:{cp:"H2416",lbl:"\u05d7\u05b7\u05d9\u05bc\u05b4\u05d9\u05dd",note:"Zoe corresponds to chayyim. The LXX uses zoe for the life God breathes into Adam (Gen 2:7). John's in him was life extends this divine life to the Logos."},
  G4151:{cp:"H7307",lbl:"\u05e8\u05d5\u05bc\u05d7\u05b7",note:"Pneuma is the standard LXX rendering of ruach — spirit, wind, breath. The Spirit hovering over the waters (Gen 1:2) and the Spirit poured out (Joel 2:28) are the same ruach/pneuma."},
  // Lord & Covenant
  G2962:{cp:"H3068",lbl:"\u05d9\u05d4\u05d5\u05d4",note:"The LXX uses kyrios to translate the divine name YHWH throughout. Every NT use of kyrios for Jesus echoes this convention and applies the divine name to him."},
  G1242:{cp:"H1285",lbl:"\u05d1\u05bc\u05b0\u05e8\u05b4\u05d9\u05ea",note:"Diatheke renders berit (covenant) in the LXX. The new diatheke of the NT (Heb 8-9; Matt 26:28) stands in direct continuity with the Sinai covenant."},
  G3551:{cp:"H8451",lbl:"\u05ea\u05bc\u05d5\u05b9\u05e8\u05b8\u05d4",note:"Nomos is the LXX translation of Torah. When Paul discusses nomos, he is engaging with the Torah and its role in the covenant, not merely abstract legal rules."},
  G1391:{cp:"H3519",lbl:"\u05db\u05bc\u05b8\u05d1\u05d5\u05b9\u05d3",note:"Doxa renders kavod (glory, weighty presence) in the LXX. The glory that filled the tabernacle (Exod 40:34) and that John says dwelt among us (John 1:14) is the same kavod/doxa."},
  G40:{cp:"H6918",lbl:"\u05e7\u05b8\u05d3\u05d5\u05b9\u05e9\u05c1",note:"Hagios renders qadosh (holy, set apart) in the LXX. Holy, holy, holy (Isa 6:3; Rev 4:8) — the same qadosh/hagios across both Testaments."},
  G1343:{cp:"H6666",lbl:"\u05e6\u05b0\u05d3\u05b8\u05e7\u05b8\u05d4",note:"Dikaiosyne renders tsedaqah (righteousness, covenant faithfulness) in the LXX. Paul's justification theology engages the OT concept of God's tsedaqah/dikaiosyne."},
  G1515:{cp:"H7965",lbl:"\u05e9\u05c1\u05b8\u05dc\u05d5\u05b9\u05dd",note:"Eirene renders shalom in the LXX — not merely absence of conflict but wholeness and right relationship. NT peace carries all of shalom's fullness."},
  G26:{cp:"H160",lbl:"\u05d0\u05b7\u05d4\u05b2\u05d1\u05b8\u05d4",note:"Agape renders ahavah (love) in the LXX. God's love for Israel (Jer 31:3), the command to love God and neighbor (Deut 6:5; Lev 19:18) — all use the same ahavah/agapao."},
  G4102:{cp:"H530",lbl:"\u05d0\u05b1\u05de\u05d5\u05bc\u05e0\u05b8\u05d4",note:"Pistis renders emunah (faithfulness, steadfastness) in the LXX. Hab 2:4 — the righteous shall live by emunah/pistis — underlies Paul's entire argument in Romans and Galatians."},
  G1680:{cp:"H8615",lbl:"\u05ea\u05b4\u05e7\u05b0\u05d5\u05b8\u05d4",note:"Elpis renders tiqvah (hope, expectation) in the LXX. OT hope is always grounded in what God has done and promised; NT elpis carries this same orientation."},
  G5485:{cp:"H2580",lbl:"\u05d7\u05b5\u05df",note:"Charis renders chen (grace, favor) in the LXX. Noah found chen in God's eyes (Gen 6:8); the NT charis of salvation is the same divine favor now made universally available through Christ."},
  // Salvation & Christology
  G4991:{cp:"H3444",lbl:"\u05d9\u05b0\u05e9\u05d5\u05bc\u05e2\u05b8\u05d4",note:"Soteria renders yeshuah (salvation). Yeshuah is the Hebrew form of the name Jesus (Yeshua). When Mary sings about salvation (Luke 1:47), she uses the same root as her son's name."},
  G5547:{cp:"H4899",lbl:"\u05de\u05b8\u05e9\u05c1\u05b4\u05d9\u05d7\u05b7",note:"Christos is the direct translation of Mashiach (Anointed One). Every NT use of Christ asserts Jesus is the promised royal Anointed One."},
  G2424:{cp:"H3091",lbl:"\u05d9\u05b0\u05d4\u05d5\u05e9\u05c1\u05d5\u05bc\u05e2\u05b7",note:"Iesous is the Greek form of Yehoshua/Yeshua (Joshua) — meaning YHWH saves. The first Joshua led Israel into the promised land; Jesus leads humanity into eternal life."},
  // Human Nature
  G2588:{cp:"H3820",lbl:"\u05dc\u05b5\u05d1",note:"Kardia renders lev (heart) in the LXX. The lev is the seat of intellect, will, and emotion. Love God with all your lev/kardia (Deut 6:5; Matt 22:37) — the Shema becomes the Great Commandment."},
  G5590:{cp:"H5315",lbl:"\u05e0\u05b6\u05e4\u05b6\u05e9\u05c1",note:"Psyche renders nephesh in the LXX. Nephesh means the whole living self — not a disembodied soul. In Gen 2:7, Adam became a living nephesh. NT psyche carries this holistic meaning."},
  G4561:{cp:"H1320",lbl:"\u05d1\u05bc\u05b8\u05e9\u05c2\u05b8\u05e8",note:"Sarx renders basar (flesh) in the LXX. All flesh (kol basar) will see God's salvation (Isa 40:5; Luke 3:6). The Word became sarx/flesh (John 1:14) deliberately enters the realm of basar."},
  G444:{cp:"H120",lbl:"\u05d0\u05b8\u05d3\u05b8\u05dd",note:"Anthropos renders adam in the LXX. Adam is both a name and the Hebrew word for human being. Paul's second Adam theology (Rom 5; 1 Cor 15) is built entirely on this LXX bridge."},
  G5495:{cp:"H3027",lbl:"\u05d9\u05b8\u05d3",note:"Cheir renders yad (hand) in the LXX. The hand of the Lord (yad YHWH) is a major OT motif for divine power and action (Isa 59:1). NT references to God's cheir inherit this symbolism."},
  // Key Verbs
  G3340:{cp:"H7725",lbl:"\u05e9\u05d5\u05bc\u05d1",note:"Metanoeo renders shuv (to turn, return) in the LXX. OT repentance is shuv — a turning back to God. Return (shuv) to me and I will return to you (Mal 3:7) is the same call as repent (metanoeo)."},
  G266:{cp:"H2399",lbl:"\u05d7\u05b5\u05d8\u05b0\u05d0",note:"Hamartia renders chet (sin, missing the mark) in the LXX. The OT's rich sin vocabulary is largely conveyed through hamartia in the NT, shaping Paul's sin-language profoundly."},
  G863:{cp:"H5545",lbl:"\u05e1\u05b8\u05dc\u05b7\u05d7",note:"Aphiemi renders salach (forgive) in the LXX. Salach is used exclusively of divine forgiveness in the OT. Jesus's claim to forgive sins (Mark 2:5-7) was immediately recognized as a divine prerogative."},
  G1097:{cp:"H3045",lbl:"\u05d9\u05b8\u05d3\u05b7\u05e2",note:"Ginosko renders yada (intimate, experiential knowledge) in the LXX. Yada is relational, not academic. This is eternal life — to yada/ginosko the only true God (John 17:3)."},
  G4100:{cp:"H539",lbl:"\u05d0\u05b8\u05de\u05b7\u05df",note:"Pisteuo renders aman (to be firm, trustworthy; believe) in the LXX. Abraham aman/episteusen God (Gen 15:6; Rom 4:3; Gal 3:6) — the same verb, the same act, across both Testaments."},
  G4352:{cp:"H7812",lbl:"\u05e9\u05b8\u05d7\u05b8\u05d4",note:"Proskyneo renders shachah (to bow down, worship) in the LXX. The instinct to fall down before God runs from Abraham (Gen 17:3) through the Magi (Matt 2:11) to the heavenly worship of Revelation."},
  G25:{cp:"H157",lbl:"\u05d0\u05b8\u05d4\u05b5\u05d1",note:"Agapao renders ahev (to love) in the LXX. The command to love God (Deut 6:5) and neighbor (Lev 19:18) and Jesus's summary of the law all use the same ahev/agapao verb."},
  // Creation & Nature
  G3598:{cp:"H1870",lbl:"\u05d3\u05b6\u05bc\u05e8\u05b6\u05da\u05b0",note:"Hodos renders derek (way, road, path) in the LXX. Prepare the derek/hodos of the Lord (Isa 40:3; Mark 1:3). I am the Way/hodos/derek (John 14:6). Walk in my derek/hodos (Deut 8:6)."},
  G225:{cp:"H571",lbl:"\u05d0\u05b1\u05de\u05b6\u05ea",note:"Aletheia renders emet (truth, faithfulness, reliability) in the LXX. Hebrew emet is personal covenant reliability. I am the aletheia/emet (John 14:6) — Jesus claims the very faithful reliability of God."},
  G18:{cp:"H2896",lbl:"\u05d8\u05d5\u05b9\u05d1",note:"Agathos renders tov (good) in the LXX. God saw that it was tov — said seven times in Gen 1. The Lord is tov/agathos (Ps 34:8; Mark 10:18). The same goodness runs through both Testaments."},
  G2540:{cp:"H6256",lbl:"\u05e2\u05b5\u05ea",note:"Kairos renders et (appointed time, proper season) in the LXX. There is an et/kairos for everything (Eccl 3:1). The kairos has been fulfilled (Mark 1:15) — God's appointed et has arrived."},
  G2250:{cp:"H3117",lbl:"\u05d9\u05d5\u05b9\u05dd",note:"Hemera renders yom (day) in the LXX. The Day of the Lord (yom YHWH) is the central eschatological concept of the prophets (Amos 5:18). NT hemera Kyriou is its direct continuation."},
  G2817:{cp:"H5159",lbl:"\u05e0\u05b7\u05d7\u05b2\u05dc\u05b8\u05d4",note:"Kleronomia renders nachalah (inheritance, portion) in the LXX. The land as nachalah is central to the covenant. NT inheritance expands this to salvation itself (Heb 1:14) and eternal life (Mark 10:17)."},
  G165:{cp:"H5769",lbl:"\u05e2\u05d5\u05b9\u05dc\u05b8\u05dd",note:"Aion (age, eternity) renders olam in the LXX. L'olam va'ed (forever and ever) becomes eis tous aionas ton aionon in the NT — same phrase, same concept of endless ages."},
  G281:{cp:"H543",lbl:"\u05d0\u05b8\u05de\u05b5\u05df",note:"Amen is the same word in Hebrew and Greek — untranslated, it crosses every linguistic boundary. Israel's congregational amen (1 Chr 16:36) becomes the amen amen (truly truly) of Jesus."},
  // Worship & Community
  G4633:{cp:"H4908",lbl:"\u05de\u05b4\u05e9\u05c1\u05b0\u05db\u05bc\u05b8\u05df",note:"Skene renders mishkan (dwelling place) in the LXX. When John says the Word dwelt/eskēnōsen among us (John 1:14), he uses the verb form — the Word tabernacled among us, echoing the mishkan."},
  G1401:{cp:"H5650",lbl:"\u05e2\u05b6\u05d1\u05b6\u05d3",note:"Doulos renders eved (servant, slave) in the LXX. The Servant Songs of Isaiah (42, 49, 50, 52-53) describe the eved YHWH whose suffering brings redemption. The NT applies these directly to Jesus."},
  G1577:{cp:"H6951",lbl:"\u05e7\u05b8\u05d4\u05b8\u05dc",note:"Ekklesia renders qahal (assembly, congregation) in the LXX. When Jesus says I will build my ekklesia (Matt 16:18), he uses the same word as the assembled people of God at Sinai (Deut 4:10; 9:10)."},
  G932:{cp:"H4438",lbl:"\u05de\u05b7\u05dc\u05b0\u05db\u05d5\u05bc\u05ea",note:"Basileia (kingdom) renders malkut in the LXX. The Kingdom of God central to Jesus's preaching fulfills Israel's hope for YHWH's malkut over all nations (Dan 2:44; 7:14)."},
  G4396:{cp:"H5030",lbl:"\u05e0\u05b8\u05d1\u05b4\u05d9\u05d0",note:"Prophetes renders navi (prophet) in the LXX. The OT nevi'im spoke by the Spirit; every NT prophetes stands in this tradition."},
  G1411:{cp:"H1369",lbl:"\u05d2\u05bc\u05b0\u05d1\u05d5\u05bc\u05e8\u05b8\u05d4",note:"Dynamis renders gevurah (might, power) in the LXX. The mighty acts of God (gevurot) in the Exodus are the template for NT dynamis — the Spirit as power (Acts 1:8)."},

  // Quotation Bridges — LXX diverges from Hebrew MT
  G3933:{cp:"H5959",lbl:"עַלְמָה",note:"QUOTATION BRIDGE — Isaiah 7:14 → Matthew 1:23. Hebrew almah (H5959) means a young woman of marriageable age. The LXX translated almah as parthenos (virgin). Matthew 1:23 follows the LXX. The Hebrew almah does not necessarily specify virginity; the LXX translators either interpreted it that way or knew a tradition that did. Matthew’s argument for the virgin birth rests on the Greek text."},
  G4983:{cp:"H241",lbl:"אֹזֶן",note:"QUOTATION BRIDGE — Psalm 40:6 → Hebrews 10:5. Hebrew ozen: ‘ears you have dug/opened for me’ (a metaphor for obedience). The LXX reads soma katērtisō moi — ‘a body you prepared for me.’ Hebrews 10:5 uses the LXX reading to argue that Christ’s incarnate body replaced the animal sacrifice system. The entire theological argument of Hebrews 10:5-10 depends on the Greek text; the Hebrew would not support it."},
  G32:{cp:"H430",lbl:"אֱלֹהִים",note:"QUOTATION BRIDGE — Psalm 8:5 → Hebrews 2:7. Hebrew: ‘you made him a little lower than Elohim’ (God or divine beings). The LXX reads ‘lower than angels’ (angelous). Hebrews 2:7 uses the LXX: the Son was temporarily made lower than angels in his incarnation before being crowned with glory. This argument requires the LXX reading — the Hebrew ‘lower than God’ would run in the opposite direction theologically. Also: Deuteronomy 32:43 LXX (and Dead Sea Scrolls) reads ‘let all God’s angels worship him’ — a line Hebrews 1:6 quotes that does not exist in the Hebrew MT at all."},
  G2759:{cp:"H1698",lbl:"דֶבֶר",note:"QUOTATION BRIDGE — Hosea 13:14 / Isaiah 25:8 → 1 Corinthians 15:55. Hebrew Hosea 13:14 is a statement of judgment (‘Where are your plagues, O death?’ — YHWH threatening to unleash death on Israel). Paul’s triumphant taunt ‘O death, where is your sting?’ conflates Hosea 13:14 and Isaiah 25:8 in a form closer to the LXX, reading both as cries of victory. The same Hebrew text that threatened Israel is redeployed as a resurrection shout — the cross transforms the meaning entirely."},
  G1484:{cp:"H123",lbl:"אֱדוֹם",note:"QUOTATION BRIDGE — Amos 9:12 → Acts 15:17. Hebrew: ‘so that they may possess the remnant of Edom.’ The LXX reads: ‘so that the remnant of mankind may seek the Lord.’ At the Jerusalem Council (Acts 15), James quotes the LXX version to argue that Gentiles can be included in the covenant without circumcision. This ruling — which shaped the entire direction of Gentile Christianity — rests on the LXX text. The Hebrew would not support James’s argument."},
  G4416:{cp:"H1060",lbl:"בְּכוֹר",note:"QUOTATION BRIDGE — Deuteronomy 32:43 → Hebrews 1:6. Hebrews 1:6 quotes ‘Let all God’s angels worship him.’ This phrase does not exist in the Hebrew MT of Deuteronomy 32:43. It appears in the LXX and in the Dead Sea Scrolls (4QDeutq), which have a longer text. Hebrews cites this absent-from-MT text to prove the Son’s superiority over angels. The argument depends entirely on a text tradition the Hebrew MT does not preserve."},
  G3686:{cp:"H8034",lbl:"שֵם",note:"ALIGNMENT BRIDGE — Joel 2:32 → Acts 2:21; Romans 10:13. ‘Everyone who calls on the name of the Lord will be saved.’ The LXX and Hebrew agree: the name is YHWH/kyrios. Paul quotes this in Romans 10:13 and applies it to Jesus — ‘everyone who calls on the name of the Lord [Jesus]’ will be saved. Because the LXX uses kyrios for YHWH throughout, Paul’s application of kyrios to Jesus carries the full weight of the divine name. Calling on Jesus is, for Paul, calling on YHWH."},
  G5207:{cp:"H1121",lbl:"בֵּן",note:"ALIGNMENT BRIDGE — Hosea 11:1 → Matthew 2:15. ‘Out of Egypt I called my son.’ Hebrew and LXX agree; Matthew’s use is typological, not predictive. In Hosea, the son is Israel — the Exodus is the referent. Matthew reads Jesus as recapitulating Israel’s history: born into the world, refugee in Egypt, called out, baptized through water, tempted in the wilderness forty days. Jesus succeeds where Israel failed. The LXX bridge here is not a divergence but a shared text that Matthew reads at a deeper level."},
  G2316:{cp:"H430",lbl:"אֱלֹהִים",note:"ALIGNMENT BRIDGE — Psalm 82:6 → John 10:34. ‘I said, you are gods (elohim/theoi).’ Hebrew and LXX agree. Jesus quotes this in John 10:34-36 to defend himself against the charge of blasphemy: if the Scripture calls human judges ‘gods,’ how much more can he who was sent by the Father use the title? The argument is a rabbinic kal va-homer (light to heavy inference). The LXX renders elohim as theoi here, which is the word Jesus’s Greek-speaking audience would hear — gods, divine beings — making the argument land with full force."},
  G4102:{cp:"H530",lbl:"אֱמוּנָה",note:"ALIGNMENT BRIDGE (with variant) — Habakkuk 2:4 → Romans 1:17; Galatians 3:11; Hebrews 10:38. Hebrew: ‘the righteous will live by his faithfulness (emunah).’ Paul (Romans, Galatians) quotes without a possessive — ‘by faith.’ The LXX adds mou (‘my’): ‘by my faithfulness’ (God’s faithfulness). Hebrews 10:38 follows the LXX with ‘my righteous one will live by my faith.’ Three NT books quote the same verse differently. The Hebrew emunah is the root of amen — steadfast, trustworthy commitment. Whether the faithfulness is God’s or the believer’s (or both) became the fault line of the Reformation."},
  G1097:{cp:"H3045",lbl:"יָדַע",note:"ALIGNMENT BRIDGE — Jeremiah 31:34 → Hebrews 8:11. ‘They will all know me, from the least to the greatest.’ Hebrew yada and LXX ginosko agree — relational, experiential knowledge, not merely intellectual. Hebrews 8:8-12 quotes Jeremiah 31:31-34 in full (the longest OT quotation in the NT) to prove the new covenant is superior to the old. The promise that all will know YHWH directly — without needing a teacher — is the centrepiece. Direct access to God through Christ is the fulfilment of this new covenant promise."},

  // Hebrew entries (reverse direction)
  H430:{cp:"G2316",lbl:"\u03b8\u03b5\u03cc\u03c2",note:"The LXX renders Elohim as theos. The NT concept of God is rooted directly in the OT Elohim."},
  H7225:{cp:"G746",lbl:"\u1f00\u03c1\u03c7\u03ae",note:"The LXX renders bereshit as en arche. John opens his Gospel with this exact phrase — rewriting Genesis."},
  H216:{cp:"G5457",lbl:"\u03c6\u1ff6\u03c2",note:"The LXX uses phos for or. God's first creative act (Gen 1:3) is echoed in John 1:4-5."},
  H2822:{cp:"G4653",lbl:"\u03c3\u03ba\u03bf\u03c4\u03af\u03b1",note:"The LXX renders choshek as skotos/skotia. The darkness of John 1:5 recalls the primordial darkness of Gen 1:2."},
  H1961:{cp:"G1510",lbl:"\u03b5\u1f34\u03bc\u03b9 / \u03b3\u03af\u03bd\u03bf\u03bc\u03b1\u03b9",note:"Hayah is rendered both as eimi (to be) and ginomai (to become) in the LXX. John uses this distinction carefully in 1:1-3."},
  H7307:{cp:"G4151",lbl:"\u03c0\u03bd\u03b5\u1fe6\u03bc\u03b1",note:"The LXX renders ruach as pneuma. The Spirit/wind/breath of God in the OT is the same pneuma that fills believers in the NT."},
  H3068:{cp:"G2962",lbl:"\u03ba\u03cd\u03c1\u03b9\u03bf\u03c2",note:"YHWH is rendered kyrios in the LXX. NT texts that call Jesus kyrios are applying the divine name directly to him."},
  H1285:{cp:"G1242",lbl:"\u03b4\u03b9\u03b1\u03b8\u03ae\u03ba\u03b7",note:"Berit (covenant) is rendered diatheke in the LXX. Every NT reference to the new covenant is a direct engagement with Israel's berit tradition."},
  H8451:{cp:"G3551",lbl:"\u03bd\u03cc\u03bc\u03bf\u03c2",note:"Torah is rendered nomos in the LXX. Paul's discussions of nomos are always engaging the Torah."},
  H3519:{cp:"G1391",lbl:"\u03b4\u03cc\u03be\u03b1",note:"Kavod (glory, weighty presence) is rendered doxa in the LXX. The glory that filled the tabernacle (Exod 40:34) is the doxa that dwelt among us in the Incarnation."},
  H6918:{cp:"G40",lbl:"\u1f05\u03b3\u03b9\u03bf\u03c2",note:"Qadosh (holy) is rendered hagios in the LXX. The threefold Holy of Isaiah 6 becomes the threefold Holy of Revelation 4 — the same qadosh/hagios."},
  H4899:{cp:"G5547",lbl:"\u03a7\u03c1\u03b9\u03c3\u03c4\u03cc\u03c2",note:"Mashiach (Anointed One) is rendered Christos in the LXX. The NT title Christ is the Hebrew Messiah in Greek letters."},
  H7965:{cp:"G1515",lbl:"\u03b5\u1f30\u03c1\u03ae\u03bd\u03b7",note:"Shalom (wholeness, peace) is rendered eirene in the LXX. NT eirene carries all of shalom's depth — full human flourishing in covenant relationship."},
  H4908:{cp:"G4633",lbl:"\u03c3\u03ba\u03b7\u03bd\u03ae",note:"Mishkan (tabernacle) is rendered skene in the LXX. John 1:14 uses eskēnōsen — the Word tabernacled among us — directly evoking the mishkan."},
  H2580:{cp:"G5485",lbl:"\u03c7\u03ac\u03c1\u03b9\u03c2",note:"Chen (grace, favor) is rendered charis in the LXX. Noah found chen in God's eyes (Gen 6:8); the NT charis of salvation is the same divine favor."},
  H3820:{cp:"G2588",lbl:"\u03ba\u03b1\u03c1\u03b4\u03af\u03b1",note:"Lev (heart) is rendered kardia in the LXX. Write the Torah on their lev/kardia (Jer 31:33) — the promise of the new covenant written on the heart."},
  H5315:{cp:"G5590",lbl:"\u03c8\u03c5\u03c7\u03ae",note:"Nephesh (the whole living self) is rendered psyche in the LXX. Not an immortal soul but a living, breathing whole person — love God with all your nephesh/psyche."},
  H1320:{cp:"G4561",lbl:"\u03c3\u03ac\u03c1\u03be",note:"Basar (flesh) is rendered sarx in the LXX. The Word became sarx/basar (John 1:14) — entering the realm of all living flesh."},
  H120:{cp:"G444",lbl:"\u1f04\u03bd\u03b8\u03c1\u03c9\u03c0\u03bf\u03c2",note:"Adam (human being) is rendered anthropos in the LXX. Paul's second Adam theology (1 Cor 15:45-47) is built entirely on this LXX bridge."},
  H1870:{cp:"G3598",lbl:"\u1f41\u03b4\u03cc\u03c2",note:"Derek (way, path) is rendered hodos in the LXX. Prepare the derek/hodos of the Lord (Isa 40:3; Mark 1:3). I am the hodos/derek (John 14:6)."},
  H3045:{cp:"G1097",lbl:"\u03b3\u03b9\u03bd\u03ce\u03c3\u03ba\u03c9",note:"Yada (to know intimately) is rendered ginosko in the LXX. Eternal life is to yada/ginosko the only true God (John 17:3)."},
  H7725:{cp:"G3340",lbl:"\u03bc\u03b5\u03c4\u03b1\u03bd\u03bf\u03ad\u03c9",note:"Shuv (to turn, return) is rendered metanoeo in the LXX. Return (shuv) to me and I will return to you (Mal 3:7) is the same call as repent (metanoeo)."},
  H5650:{cp:"G1401",lbl:"\u03b4\u03bf\u1fe6\u03bb\u03bf\u03c2",note:"Eved (servant, slave) is rendered doulos in the LXX. The Servant Songs (Isa 42-53) describe the eved YHWH whose suffering redeems. The NT applies every aspect of the eved to Jesus."},
  H539:{cp:"G4100",lbl:"\u03c0\u03b9\u03c3\u03c4\u03b5\u03cd\u03c9",note:"Aman (to be firm, trustworthy; believe) is rendered pisteuo in the LXX. Abraham aman/episteusen God (Gen 15:6) — the same act of trust across both Testaments."},
  H2399:{cp:"G266",lbl:"\u1f01\u03bc\u03b1\u03c1\u03c4\u03af\u03b1",note:"Chet (sin, missing the mark) is rendered hamartia in the LXX. The OT's rich sin vocabulary shapes NT hamartia language profoundly."},
  H2896:{cp:"G18",lbl:"\u1f00\u03b3\u03b1\u03b8\u03cc\u03c2",note:"Tov (good) is rendered agathos in the LXX. God saw that it was tov — seven times in Gen 1. The Lord is tov/agathos (Ps 34:8; Mark 10:18)."},
  H571:{cp:"G225",lbl:"\u1f00\u03bb\u03ae\u03b8\u03b5\u03b9\u03b1",note:"Emet (truthfulness, faithfulness) is rendered aletheia in the LXX. I am the aletheia/emet (John 14:6) — Jesus claims the very faithful reliability of God."},
  H6256:{cp:"G2540",lbl:"\u03ba\u03b1\u03b9\u03c1\u03cc\u03c2",note:"Et (appointed time) is rendered kairos in the LXX. There is an et/kairos for everything (Eccl 3:1). The kairos has been fulfilled (Mark 1:15)."},
  H3117:{cp:"G2250",lbl:"\u1f21\u03bc\u03ad\u03c1\u03b1",note:"Yom (day) is rendered hemera in the LXX. The Day of the Lord (yom YHWH) is the central eschatological concept of the prophets. NT hemera Kyriou is its direct continuation."},
  H281:{cp:"G281",lbl:"\u1f00\u03bc\u03ae\u03bd",note:"Amen is the same word in Hebrew and Greek — untranslated, crossing every linguistic boundary. The same word carrying the same weight of covenant faithfulness across the whole canon."},
  H6951:{cp:"G1577",lbl:"\u1f10\u03ba\u03ba\u03bb\u03b7\u03c3\u03af\u03b1",note:"Qahal (assembly) is rendered ekklesia in the LXX. Jesus's ekklesia (Matt 16:18) is the assembled people of God at Sinai (Deut 4:10) — the same qahal, now expanded."},
  H4438:{cp:"G932",lbl:"\u03b2\u03b1\u03c3\u03b9\u03bb\u03b5\u03af\u03b1",note:"Malkut (kingdom, sovereignty) is rendered basileia in the LXX. The Kingdom of God fulfills Israel's hope for YHWH's malkut over all nations (Dan 2:44; 7:14)."},
  H5030:{cp:"G4396",lbl:"\u03c0\u03c1\u03bf\u03c6\u03ae\u03c4\u03b7\u03c2",note:"Navi (prophet) is rendered prophetes in the LXX. The OT nevi'im spoke by the Spirit; every NT prophetes stands in this tradition."},
  H1369:{cp:"G1411",lbl:"\u03b4\u03cd\u03bd\u03b1\u03bc\u03b9\u03c2",note:"Gevurah (might, power) is rendered dynamis in the LXX. The mighty acts of the Exodus are the template for NT dynamis — the Spirit as power (Acts 1:8)."},

  // ── Tier 2: Blessing, Mercy & Covenant Loyalty ─────────────────────────────
  G1656:{cp:"H2617",lbl:"\u05d7\u05b6\u05e1\u05b6\u05d3",note:"Eleos renders chesed (lovingkindness, steadfast love, covenant loyalty) in the LXX. Chesed is arguably the most important OT covenant word. His chesed endures forever (Ps 136). What does the Lord require but to love chesed/eleos (Mic 6:8)."},
  G2127:{cp:"H1288",lbl:"\u05d1\u05bc\u05b8\u05e8\u05b7\u05da\u05b0",note:"Eulogeo renders barak (to bless) in the LXX. Blessed (baruk/eulogetos) be the Lord is the fundamental Jewish doxology. I will bless those who bless you (Gen 12:3) — the Abrahamic blessing runs through barak/eulogeo."},
  G2129:{cp:"H1293",lbl:"\u05d1\u05bc\u05b0\u05e8\u05b8\u05db\u05b8\u05d4",note:"Eulogia renders berakah (blessing) in the LXX. The priestly blessing (Num 6:24–26), the blessing of the Passover cup, the Sermon on the Mount Beatitudes — all inherit this berakah/eulogia tradition."},
  G4697:{cp:"H7355",lbl:"\u05e8\u05b7\u05d7\u05b7\u05dd",note:"Splanchnizomai (to have compassion) renders racham (womb-love, compassion) in the LXX. God is rachum/compassionate as a mother loves her child (Isa 49:15). Jesus was moved with splanchnizomai/racham repeatedly in the Gospels — visceral, womb-deep compassion."},
  G5046:{cp:"H8549",lbl:"\u05ea\u05b8\u05de\u05b4\u05d9\u05dd",note:"Teleios renders tamim (complete, blameless, whole) in the LXX. Walk before me and be tamim/blameless (Gen 17:1). Be perfect (teleios) as your heavenly Father is perfect (Matt 5:48) — the call to covenant wholeness."},
  G2671:{cp:"H7045",lbl:"\u05e7\u05b0\u05dc\u05b8\u05dc\u05b8\u05d4",note:"Katara renders qelalah (curse) in the LXX. Cursed is everyone who hangs on a tree (Deut 21:23; Gal 3:13) — Paul quotes the Deuteronomy qelalah/katara directly, making the crucifixion the fulfillment of the covenant curse."},
  // ── Blood, Altar & Sacrifice ─────────────────────────────────────────────────
  G129:{cp:"H1818",lbl:"\u05d3\u05bc\u05b8\u05dd",note:"Haima renders dam (blood) in the LXX. The blood of the covenant (dam habrit) at Sinai (Exod 24:8) is the direct background for this is my blood of the covenant (Matt 26:28). Dam/haima is the material of covenant-making throughout Scripture."},
  G2379:{cp:"H4196",lbl:"\u05de\u05b4\u05d6\u05b0\u05d1\u05bc\u05b5\u05d7\u05b7",note:"Thysiasterion renders mizbeach (altar) in the LXX. The altar is the place of meeting between God and humanity through sacrifice. Jesus as both priest and sacrifice supersedes the mizbeach/thysiasterion (Heb 13:10)."},
  G4442:{cp:"H784",lbl:"\u05d0\u05b5\u05e9\u05c1",note:"Pyr renders esh (fire) in the LXX. The burning bush (Exod 3:2), the pillar of fire (Exod 13:21), God as consuming fire (Deut 4:24; Heb 12:29), and tongues of fire at Pentecost (Acts 2:3) — all esh/pyr."},
  G2436:{cp:"H3722",lbl:"\u05db\u05bc\u05b4\u05e4\u05bc\u05b6\u05e8",note:"Hilasmos/hilastērion renders kipper/kapporeth (atonement cover, mercy seat) in the LXX. The Day of Atonement (Yom Kippur) is the OT background for NT propitiation. Christ is the hilastērion/kapporeth — the mercy seat — (Rom 3:25)."},
  // ── Wrath, Justice & Judgment ───────────────────────────────────────────────
  G3709:{cp:"H639",lbl:"\u05d0\u05b7\u05e3",note:"Orgē renders af (anger, literally nostril — anger was seen in flared nostrils) in the LXX. The wrath/orgē of God in the NT (Rom 1:18; Rev 19:15) is the same divine af that burns against covenant unfaithfulness throughout the OT."},
  G2920:{cp:"H4941",lbl:"\u05de\u05b4\u05e9\u05c1\u05e4\u05bc\u05b8\u05d8",note:"Krisis renders mishpat (judgment, justice, legal decision) in the LXX. Mishpat is not merely punishment but right ordering of society. Do mishpat/justice (Mic 6:8; Isa 1:17). NT krisis carries both the corrective and punitive dimensions of mishpat."},
  G1557:{cp:"H5360",lbl:"\u05e0\u05b0\u05e7\u05b8\u05de\u05b8\u05d4",note:"Ekdikēsis renders neqamah (vengeance, vindication) in the LXX. Vengeance is mine, I will repay (Deut 32:35; Rom 12:19) — the same neqamah/ekdikēsis. OT vengeance belongs to God as the vindicator of the wronged."},
  // ── The Justice Triad ────────────────────────────────────────────────────────
  G5503:{cp:"H490",lbl:"\u05d0\u05b7\u05dc\u05b0\u05de\u05b8\u05e0\u05b8\u05d4",note:"Chēra renders almanah (widow) in the LXX. The widow, orphan, and stranger are the defining test of covenant faithfulness in the OT (Exod 22:22; Isa 1:17; Zech 7:10). Jesus's care for widows and James's definition of pure religion (Jas 1:27) continue this tradition."},
  G3737:{cp:"H3490",lbl:"\u05d9\u05b8\u05ea\u05d5\u05b9\u05dd",note:"Orphanos renders yatom (orphan, fatherless) in the LXX. I will not leave you as orphans (John 14:18) — Jesus uses orphanos/yatom deliberately, promising his disciples the presence that the OT promised to the fatherless (Ps 68:5)."},
  G3941:{cp:"H1616",lbl:"\u05d2\u05bc\u05b5\u05e8",note:"Paroikos/xenos renders ger (stranger, sojourner, resident alien) in the LXX. You shall love the ger/stranger (Lev 19:34). The NT community is composed of paroikoi/strangers and aliens (1 Pet 2:11) — the ger becomes a description of God's people."},
  G4434:{cp:"H6041",lbl:"\u05e2\u05b8\u05e0\u05b4\u05d9",note:"Ptōchos renders ani (poor, afflicted, humble) in the LXX. Blessed are the ptōchoi/poor in spirit (Matt 5:3). The anawim — the humble poor of Israel (Zeph 3:12; Ps 22:26) — are the community Jesus names as inheritors of the kingdom."},
  G1654:{cp:"H6666",lbl:"\u05e6\u05b0\u05d3\u05b8\u05e7\u05b8\u05d4",note:"Eleēmosynē renders tsedaqah (righteousness, right-doing) in the LXX. In Jewish tradition tsedaqah came to mean almsgiving — righteous action toward the poor. Matthew uses eleēmosynē for charitable giving (Matt 6:2–4), inheriting this tsedaqah tradition."},
  // ── Praise & Worship ────────────────────────────────────────────────────────
  G134:{cp:"H1984",lbl:"\u05d4\u05b8\u05dc\u05b7\u05dc",note:"Aineō renders halal (to praise, boast in) in the LXX. Hallelujah (hallelu-Yah) literally means praise YHWH — halal + Yah. The Hallel Psalms (113–118) are sung at Passover; the NT hallelujah (Rev 19:1–6) brings this praise into the eternal."},
  G5567:{cp:"H2167",lbl:"\u05d6\u05b8\u05de\u05b7\u05e8",note:"Psallō renders zamar (to sing, make music with strings) in the LXX. The Psalms (from psallō) are themselves named after this act of musical praise. Sing and make music in your heart (Eph 5:19) — the same zamar/psallō tradition."},
  G2168:{cp:"H3034",lbl:"\u05d9\u05b8\u05d3\u05b8\u05d4",note:"Eucharisteō (to give thanks) relates to the LXX rendering of yadah (to give thanks, praise, confess). Eucharist — the NT thanksgiving meal — carries this yadah tradition. Give thanks (yadah/eucharisteō) in all circumstances (1 Thess 5:18)."},
  G1391:{cp:"H1984",lbl:"\u05d4\u05b8\u05dc\u05b7\u05dc",note:"The verbal halal also underlies the concept of boasting in glory. Paul's boasting (kauchaomai) in weakness echoes the OT's halal — only in God should one halal/glory (Jer 9:24; 1 Cor 1:31)."},
  // ── Dwelling & Presence ─────────────────────────────────────────────────────
  G4637:{cp:"H7931",lbl:"\u05e9\u05b8\u05db\u05b7\u05df",note:"Skēnoō (to tabernacle, dwell) renders shakan (to dwell, settle) in the LXX. Shakan is the root of Shekinah — the divine dwelling presence. John 1:14 uses eskēnōsen (he tabernacled) — the Shekinah/shakan has arrived in the Incarnation."},
  G3485:{cp:"H1964",lbl:"\u05d4\u05b5\u05d9\u05db\u05b8\u05dc",note:"Naos renders heykhal (inner sanctuary, main hall of the temple) in the LXX. Paul's body is a naos/heykhal (1 Cor 6:19). The new Jerusalem has no naos because God himself is its heykhal (Rev 21:22)."},
  G4396:{cp:"H7121",lbl:"\u05e7\u05b8\u05e8\u05b0\u05d0",note:"The prophetic call (qara) and the NT kerygma (proclamation) are deeply connected. The voice of one crying/qara in the wilderness (Isa 40:3) uses the same root as the proclamation/qara of the prophets."},
  // ── Feasts & Sacred Time ─────────────────────────────────────────────────────
  G4521:{cp:"H7676",lbl:"\u05e9\u05b7\u05bc\u05d1\u05bc\u05b8\u05ea",note:"Sabbaton renders shabbat (rest, cessation) in the LXX. The Sabbath rhythm of creation (Gen 2:2–3) and the Sinai commandment (Exod 20:8–11) form the background for NT Sabbath debates and Christ as Lord of the Sabbath (Mark 2:28)."},
  G3957:{cp:"H6453",lbl:"\u05e4\u05bc\u05b6\u05e1\u05b7\u05d7",note:"Pascha renders pesach (Passover) in the LXX. Christ our Passover lamb has been sacrificed (1 Cor 5:7) — Paul identifies Jesus directly with the pesach/pascha lamb. The Last Supper is a Passover meal; Eucharistic theology is built on pesach."},
  G4005:{cp:"H7620",lbl:"\u05e9\u05b8\u05d1\u05d5\u05bc\u05e2\u05d5\u05b9\u05ea",note:"Pentēkostē renders Shavuot (Weeks, Pentecost) in the LXX — the feast 50 days after Passover. The Spirit was poured out on Shavuot/Pentecost (Acts 2), the same feast on which, according to tradition, the Torah was given at Sinai."},
  // ── Key Verbs (Tier 2) ──────────────────────────────────────────────────────
  G191:{cp:"H8085",lbl:"\u05e9\u05b8\u05de\u05b7\u05e2",note:"Akouō renders shama (to hear, listen, obey) in the LXX. The Shema — Hear/shama, O Israel (Deut 6:4) — is the foundational Jewish prayer. Shama implies obedient response; to hear is to heed. He who has ears to hear, let him akouō/shama (Matt 11:15)."},
  G4982:{cp:"H3467",lbl:"\u05d9\u05b8\u05e9\u05b7\u05e2",note:"Sōzō renders yasha (to save, deliver) in the LXX. Yasha is the verbal root of Yeshua (Jesus), Joshua, and Isaiah (Yeshayahu). Every use of sōzō/save in the NT resonates with the name of the Savior himself."},
  G2564:{cp:"H7121",lbl:"\u05e7\u05b8\u05e8\u05b8\u05d0",note:"Kaleō renders qara (to call, name, proclaim) in the LXX. I have called you by name (Isa 43:1). God's calling/vocation language in the NT (Rom 8:28–30; 1 Cor 1:9) inherits the OT qara/kaleō tradition of divine appointment."},
  G3306:{cp:"H3427",lbl:"\u05d9\u05b8\u05e9\u05b7\u05d1",note:"Menō (to remain, abide) renders yashav (to dwell, sit, remain) in the LXX. Abide in me and I in you (John 15:4) — the mutual menō/yashav is the NT form of the OT covenant dwelling relationship."},
  G142:{cp:"H5375",lbl:"\u05e0\u05b8\u05e9\u05c2\u05b8\u05d0",note:"Airō (to lift up, take away) renders nasa (to lift, bear, carry) in the LXX. Behold the Lamb who takes away (airō) the sin of the world (John 1:29). The Suffering Servant who bears/nasa our sins (Isa 53:4, 12) is the direct background."},
  G2346:{cp:"H6869",lbl:"\u05e6\u05b8\u05e8\u05b8\u05d4",note:"Thlipsis (tribulation, pressure) renders tsarah (distress, trouble) in the LXX. In the world you will have thlipsis/tsarah (John 16:33). The OT's many tsarah situations — exile, persecution, suffering — shape the NT understanding of tribulation as the path of the righteous."},
  G2212:{cp:"H1875",lbl:"\u05d3\u05b8\u05e8\u05b7\u05e9\u05c1",note:"Zēteō (to seek) renders darash (to seek, inquire of God) in the LXX. Seek (darash/zēteō) the Lord while he may be found (Isa 55:6). Ask and it will be given; seek (zēteō) and you will find (Matt 7:7) — the NT inherits this OT seeking tradition."},
  G2564:{cp:"H5375",lbl:"\u05e0\u05b8\u05e9\u05c2\u05b8\u05d0",note:"Nasa also underlies the priest's lifting of the blessing over the people (Num 6:23–26 — nasa the name of the Lord over them). The high-priestly blessing and Jesus lifting his hands to bless his disciples (Luke 24:50) connect through nasa."},
  // ── Throne & Kingdom ────────────────────────────────────────────────────────
  G2362:{cp:"H3678",lbl:"\u05db\u05bc\u05b4\u05e1\u05bc\u05b5\u05d0",note:"Thronos renders kissē (throne) in the LXX. The Lord's throne is in heaven (Ps 11:4); God sits enthroned above the cherubim (Ps 99:1). The throne room of Rev 4–5 draws directly on Isaiah 6 and Ezekiel 1 — the same kissē/thronos."},
  G4592:{cp:"H226",lbl:"\u05d0\u05d5\u05b9\u05ea",note:"Sēmeion renders ot (sign, token, miracle) in the LXX. The signs of Moses (Exod 4:8–9), the sign of the covenant (Gen 9:12–13; 17:11), and the miraculous signs of the prophets are the OT ot/sēmeion tradition that Jesus's signs (John) both fulfill and exceed."},
  G5154:{cp:"H7992",lbl:"\u05e9\u05b0\u05dc\u05b4\u05d9\u05e9\u05c1\u05b4\u05d9",note:"Tritos (third) and the pattern of third-day events in the LXX. On the third day Abraham saw the place (Gen 22:4); Jonah in the fish three days (Jon 1:17); God will revive us after two days, on the third day raise us up (Hos 6:2) — the pattern that Paul cites for the resurrection (1 Cor 15:4)."},
  // ── More Creation & Nature ──────────────────────────────────────────────────
  G3772:{cp:"H8064",lbl:"\u05e9\u05b8\u05de\u05b7\u05d9\u05b4\u05dd",note:"Ouranos renders shamayim (heaven, sky, the heavens) in the LXX. Our Father in heaven/ouranos/shamayim (Matt 6:9). The kingdom of heaven/ouranos is the kingdom of shamayim — the same divine realm across both Testaments."},
  G3624:{cp:"H1004",lbl:"\u05d1\u05bc\u05b7\u05d9\u05b4\u05ea",note:"Oikos renders bayit (house, household, dynasty) in the LXX. House of Israel, house of David, house of God — bayit is one of the most flexible OT terms. The church as oikos/bayit of God (1 Tim 3:15; 1 Pet 4:17) inherits this rich OT usage."},
  G68:{cp:"H7704",lbl:"\u05e9\u05b8\u05d3\u05b6\u05d4",note:"Agros renders sadeh (field) in the LXX. The field of the world (Matt 13:38), the field bought with blood money (Matt 27:7–8, echoing Jer 32) — agros/sadeh is the locale of both labor and parable throughout Scripture."},
  // ── Social Ethics ───────────────────────────────────────────────────────────
  G3741:{cp:"H2623",lbl:"\u05d7\u05b8\u05e1\u05b4\u05d9\u05d3",note:"Hosios (devout, holy) renders chasid (faithful, devoted one, saint) in the LXX. The Hasidim — the devout ones of Israel — embody chesed/chasid. Blessed are the hosios/chasid (Ps 16:10; Acts 2:27 applies this to Jesus)."},
  G1344:{cp:"H6663",lbl:"\u05e6\u05b8\u05d3\u05b7\u05e7",note:"Dikaioō (to justify, declare righteous) renders tsadaq (to be righteous, be vindicated) in the LXX. The servant shall justify/tsadaq/dikaioō many (Isa 53:11). Paul's doctrine of justification is built directly on the LXX's use of tsadaq/dikaioō."},
  G5087:{cp:"H7760",lbl:"\u05e9\u05d5\u05bc\u05dd",note:"Tithēmi (to place, appoint) renders sum/sim (to place, set, appoint) in the LXX. I have placed/sum/tithēmi you as a covenant for the people (Isa 42:6; 49:8) — God's appointing of the Servant is the background for NT language of divine appointment."},
  // ── Important Hebrew reverse entries ────────────────────────────────────────
  H2617:{cp:"G1656",lbl:"\u1f14\u03bb\u03b5\u03bf\u03c2",note:"Chesed (lovingkindness, steadfast love, covenant loyalty) is rendered eleos in the LXX. Chesed is perhaps the single most important OT covenant word — it describes God's faithful, persistent, loyal love. His chesed endures forever (Ps 136, repeated 26 times)."},
  H7355:{cp:"G4697",lbl:"\u03c3\u03c0\u03bb\u03b1\u03b3\u03c7\u03bd\u03af\u03b6\u03bf\u03bc\u03b1\u03b9",note:"Racham (womb-love, deep compassion) is rendered splanchnizomai in the LXX. God is el rachum (Exod 34:6) — compassionate like a mother's womb-love for her child. Jesus was moved with splanchnizomai/racham at human suffering throughout the Gospels."},
  H7676:{cp:"G4521",lbl:"\u03c3\u03ac\u03b2\u03b2\u03b1\u03c4\u03bf\u03bd",note:"Shabbat (rest, cessation) is rendered sabbaton in the LXX — untranslated, the Hebrew word enters Greek directly. The creation rest, the Sinai commandment, and Jesus as Lord of the Sabbath all converge in this shabbat/sabbaton."},
  H6453:{cp:"G3957",lbl:"\u03c0\u03ac\u03c3\u03c7\u03b1",note:"Pesach (Passover, to pass over) is rendered pascha in the LXX. Christ our pascha/pesach has been sacrificed (1 Cor 5:7). The Eucharist is the new Passover — from pesach meal to pascha sacrament."},
  H7931:{cp:"G4637",lbl:"\u03c3\u03ba\u03b7\u03bd\u03cc\u03c9",note:"Shakan (to dwell, settle) is rendered skēnoō in the LXX. Shakan is the root of Shekinah — the divine dwelling presence. John 1:14 uses eskēnōsen: the Shekinah/shakan glory has arrived in human flesh."},
  H8085:{cp:"G191",lbl:"\u1f00\u03ba\u03bf\u03cd\u03c9",note:"Shama (to hear, listen, obey) is rendered akouō in the LXX. The Shema — shama O Israel, the Lord is one (Deut 6:4) — is the foundational Jewish prayer. To shama/hear is to obey; hearing without doing is a contradiction (Jas 1:22)."},
  H3467:{cp:"G4982",lbl:"\u03c3\u03ce\u03b6\u03c9",note:"Yasha (to save, deliver) is rendered sōzō in the LXX. Yasha is the verbal root of Yeshua/Jesus, Joshua, and Isaiah. Every NT use of sōzō resonates with this root — the Savior embodies the very act of salvation in his name."},
  H1984:{cp:"G134",lbl:"\u03b1\u1f34\u03bd\u03b5\u03c9",note:"Halal (to praise, boast in) is rendered aineō in the LXX. Hallelu-Yah means praise YHWH — halal + Yah. The Hallel Psalms (113–118) sung at Passover reach their NT fulfillment in the great hallelujah chorus of Rev 19."},
  H1004:{cp:"G3624",lbl:"\u03bf\u1f36\u03ba\u03bf\u03c2",note:"Bayit (house, household, dynasty) is rendered oikos in the LXX. House of Israel, house of David, house of God — bayit/oikos is extraordinarily flexible. The church as oikos/bayit of God inherits the full weight of the OT's household theology."},
  H3678:{cp:"G2362",lbl:"\u03b8\u03c1\u03cc\u03bd\u03bf\u03c2",note:"Kissē (throne) is rendered thronos in the LXX. The Lord's throne is in heaven (Ps 11:4). The throne room visions of Isaiah 6, Ezekiel 1, and Daniel 7 form the direct background for the throne of Revelation 4–5."},
  H4196:{cp:"G2379",lbl:"\u03b8\u03c5\u03c3\u03b9\u03b1\u03c3\u03c4\u03ae\u03c1\u03b9\u03bf\u03bd",note:"Mizbeach (altar) is rendered thysiasterion in the LXX. The altar is the meeting point between God and humanity through sacrifice. The NT's once-for-all sacrifice supersedes the mizbeach/thysiasterion (Heb 10:12; 13:10)."},
  H1818:{cp:"G129",lbl:"\u03b1\u1f37\u03bc\u03b1",note:"Dam (blood) is rendered haima in the LXX. The blood of the covenant (dam habrit) at Sinai (Exod 24:8) is the background for this is my blood of the covenant (Matt 26:28). Dam/haima is the substance of covenant."},
  H6041:{cp:"G4434",lbl:"\u03c0\u03c4\u03c9\u03c7\u03cc\u03c2",note:"Ani (poor, afflicted, humble) is rendered ptōchos in the LXX. The anawim — the humble poor of Israel — are those who trust entirely in God. Blessed are the ptōchoi/poor in spirit (Matt 5:3) — the anawim tradition is fulfilled."},
  H8064:{cp:"G3772",lbl:"\u03bf\u1f50\u03c1\u03b1\u03bd\u03cc\u03c2",note:"Shamayim (heaven, sky) is rendered ouranos in the LXX. Our Father in the shamayim/ouranos (Matt 6:9). The kingdom of ouranos/shamayim is God's sovereign reign coming to earth as it is in heaven."},
  H6663:{cp:"G1344",lbl:"\u03b4\u03b9\u03ba\u03b1\u03b9\u03cc\u03c9",note:"Tsadaq (to be righteous, be vindicated) is rendered dikaioō in the LXX. The servant shall justify/tsadaq/dikaioō many, bearing their iniquities (Isa 53:11). Paul's justification doctrine is rooted directly in this Servant Song."},
  // ── Additional vocabulary bridges ─────────────────────────────────────────
  H4325:{cp:"G5204",lbl:"מַיִם",note:"Mayim (water/waters) is rendered hudōr in the LXX. The Spirit hovered over the waters at creation (Gen 1:2); the Red Sea parted; the Jordan was crossed. Jesus offers living water (John 4:10); baptism transforms the chaos water into new creation. In the new world, clear hudōr/mayim flows from the throne (Rev 22:1)."},
  H784:{cp:"G4442",lbl:"אֵשׁ",note:"Esh (fire) is rendered pyr in the LXX. God appeared to Moses in fire (Exod 3:2); the pillar of fire led Israel; God is a consuming pyr/esh (Deut 4:24; Heb 12:29). The Spirit descended as tongues of pyr/esh at Pentecost (Acts 2:3). John baptizes with water but Jesus with pyr (Matt 3:11)."},
  H7307:{cp:"G4151",lbl:"רוּחַ",note:"Ruach (wind, breath, spirit) is rendered pneuma in the LXX — one of the most theologically significant bridges in all of Scripture. The ruach/pneuma of God hovered over the waters at creation (Gen 1:2). Nicodemus's puzzlement about being born of pneuma/ruach (John 3:8) plays on this same word: the pneuma/ruach blows where it will."},
  H3117:{cp:"G2250",lbl:"יוֹם",note:"Yom (day) is rendered hēmera in the LXX. The seven days of creation, the Sabbath day, the Day of the Lord/yom YHWH — yom/hēmera carries enormous theological freight. The Last Day/hēmera (John 6:39–40) looks back to the prophetic Day of the Lord. On the first day of the week/hēmera, resurrection inaugurates a new creation week."},
  H2416:{cp:"G2198",lbl:"חַי",note:"Chay (living, alive, life) is rendered zaō in the LXX. The living God (El Chay) is a central OT divine title. Jesus is the living bread (zaō) and the resurrection and the life (John 6:51; 11:25). God is the God of the living/zaō (Matt 22:32). As the Father has zaō in himself, so he has granted the Son to have zaō in himself (John 5:26)."},
  H4194:{cp:"G2288",lbl:"מָוֶת",note:"Mavet (death) is rendered thanatos in the LXX. Death entered through Adam (Rom 5:12). O death/mavet, where is your sting? (Hos 13:14; 1 Cor 15:55). The last enemy to be destroyed is thanatos/mavet (1 Cor 15:26). Jesus holds the keys of death/thanatos and Hades (Rev 1:18) — the conqueror of mavet."},
  H3820:{cp:"G2588",lbl:"לֵב",note:"Lev (heart, the inner person — intellect, will, and emotion) is rendered kardia in the LXX. In Hebrew thought the heart/lev is the seat of thought, not just feeling. Love the Lord with all your lev/kardia (Deut 6:5; Matt 22:37). God writes his law on the kardia/lev (Jer 31:33; 2 Cor 3:3). God searches the kardia/lev (Jer 17:10; Rev 2:23)."},
  H5315:{cp:"G5590",lbl:"נֶפֶשׁ",note:"Nephesh (soul, living being, person, self) is rendered psychē in the LXX. Nephesh is not an immortal soul separate from the body but the whole living self, the person. Man became a living nephesh/psychē (Gen 2:7). What will a man give in exchange for his psychē/nephesh? (Matt 16:26). The Servant pours out his nephesh to death (Isa 53:12)."},
  H1320:{cp:"G4561",lbl:"בָּשָׂר",note:"Basar (flesh, body, all humanity, mortal existence) is rendered sarx in the LXX. All flesh/basar is grass (Isa 40:6). The Word became sarx/basar (John 1:14) — the Incarnation uses basar/sarx to express the full vulnerability and mortality of human life. The spirit is willing but the sarx/basar is weak (Matt 26:41)."},
  H5869:{cp:"G3788",lbl:"עַיִן",note:"Ayin (eye, spring/fountain) is rendered ophthalmos in the LXX. The lamp of the body is the ophthalmos/ayin (Matt 6:22) — the eye as the spiritual window of the inner person. The wells of water in the wilderness and the Samaritan woman's well connect ayin/eye with ayin/spring, pointing to the living water Jesus offers (John 4:14)."},
  H3027:{cp:"G5495",lbl:"יָד",note:"Yad (hand, strength, power, authority) is rendered cheir in the LXX. The mighty yad of God in the Exodus (Exod 3:20). The Son of Man sitting at God's right cheir/yad (Ps 110:1; Matt 22:44). No one can snatch from my cheir/yad (John 10:28). The nail scars in Jesus's cheiras identify the risen Lord (John 20:27)."},
  H251:{cp:"G80",lbl:"אָח",note:"Ach (brother) is rendered adelphos in the LXX. Abraham called Lot his ach (Gen 13:8). The OT concept of brotherhood within Israel's covenant community is widened in the NT: whoever does the will of my Father is my adelphos/ach (Matt 12:50). Go tell my adelphoi/achim (Matt 28:10) — the resurrection creates a new family."},
  H1:{cp:"G3962",lbl:"אָב",note:"Av (father, ancestor, source) is rendered patēr in the LXX. The God of your avot/fathers (Exod 3:6). God's fatherhood expressed in the Psalms (Ps 89:26; 103:13) reaches its NT fulfillment in Jesus teaching his disciples to pray Abba/patēr (Mark 14:36; Matt 6:9). Jesus speaks of my Father and your Father (John 20:17)."},
  H1121:{cp:"G5207",lbl:"בֵּן",note:"Ben (son, descendant, member of a community) is rendered huios in the LXX. Son of God in the OT applies to Israel (Exod 4:22; Hos 11:1; Matt 2:15 applies this to Jesus), to the king (Ps 2:7), and to divine beings (Gen 6:2; Job 1:6). Jesus as huios/ben of God fulfills all three. You are my huios/ben; today I have begotten you (Ps 2:7; Heb 1:5)."},
  H7453:{cp:"G4139",lbl:"רֵעַ",note:"Rea (neighbor, companion, friend) is rendered plēsion in the LXX. Love your rea/plēsion as yourself (Lev 19:18; Matt 22:39) — the second great commandment. The lawyer's question — who is my plēsion/rea? (Luke 10:29) — provokes the Parable of the Good Samaritan, which expands the neighbor's identity beyond ethnic boundaries."},
  H802:{cp:"G1135",lbl:"אִשָּׁה",note:"Ishah (woman, wife) is rendered gynē in the LXX. The first ishah was taken from ish/man (Gen 2:23). The woman clothed with the sun (Rev 12:1) and the Bride of the Lamb (Rev 19:7) elevate gynē/ishah to cosmic symbol. Jesus addresses his mother as gynē/woman at Cana and Calvary (John 2:4; 19:26)."},
  H8451:{cp:"G3551",lbl:"תּוֹרָה",note:"Torah (instruction, teaching, law — God's covenant guidance for life) is rendered nomos in the LXX. Torah is not merely legal code but YHWH's total instruction for covenant life. Do not think I came to abolish the nomos/Torah (Matt 5:17). Paul's complex theology of nomos/Torah in Romans and Galatians assumes the LXX rendering."},
  H4687:{cp:"G1785",lbl:"מִצְוָה",note:"Mitzvah (commandment, divine directive) is rendered entolē in the LXX. Which entolē/mitzvah is greatest? (Matt 22:36). Jesus gives a new entolē — that you love one another as I have loved you (John 13:34). Keeping the entolai/mitzvot of God is the mark of those who know him (1 John 2:3–4)."},
  H1285:{cp:"G1242",lbl:"בְּרִית",note:"Berit (covenant, binding agreement, treaty sealed in blood) is rendered diathēkē in the LXX. The Abrahamic covenant (Gen 15, 17), the Mosaic covenant (Exod 19–24), the Davidic covenant (2 Sam 7), and the New Covenant (Jer 31:31–34) — berit/diathēkē is the structural spine of all of Scripture. This cup is the new diathēkē/berit in my blood (Luke 22:20)."},
  H5769:{cp:"G165",lbl:"עוֹלָם",note:"Olam (forever, the distant past or future, the age to come) is rendered aiōn in the LXX. Olam does not mean 'timeless eternity' but 'the long age, the horizon beyond sight.' Everlasting/olam life = aiōnios/olam life = life of the coming age. This present evil aiōn/olam ends; the aiōn/olam to come begins at resurrection."},
  H4941:{cp:"G2920",lbl:"מִשְׁפָּט",note:"Mishpat (justice, judgment, legal decision, rights of the poor) is rendered krisis in the LXX. Mishpat is one of the OT's great social-justice words: act justly/mishpat (Mic 6:8). God maintains the mishpat/krisis of the oppressed (Ps 103:6). The eschatological krisis — the Last Judgment — is the ultimate mishpat, the final vindication of justice."},
  H6944:{cp:"G40",lbl:"קֹדֶשׁ",note:"Qodesh (holiness, sacred, set apart for God) is rendered hagios in the LXX. The Holy of Holies/qodesh haqodashim is the innermost sacred space. Holy, holy, holy is the LORD of hosts (Isa 6:3 — qodesh/hagios). The Holy Spirit/Hagios Pneuma (the Spirit of holiness/qodesh) is the divine agent who makes God's people qodesh/hagioi."},
  H3548:{cp:"G2409",lbl:"כֹּהֵן",note:"Kohen (priest, one who ministers before God) is rendered hiereus in the LXX. The Aaronic/Levitical kohanim mediated between God and Israel. Melchizedek was a kohen/hiereus of God Most High (Gen 14:18; Heb 7). Jesus is the great High Priest/hiereus after the order of Melchizedek, superseding and fulfilling the Levitical priesthood (Heb 4:14; 7:17)."},
  H2077:{cp:"G2378",lbl:"זֶבַח",note:"Zevach (sacrifice, offering involving slaughter) is rendered thysia in the LXX. I desire hesed/mercy not zevach/thysia (Hos 6:6; Matt 9:13; 12:7) — Jesus quotes the prophetic critique of mere ritual. Present your bodies as a living thysia/zevach (Rom 12:1) — NT worship transforms animal sacrifice into living surrender."},
  H2403:{cp:"G266",lbl:"חַטָּאת",note:"Chatat (sin; sin offering — the same Hebrew word for both) is rendered hamartia in the LXX. The identity of sin and sin-offering in one word is profound: the remedy is named after the disease. God made Jesus to be hamartia/chatat for us (2 Cor 5:21). Behold the Lamb who takes away the hamartia/chatat of the world (John 1:29)."},
  H3519:{cp:"G1391",lbl:"כָּבוֹד",note:"Kavod (glory, weighty visible presence, honor) is rendered doxa in the LXX. The kavod YHWH filled the Tabernacle (Exod 40:34–35) and the Temple (1 Kgs 8:11). The Word became flesh and we beheld his doxa/kavod (John 1:14). The doxa/kavod on Moses's face (Exod 34:29–35; 2 Cor 3:7–11). All have sinned and fall short of the doxa/kavod of God (Rom 3:23)."},
  H7812:{cp:"G4352",lbl:"שָׁחָה",note:"Shachah (to bow down, prostrate oneself in worship) is rendered proskyneō in the LXX. Abraham bowed/shachah before his heavenly visitors (Gen 18:2). All the earth will shachah/proskyneō (Ps 22:27). The Magi came to proskyneō the newborn king (Matt 2:2). Satan offered proskyneō on false terms (Matt 4:9) — shachah/proskyneō belongs to God alone."},
  H8416:{cp:"G5215",lbl:"תְּהִלָּה",note:"Tehillah (praise, hymn, song of adoration) is rendered hymnos in the LXX. The Book of Psalms is Sefer Tehillim — the Book of Praises. Out of the mouths of infants you have prepared tehillah/praise (Ps 8:2; Matt 21:16 — the children's acclamation in the Temple). Jesus and his disciples sang a hymnos/tehillah before Gethsemane (Matt 26:30)."},
  H157:{cp:"G25",lbl:"אָהַב",note:"Ahav (to love, be devoted to) is rendered agapaō in the LXX. YHWH's ahav for Israel is covenantal, persistent love — like the love between husband and wife (Hos 1–3). God so agapaō/ahav the world (John 3:16). The great commandment uses agapaō/ahav for both God and neighbor. Agape love is covenant commitment that acts on behalf of the beloved."},
  H3372:{cp:"G5399",lbl:"יָרֵא",note:"Yare (to fear, revere, stand in awe of) is rendered phobeomai in the LXX. The fear of the Lord/yirat YHWH is the beginning of wisdom (Prov 9:10; Ps 111:10). NT phobeomai/fear of God retains the OT's sense of reverent awe before the Holy One. Fear God and give him glory (Rev 14:7; 1 Pet 1:17)."},
  H5414:{cp:"G1325",lbl:"נָתַן",note:"Natan (to give, grant, place, allow) is rendered didōmi in the LXX. God natan/didōmi the Torah (Exod 20); the Father gives/didōmi life to the Son (John 5:26). For God so loved the world that he gave/edōken his only Son (John 3:16) — the supreme act of divine natan/didōmi is the gift of the Son himself."},
  H3045:{cp:"G1097",lbl:"יָדַע",note:"Yada (to know through experience, relational intimacy) is rendered ginōskō in the LXX. Biblical yada is participatory — to know is to be in relationship with. Adam yada/knew Eve (Gen 4:1). Jesus and the Father ginōskō/yada each other mutually (John 10:15). To know God is eternal life (John 17:3). I never ginōskō/yada you (Matt 7:23)."},
  H7200:{cp:"G3708",lbl:"רָאָה",note:"Ra'ah (to see, perceive, experience) is rendered horaō in the LXX. God ra'ah/saw that it was good (Gen 1:4). YHWH Yireh — the LORD will provide/see (Gen 22:14). Blessed are the pure in heart, for they shall horaō/ra'ah God (Matt 5:8). The one who has seen/horaō me has seen the Father (John 14:9)."},
  H1980:{cp:"G4198",lbl:"הָלַךְ",note:"Halak (to walk, go, conduct oneself — the OT's primary ethical metaphor) is rendered poreuomai in the LXX. Walk/halak before me and be blameless (Gen 17:1). To walk in God's ways is the standard OT expression for faithful living. Going/poreuomai into all the world to make disciples (Matt 28:19) carries the full OT weight of halak in the ways of the LORD."},
  H7971:{cp:"G649",lbl:"שָׁלַח",note:"Shalach (to send, dispatch, commission) is rendered apostellō in the LXX — the direct root of apostolos/apostle. The prophets were sent/shalach (Isa 6:8; Jer 1:7). As the Father sent/apostellō me, so I also apostellō you (John 20:21). The apostolic mission is the continuation of YHWH's sending of his servants through all of history."},
  H2142:{cp:"G3421",lbl:"זָכַר",note:"Zakar (to remember, invoke, mention) is rendered mimnēskomai in the LXX. God's remembering/zakar in the OT is always active — when God remembers, he acts: God remembered/zakar Noah (Gen 8:1), his covenant (Exod 2:24). Do this in mimnēskomai/zakar of me (Luke 22:19) — the Eucharist as active covenant remembrance."},
  H1288:{cp:"G2127",lbl:"בָּרַךְ",note:"Barak (to bless, to kneel, to confer God's favor) is rendered eulogeō in the LXX. The Aaronic blessing (Num 6:24–26), the blessing of Abraham (Gen 12:3), the blessings at Sinai — barak/eulogeō is how divine favor flows. Blessed/eulogēmenos is the one who comes in the name of the Lord (Ps 118:26; Matt 21:9). God eulogeō/barak us in Christ with every spiritual blessing (Eph 1:3)."},
  H6419:{cp:"G4336",lbl:"פָּלַל",note:"Palal (to pray, intercede, mediate) is rendered proseuchomai in the LXX. Solomon palal/prayed at the Temple dedication (1 Kgs 8:28–30). Hannah palal and the LORD remembered her (1 Sam 1:10–20). Jesus teaches proseuchomai/palal in secret to the Father (Matt 6:6). The Spirit himself intercedes for us with groanings too deep for words (Rom 8:26–27)."},
  H2451:{cp:"G4678",lbl:"חָכְמָה",note:"Chokmah (wisdom — practical, relational, skill-based understanding of God's order) is rendered sophia in the LXX. The fear of the Lord is the beginning of chokmah/sophia (Prov 9:10). Wisdom/chokmah was with God at creation, a master craftsman (Prov 8:22–31). Christ is identified with the sophia/chokmah of God (1 Cor 1:24, 30; Col 2:3) — the embodied Wisdom of creation."},
  H571:{cp:"G225",lbl:"אֱמֶת",note:"Emet (truth, faithfulness, reliability, dependability) is rendered alētheia in the LXX. Emet is relational — it describes what can be trusted and depended upon. God's emet/alētheia is paired with chesed/lovingkindness (Ps 89:14). Full of grace and alētheia/emet (John 1:14). I am the alētheia (John 14:6) — Jesus embodies YHWH's covenant faithfulness."},
  H7965:{cp:"G1515",lbl:"שָׁלוֹם",note:"Shalom (peace, wholeness, wellbeing, completeness, right relationships) is rendered eirēnē in the LXX. Shalom is far richer than absence of conflict — it is the positive flourishing of all relationships in their proper order. The Prince of Shalom/eirēnē (Isa 9:6). My eirēnē/shalom I give you — not as the world gives (John 14:27)."},
  H3444:{cp:"G4991",lbl:"יְשׁוּעָה",note:"Yeshuah (salvation, deliverance, victory) is rendered sōtēria in the LXX. My sōtēria/yeshuah is near (Isa 56:1). Simeon saw the sōtēria/yeshuah of God in the infant Jesus (Luke 2:30). The name Yeshua (Jesus) means YHWH saves/delivers — the bearer of sōtēria/yeshuah embodies salvation in his very name."},
  H5030:{cp:"G4396",lbl:"נָבִיא",note:"Navi (prophet, spokesman called to speak for God) is rendered prophētēs in the LXX. The navi proclaims divine words, not merely predicts the future. Moses was the prototype navi (Deut 18:15–18; Acts 3:22 applies this to Jesus). John the Baptist was the last of the OT neviim/prophētai — the hinge between the two testaments."},
  H1697:{cp:"G3056",lbl:"דָּבָר",note:"Davar (word, thing, matter, event — divine speech that creates reality) is rendered logos in the LXX. God's davar/logos goes out and does not return empty (Isa 55:11). The heavens were made by the logos/davar of the LORD (Ps 33:6). John 1:1 — In the beginning was the Logos/davar — applies the creative davar of Genesis 1 to the pre-existent Son."},
  H4428:{cp:"G935",lbl:"מֶלֶךְ",note:"Melek (king) is rendered basileus in the LXX. YHWH is Melek/basileus over all the earth (Ps 47:7). The messianic king of Ps 2, 72, and 110 is the direct background for Jesus as basileus/melek. Pilate's inscription — Jesus of Nazareth, basileus/melek of the Jews (John 19:19) — identifies the crucified one as the long-awaited Davidic king."},
  H4467:{cp:"G932",lbl:"מַמְלָכָה",note:"Mamlakah (kingdom, reign, sovereign rule) is rendered basileia in the LXX. The basileia tou Theou/Kingdom of God is the central message of Jesus's ministry, rooted in the OT mamlakah — YHWH's sovereign rule over all nations. The Son of Man receives a mamlakah/basileia that will never end (Dan 7:14; Luke 1:33; Rev 11:15)."},
  H5650:{cp:"G1401",lbl:"עֶבֶד",note:"Eved (servant, slave, worshiper, devotee of YHWH) is rendered doulos in the LXX. The great Servant Songs of Isaiah (Isa 42, 49, 50, 52–53) use eved/doulos for the coming Servant of YHWH who suffers redemptively. Jesus took the form of a doulos/eved (Phil 2:7), explicitly fulfilling the Servant who pours out his nephesh (Isa 53:12)."},
  H4397:{cp:"G32",lbl:"מַלְאָךְ",note:"Malak (messenger, angel, envoy) is rendered angelos in the LXX. The Malak YHWH — the Angel of the Lord — appears as a divine-human figure throughout the OT: to Hagar (Gen 16), Abraham (Gen 22), Moses at the burning bush (Exod 3), and Gideon (Judg 6). Many scholars identify the Malak YHWH as a pre-incarnate appearance of the Son."},
  H2022:{cp:"G3735",lbl:"הַר",note:"Har (mountain, hill, heights) is rendered oros in the LXX. Sinai/Horeb (the mountain of God), Zion (the holy mountain), the Mount of Olives — mountains are places of divine encounter and covenant-making. Jesus taught on a mountain/oros (Matt 5:1), was transfigured on an oros (Matt 17:1), and will return to the Mount of Olives (Zech 14:4; Acts 1:11–12)."},
  H5892:{cp:"G4172",lbl:"עִיר",note:"Ir (city, inhabited place) is rendered polis in the LXX. The City of David, the Holy City/polis (Jerusalem), the city of God (Ps 46:4) — the OT ir/polis reaches its eschatological fulfillment in the New Jerusalem, the holy polis coming down from heaven (Rev 21:2). We seek the polis/ir to come (Heb 13:14)."},
  H3220:{cp:"G2281",lbl:"יָם",note:"Yam (sea, the chaotic waters) is rendered thalassa in the LXX. The sea/yam symbolizes chaos and the enemies of God (Ps 74:13–14). God controls the yam/thalassa — he divided the Red Sea, calmed the storm (Ps 107:29; Matt 8:26). In the new creation there is no more thalassa/yam (Rev 21:1) — chaos is finally overcome."},
  H4057:{cp:"G2048",lbl:"מִדְבָּר",note:"Midbar (desert, wilderness, uninhabited land) is rendered erēmos in the LXX. Israel's 40-year wilderness/midbar wandering, Elijah's erēmos flight, John the Baptist's voice in the erēmos/midbar (Isa 40:3; Matt 3:1–3), and Jesus's 40-day testing in the erēmos (Matt 4:1) — the erēmos/midbar is the archetypal place of divine testing and encounter."},
  H430:{cp:"G2316",lbl:"אֱלֹהִים",note:"Elohim (God, gods, divine beings) is rendered theos in the LXX. The plural form used with singular verbs points to a plurality-in-unity that the NT identifies as the Trinity. Every NT use of theos inherits the full OT weight of Elohim — Creator of Genesis 1, Covenant God of Sinai, Redeemer of the Exodus."},
  H3068:{cp:"G2962",lbl:"יְהוָה",note:"YHWH (the LORD, the I AM, the self-existent covenant God) is rendered Kyrios in the LXX — the most consequential single translation decision in the entire Bible. Every NT quotation of 'the Lord' from the OT is YHWH/Kyrios. Paul applies OT Kyrios texts directly to Jesus (Phil 2:9–11; Joel 2:32 in Rom 10:13), making an unmistakable claim about his divine identity."},
  H8034:{cp:"G3686",lbl:"שֵׁם",note:"Shem (name, renown, character, reputation) is rendered onoma in the LXX. The Name of YHWH is a strong tower (Prov 18:10). Hallowed be your onoma/shem (Matt 6:9). Baptizing in the onoma/shem of the Father, Son, and Holy Spirit (Matt 28:19) — the Name embodies the full divine character and invokes the divine presence."},
  H4899:{cp:"G5547",lbl:"מָשִׁיחַ",note:"Mashiach (anointed one — kings, priests, and prophets anointed for divine service) is rendered Christos in the LXX. The messianic expectation built on Ps 2:2, Dan 9:25–26, and Isa 61:1 finds its fulfillment in Jesus the Christos/Mashiach. Peter's confession — You are the Christos (Matt 16:16) — is the hinge of the Gospels."},
  H6726:{cp:"G4622",lbl:"צִיּוֹן",note:"Tsiyon (Zion — the hill of Jerusalem, city of David, eschatological holy mountain) is transliterated Siōn in the LXX. Behold, I lay in Tsiyon/Siōn a cornerstone (Isa 28:16; Rom 9:33; 1 Pet 2:6). You have come to Mount Siōn/Tsiyon, the heavenly Jerusalem (Heb 12:22). The New Jerusalem/Siōn is the final reality (Rev 14:1)."},
  H3478:{cp:"G2474",lbl:"יִשְׂרָאֵל",note:"Yisrael (Israel — he who strives with God, or God strives) is transliterated Israēl in the LXX. Named at the Jabbok wrestling match (Gen 32:28), Yisrael/Israēl is both patriarch Jacob and the covenant people. Paul's extended reflection in Rom 9–11 wrestles with the relationship between ethnic Israēl and the community of faith."},
  H6310:{cp:"G4750",lbl:"פֶּה",note:"Peh (mouth, speech, opening) is rendered stoma in the LXX. Man shall not live by bread alone but by every word from the peh/stoma of God (Deut 8:3; Matt 4:4). The two-edged sword coming from the stoma/peh in Revelation (Rev 1:16; 19:15) echoes the sharp word of God's mouth in the prophets."},
  H5104:{cp:"G4215",lbl:"נָהָר",note:"Nahar (river, stream) is rendered potamos in the LXX. The four rivers of Eden (Gen 2:10–14), the Jordan river crossing, the river of fire before the Ancient of Days (Dan 7:10) — rivers mark key biblical thresholds. The river of the water of life (Rev 22:1) returns to the nahar/potamos of Eden. The Spirit flows like nahar/potamos (John 7:38)."},
  H5046:{cp:"G312",lbl:"נָגַד",note:"Nagad (to declare, make known, tell, report) is rendered anangellō in the LXX. The heavens declare/nagad the glory of God (Ps 19:1). I have not concealed your chesed/alētheia — I have declared/nagad (Ps 40:10). I have made known/nagad to you everything I heard from my Father (John 15:15)."},
  H376:{cp:"G435",lbl:"אִישׁ",note:"Ish (man, husband, each one) is rendered anēr in the LXX. Adam called his wife ishah because she was taken from ish/man (Gen 2:23). The ish/anēr as husband (Eph 5:25 inherits the Genesis marriage theology) and as a full human individual. The anēr of one woman — the NT qualification for church leaders (1 Tim 3:2) — assumes the OT covenantal context."},

  "Matthew 4:6":[{src:"Psalms 91:11-12",srcText:"For he will command his angels concerning you to guard you in all your ways; they will lift you up in their hands, so that you will not strike your foot against a stone.",note:"Satan quotes Scripture accurately but applies it wrongly—testing God rather than trusting him. Jesus's response (Deut 6:16) diagnoses the misuse: 'Do not put the Lord your God to the test.'",type:"quotation"}],

  "Matthew 13:14":[{src:"Isaiah 6:9-10",srcText:"You will be ever hearing but never understanding; you will be ever seeing but never perceiving. For this people's heart has become calloused...",note:"Isaiah received this commission at his call—his preaching would harden rather than soften. Jesus quotes it to explain why he teaches in parables: the same dynamic is at work. John 12:40 and Acts 28:26-27 also cite this passage.",type:"quotation"}],
  "Matthew 21:5":[{src:"Zechariah 9:9",srcText:"Rejoice greatly, Daughter Zion! See, your king comes to you, righteous and victorious, lowly and riding on a donkey, on a colt, the foal of a donkey.",note:"Jesus staged this entry deliberately. In the ANE, kings rode horses in war and donkeys in peace. The donkey king is a king of shalom. All four Gospels cite this passage for the triumphal entry.",type:"quotation"}],
  "Matthew 21:9":[{src:"Psalms 118:25-26",srcText:"LORD, save us! LORD, grant us success! Blessed is he who comes in the name of the LORD.",note:"'Hosanna' is the Hebrew hoshia-na (save now). Psalm 118 was the last of the Hallel psalms sung at Passover—the crowd was singing Passover liturgy, but applying it to Jesus entering Jerusalem.",type:"quotation"}],
  "Matthew 21:42":[{src:"Psalms 118:22-23",srcText:"The stone the builders rejected has become the cornerstone; the LORD has done this, and it is marvelous in our eyes.",note:"Jesus applies this to himself after the parable of the tenants. Peter quotes the same passage in Acts 4:11. The 'cornerstone' or 'capstone' metaphor became one of the earliest christological texts in the church.",type:"quotation"}],

  // Mark
  "Mark 1:3":[{src:"Isaiah 40:3",srcText:"A voice of one calling: 'In the wilderness prepare the way for the LORD; make straight in the desert a highway for our God.'",note:"Mark applies Isaiah's 'way of the LORD' (YHWH/kyrios) to Jesus, opening his Gospel with a claim that Jesus is YHWH arriving. The composite quote (Mark 1:2-3) blends Malachi 3:1 and Isaiah 40:3.",type:"quotation"}],
  "Mark 15:34":[{src:"Psalms 22:1",srcText:"My God, my God, why have you forsaken me?",note:"The only Aramaic words of Jesus recorded in Mark. Psalm 22 opens in anguish and ends in universal praise—'all the ends of the earth will remember and turn to the LORD.' Jesus's cry is the psalm's beginning; its ending is the promise.",type:"quotation"}],

  "John 12:15":[{src:"Zechariah 9:9",srcText:"Do not be afraid, Daughter Zion; see, your king is coming, seated on a donkey's colt.",note:"John's abbreviated citation focuses on the 'do not be afraid'—the peace dimension of the donkey king. John notes that the disciples did not understand this at first, only after the resurrection.",type:"quotation"}],

  "John 19:37":[{src:"Zechariah 12:10",srcText:"They will look on me, the one they have pierced, and they will mourn for him as one mourns for an only child.",note:"The pronoun shift in Zechariah ('me... him') is preserved. John applies this to the spear thrust at the cross. Revelation 1:7 applies it to the return of Christ. The same piercing fulfils both the cross and the parousia.",type:"quotation"}],

  "Acts 2:25":[{src:"Psalms 16:8-11",srcText:"I have set the LORD always before me... you will not abandon me to the realm of the dead, nor will you let your faithful one see decay.",note:"Peter argues David wrote this of the Messiah, not himself—because David died and his tomb was known. The 'faithful one' who would not see decay must be someone raised before decomposition: Jesus, on the third day.",type:"quotation"}],
