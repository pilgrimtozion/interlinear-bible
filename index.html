  "Acts 15:16":[{src:"Amos 9:11-12",srcText:"In that day I will restore David's fallen shelter... so that they may possess the remnant of Edom and all the nations that bear my name.",note:"The Hebrew reads 'remnant of Edom'; the LXX reads 'remnant of mankind.' James quotes the LXX version to argue that Gentile inclusion requires no circumcision. This ruling—which shaped all of Gentile Christianity—rests entirely on the Greek translation.",type:"quotation"}],
  // Romans
  "Romans 1:17":[{src:"Habakkuk 2:4",srcText:"The righteous person will live by his faithfulness.",note:"Paul's thesis text for Romans and Galatians. Hebrew: emunah (faithfulness/steadfastness). The LXX adds 'my' in some versions. Paul's 'by faith' (pistis) carries all the weight of Hebrew emunah—not intellectual assent but covenant steadfastness. Luther's reading of this verse ignited the Reformation.",type:"quotation"}],
  "Romans 3:4":[{src:"Psalms 51:4",srcText:"So that you may be proved right when you speak and prevail when you judge.",note:"Paul cites this in the context of defending God's faithfulness despite human unfaithfulness. The LXX version ('when you judge') differs slightly from the Hebrew ('when you pass judgment')—Paul follows the LXX.",type:"quotation"}],
  "Romans 4:3":[{src:"Genesis 15:6",srcText:"Abram believed God, and it was credited to him as righteousness.",note:"The foundation of Paul's entire argument in Romans 4 and Galatians 3. Abraham was credited righteous before circumcision (Gen 17) and before the law (Ex 20)—proving that justification by faith precedes both rites. The Hebrew verb aman (believe/trust) is rendered pisteuo in the LXX.",type:"quotation"}],
  "Romans 9:13":[{src:"Malachi 1:2-3",srcText:"Jacob I loved, but Esau I hated.",note:"Paul uses this to argue that God's election is not based on national descent or prior behaviour—it was declared before the twins were born. 'Hated' in Hebrew idiom often means 'loved less' (cf. Gen 29:31). The point is divine prerogative, not divine cruelty.",type:"quotation"}],
  "Romans 9:17":[{src:"Exodus 9:16",srcText:"I raised you up for this very purpose, that I might display my power in you and that my name might be proclaimed in all the earth.",note:"God's word to Pharaoh—used as evidence that God's purposes extend even through hardening. Paul's argument: even the resistance of Pharaoh served the proclamation of God's name to all nations.",type:"quotation"}],
  "Romans 10:13":[{src:"Joel 2:32",srcText:"Everyone who calls on the name of the LORD will be saved.",note:"Paul applies 'the name of the LORD' (YHWH/kyrios in LXX) to Jesus in the preceding verses. Calling on Jesus is, for Paul, calling on YHWH. The LXX kyrios convention makes this argument possible in Greek.",type:"quotation"}],
  "Romans 11:26":[{src:"Isaiah 59:20-21",srcText:"The Redeemer will come to Zion, to those in Jacob who repent of their sins.",note:"Paul changes 'will come to Zion' (Isaiah's Hebrew/LXX) to 'will come out of Zion'—a shift suggesting the universal scope of the Redeemer's mission, not just restoration of Israel. The 'all Israel will be saved' context points to an eschatological fulfilment.",type:"quotation"}],
  // 1 Corinthians
  "1 Corinthians 1:31":[{src:"Jeremiah 9:24",srcText:"But let the one who boasts boast about this: that they have the understanding to know me, that I am the LORD, who exercises kindness, justice and righteousness on earth.",note:"Paul condenses Jeremiah's message: human boasting must be redirected from wisdom, strength, or wealth to knowledge of YHWH. In context Paul is dismantling the Corinthians' infatuation with eloquent teachers.",type:"quotation"}],
  "1 Corinthians 15:27":[{src:"Psalms 8:6",srcText:"You made him ruler over the works of your hands; you put everything under his feet.",note:"Paul applies this to the resurrection and reign of Christ—all things subjected under his feet. The same Psalm 8 text drives the argument in Hebrews 2:6-8. Both argue the 'everything' has not yet been fully realised; the final enemy to be subjected is death itself (1 Cor 15:26).",type:"quotation"}],
  "1 Corinthians 15:54":[{src:"Isaiah 25:8",srcText:"He will swallow up death forever. The Sovereign LORD will wipe away the tears from all faces.",note:"Paul's resurrection cry conflates Isaiah 25:8 and Hosea 13:14 in a form closer to the LXX than the Hebrew. The 'swallowing up' of death is Isaiah's image of final victory—applied here to the bodily resurrection at Christ's return.",type:"quotation"}],
  "1 Corinthians 15:55":[{src:"Hosea 13:14",srcText:"Where, O death, are your plagues? Where, O grave, is your destruction?",note:"In Hebrew Hosea 13:14 is a judgment threat—God summoning death against Israel. Paul's LXX-influenced reading transforms it into a resurrection taunt. The cross changes the meaning: what was a weapon of judgment becomes a victory cry.",type:"quotation"}],
  // Galatians
  "Galatians 3:6":[{src:"Genesis 15:6",srcText:"Abram believed God, and it was credited to him as righteousness.",note:"The same verse Paul uses in Romans 4. In Galatians the point is sharper: Abraham was justified by faith, not by the law—and his faith preceded circumcision by 14 years. The Gentiles who believe are Abraham's true children.",type:"quotation"}],
  "Galatians 3:8":[{src:"Genesis 12:3",srcText:"All nations will be blessed through you.",note:"Paul calls this 'Scripture... announcing the gospel in advance to Abraham.' The Abrahamic promise of blessing to all nations (goyim/ethnē) is the OT foundation for Gentile inclusion—it predates both circumcision and Torah by centuries.",type:"quotation"}],
  "Galatians 3:11":[{src:"Habakkuk 2:4",srcText:"The righteous will live by faith.",note:"Paul's second use of this key verse—this time to prove that the law does not justify, because the law operates on a 'do and live' principle (Lev 18:5, quoted in Gal 3:12), while Habakkuk's principle is faith. Two different covenantal logics are in play.",type:"quotation"}],
  "Galatians 3:13":[{src:"Deuteronomy 21:23",srcText:"Anyone who is hung on a pole is under God's curse.",note:"The Deuteronomy law concerning executed criminals displayed on a tree. Paul argues Christ 'became a curse for us'—absorbing the curse of the law on behalf of all who were under it. The argument required a crucifixion (hanging on a tree/cross), not any other form of death.",type:"quotation"}],
  // Ephesians
  "Ephesians 4:8":[{src:"Psalms 68:18",srcText:"When you ascended on high, you took many captives; you received gifts from people.",note:"Paul changes 'received gifts' (Psalm's Hebrew/LXX) to 'gave gifts'—applying the Psalm to Christ's ascension giving gifts to the church. The rabbinic tradition interpreted the Psalm as Moses ascending Sinai to receive the Torah (the gift); Paul redirects this to Christ ascending to give the Spirit's gifts.",type:"quotation"}],
  // Hebrews
  "Hebrews 1:5":[{src:"Psalms 2:7",srcText:"You are my son; today I have become your father.",note:"Hebrews opens its catena of OT citations proving the Son's superiority over angels. Psalm 2:7 is never applied to any angel—only to the Davidic king and, in Hebrews, to the risen and enthroned Son. The 'today' of the Father's declaration becomes the moment of resurrection/enthronement.",type:"quotation"}],
  "Hebrews 1:6":[{src:"Deuteronomy 32:43 (LXX)",srcText:"Rejoice, you nations, with his people... Let all God's angels worship him.",note:"This phrase does not exist in the Hebrew MT of Deuteronomy 32:43. It appears in the LXX and in the Dead Sea Scrolls. Hebrews cites this absent-from-MT text to prove the Son's superiority over angels—the argument depends on the Greek/DSS text tradition.",type:"quotation"}],
  "Hebrews 1:8":[{src:"Psalms 45:6-7",srcText:"Your throne, O God, will last for ever and ever; a scepter of justice will be the scepter of your kingdom.",note:"A wedding psalm for a Davidic king—addressed as 'God' (Elohim). Hebrews applies this directly to the Son: the Father addresses the Son as 'God' (theos). This is one of the clearest ascriptions of deity to Christ in the NT, drawn from an OT royal psalm.",type:"quotation"}],
  "Hebrews 1:10":[{src:"Psalms 102:25-27",srcText:"In the beginning you laid the foundations of the earth, and the heavens are the work of your hands... But you remain the same, and your years will never end.",note:"Psalm 102 addresses YHWH as Creator. Hebrews applies it to the Son—the Father says this of him. The Son is the one who laid the earth's foundations: an explicit attribution of creation to Christ.",type:"quotation"}],
  "Hebrews 1:13":[{src:"Psalms 110:1",srcText:"Sit at my right hand until I make your enemies a footstool for your feet.",note:"Hebrews' fifth citation in its opening chain—climactically applied to the Son. 'To which of the angels did God ever say, Sit at my right hand?' The rhetorical question has one answer: none. This verse is the NT's most cited OT text.",type:"quotation"}],
  "Hebrews 2:7":[{src:"Psalms 8:5",srcText:"You made him a little lower than the angels and crowned him with glory and honor.",note:"The Hebrew reads 'lower than Elohim (God).' The LXX translates Elohim as 'angels' here. Hebrews depends entirely on the LXX reading to argue that the Son was temporarily made lower than angels in his incarnation before being crowned with glory. The argument requires the Greek text.",type:"quotation"}],
  "Hebrews 2:12":[{src:"Psalms 22:22",srcText:"I will declare your name to my brothers and sisters; in the assembly I will sing your praises.",note:"Hebrews puts this on the lips of Jesus—the risen Christ leading the congregation's praise. Psalm 22 begins with dereliction (cited at the cross) and ends with praise in the assembly. Hebrews quotes the ending to show that the psalm's arc from suffering to worship is fulfilled in Christ.",type:"quotation"}],
  "Hebrews 3:7":[{src:"Psalms 95:7-11",srcText:"Today, if you hear his voice, do not harden your hearts as you did at Meribah, as you did in the wilderness of Meribah.",note:"The longest sustained OT quotation in Hebrews (3:7-11). The 'today' of the Psalm becomes a live warning: the same hardening that prevented the exodus generation from entering the land can prevent God's people from entering the ultimate rest. The wilderness generation is a type of every generation that hears God's voice.",type:"quotation"}],
  "Hebrews 5:5":[{src:"Psalms 2:7",srcText:"You are my son; today I have become your father.",note:"Applied here to Jesus's appointment as high priest—as it was to his sonship in Hebrews 1:5. The divine declaration at Gethsemane/resurrection is the moment of appointment. The Son did not appoint himself; he was appointed as Psalm 2 declares.",type:"quotation"}],
  "Hebrews 5:6":[{src:"Psalms 110:4",srcText:"You are a priest forever, in the order of Melchizedek.",note:"The second half of Psalm 110—the royal decree creating a permanent non-Levitical priesthood. Hebrews builds its entire high-priesthood argument on this verse (developed in chapters 5-7). No Levitical priest was ever called 'priest forever'; the Melchizedekian order is the higher one.",type:"quotation"}],
  "Hebrews 8:8":[{src:"Jeremiah 31:31-34",srcText:"The days are coming, declares the LORD, when I will make a new covenant with the people of Israel and with the people of Judah... I will put my law in their minds and write it on their hearts.",note:"The longest OT quotation in the NT (8:8-12). Hebrews uses it as the theological foundation for Christ's superior priesthood: Jeremiah announced a new covenant, which means the first was becoming obsolete (8:13). The new covenant's hallmarks—law written on hearts, universal knowledge of God, complete forgiveness—are fulfilled in Christ's ministry.",type:"quotation"}],
  "Hebrews 10:5":[{src:"Psalms 40:6-8",srcText:"Sacrifice and offering you did not desire, but my ears you have opened; burnt offerings and sin offerings you did not require. Then I said, 'Here I am, I have come—it is written about me in the scroll.'",note:"Hebrew: 'ears you have opened/dug.' LXX: 'a body you prepared for me.' Hebrews puts the LXX text on the lips of the incarnate Son. The argument that Christ's body replaced the animal sacrifice system depends entirely on the Greek text. The Hebrew would not support it.",type:"quotation"}],
  "Hebrews 12:5":[{src:"Proverbs 3:11-12",srcText:"My son, do not despise the LORD's discipline, and do not resent his rebuke, because the LORD disciplines those he loves, as a father the son he delights in.",note:"Hebrews applies this to the suffering of God's people—hardship is not punishment but fatherly discipline. The argument reframes the persecution context: you are enduring as sons, not as abandoned orphans. The Father's discipline is evidence of sonship, not rejection.",type:"quotation"}],
  // 1 Peter
  "1 Peter 2:6":[{src:"Isaiah 28:16",srcText:"See, I lay a stone in Zion, a chosen and precious cornerstone, and the one who trusts in him will never be put to shame.",note:"Peter weaves three stone texts together (Isaiah 28:16, Psalm 118:22, Isaiah 8:14) to describe Jesus as the foundation stone, cornerstone, and stumbling stone simultaneously—depending on one's response to him.",type:"quotation"}],
  "1 Peter 2:9":[{src:"Exodus 19:5-6",srcText:"You will be my treasured possession. Although the whole earth is mine, you will be for me a kingdom of priests and a holy nation.",note:"The Sinai covenant's description of Israel's identity is applied by Peter to the church—including Gentile believers. 'Chosen people, royal priesthood, holy nation, people belonging to God' transfers Israel's covenant status to all who are 'in Christ,' not as replacement but as expansion.",type:"quotation"}],
  "1 Peter 2:22":[{src:"Isaiah 53:9",srcText:"He was assigned a grave with the wicked, and with the rich in his death, though he had done no violence, nor was any deceit in his mouth.",note:"Peter cites Isaiah 53 to undergird an ethic of suffering without retaliation—Christ as example. The Servant who did no violence is the pattern for slaves (and all believers) treated unjustly. 1 Peter 2:22-25 is the densest concentration of Isaiah 53 citations in the NT.",type:"quotation"}],
  "1 Peter 2:24":[{src:"Isaiah 53:5",srcText:"He was pierced for our transgressions, he was crushed for our iniquities; the punishment that brought us peace was on him, and by his wounds we are healed.",note:"'By his wounds you have been healed'—Peter shifts Isaiah's future tense to past, declaring the healing accomplished. Isaiah 53's vocabulary (bore, carried, wounds, healed) becomes the NT's primary language for substitutionary atonement.",type:"quotation"}],
  // Revelation
  "Revelation 1:7":[{src:"Zechariah 12:10",srcText:"They will look on me, the one they have pierced, and they will mourn for him as one mourns for an only child.",note:"Combined with Daniel 7:13 ('coming with the clouds'). John fuses the pierced one of Zechariah with the coming Son of Man of Daniel into a single return event: the one who was pierced comes on the clouds, and all people will see him. The same Zechariah verse was cited at the cross (John 19:37).",type:"quotation"}],

  // Luke (additional)
  "Luke 7:27":[{src:"Malachi 3:1",srcText:"I will send my messenger, who will prepare the way before me.",note:"Jesus applies this to John the Baptist. As in Matthew 11:10, 'before me' (YHWH speaking in Malachi) is shifted to 'before you' — placing Jesus in the role of YHWH being prepared for.",type:"quotation"}],
  "Luke 10:27":[{src:"Deuteronomy 6:5 / Leviticus 19:18",srcText:"Love the Lord your God with all your heart and with all your soul and with all your strength... love your neighbour as yourself.",note:"The lawyer combines the Shema (Deut 6:5) with the neighbour command (Lev 19:18) — this combination predates Jesus and appears in Jewish sources. Jesus affirms the synthesis and adds the parable of the Good Samaritan to define 'neighbour' in the most expansive possible way.",type:"quotation"}],
  "Luke 20:17":[{src:"Psalms 118:22",srcText:"The stone the builders rejected has become the cornerstone.",note:"Luke's version of the parable of the tenants ends here. The rejected stone is applied to Jesus — rejected by the builders (religious leadership) but made the cornerstone by God.",type:"quotation"}],
  // John (additional)
  "John 6:31":[{src:"Psalms 78:24 / Exodus 16:4",srcText:"He gave them bread from heaven to eat.",note:"The crowd's challenge to Jesus to prove himself by providing bread as Moses did in the wilderness. Jesus's response reinterprets the miracle: Moses didn't give the bread — God did. And the true bread from heaven is not manna but the Son himself (6:35).",type:"quotation"}],
  "John 10:34":[{src:"Psalms 82:6",srcText:"I said, 'You are gods; you are all sons of the Most High.'",note:"Jesus's defence against the blasphemy charge. If the Scripture calls human judges 'gods', how much more can the one whom the Father consecrated and sent into the world use that title? The argument is a rabbinic kal va-homer (light to heavy). The judges of Psalm 82 are being condemned — Jesus is being consecrated.",type:"quotation"}],
  "John 12:38":[{src:"Isaiah 53:1",srcText:"Lord, who has believed our message and to whom has the arm of the Lord been revealed?",note:"John quotes this to explain why the crowds did not believe despite the signs. Isaiah's question — anticipating rejection of the servant's message — becomes the explanation for the pattern of unbelief Jesus encountered throughout his ministry.",type:"quotation"}],
  "John 12:40":[{src:"Isaiah 6:10",srcText:"He has blinded their eyes and hardened their hearts, so they can neither see with their eyes, nor understand with their hearts.",note:"John attributes the hardening directly to divine action — more severe than Matthew's version (13:14-15). John 12:41 adds the extraordinary claim: 'Isaiah said this because he saw Jesus's glory.' The vision of Isaiah 6 was a vision of the pre-incarnate Christ.",type:"quotation"}],
  "John 15:25":[{src:"Psalms 35:19 / Psalm 69:4",srcText:"They hated me without reason.",note:"Jesus applies the Psalmist's experience of unjust hatred to himself. Both Psalms 35 and 69 are heavily cited in the Passion narratives — the righteous sufferer of the Psalms is the type of which Jesus is the antitype.",type:"quotation"}],
  "John 19:36":[{src:"Exodus 12:46 / Numbers 9:12",srcText:"Do not break any of the bones.",note:"The Passover lamb instruction — not a bone shall be broken. John explicitly connects the timing of Jesus's death to Passover (he dies as the Passover lambs are being slaughtered) and then notes the unbroken bones as fulfilment. Jesus is the Passover Lamb.",type:"quotation"}],
  // Acts (additional)
  "Acts 3:22":[{src:"Deuteronomy 18:15",srcText:"The Lord your God will raise up for you a prophet like me from among you, from your fellow Israelites. You must listen to him.",note:"Peter identifies Jesus as the prophet like Moses that Deuteronomy promised. This prophet-like-Moses expectation was active in Second Temple Judaism (the Dead Sea Scrolls reference it). Peter argues Jesus is the fulfilment and that rejecting him is rejecting Moses's own prediction.",type:"quotation"}],
  "Acts 7:3":[{src:"Genesis 12:1",srcText:"Leave your country and your people and go to the land I will show you.",note:"Stephen's speech (Acts 7) is one long recitation of Israel's history from Abraham to Solomon, drawn from Genesis through 2 Samuel. God's appearances to Abraham, Joseph, Moses, and David are all cited to argue that God has never been confined to a temple.",type:"quotation"}],
  "Acts 13:22":[{src:"Psalms 89:20 / 1 Samuel 13:14",srcText:"I have found David son of Jesse, a man after my own heart.",note:"Paul's Pisidian Antioch sermon (Acts 13:16-41) traces the same history as Stephen's speech but focuses on the Davidic line leading to Jesus. The combination of Psalm 89 and 1 Samuel establishes David's status before introducing Jesus as David's promised descendant.",type:"quotation"}],
  "Acts 13:34":[{src:"Isaiah 55:3",srcText:"I will give you the holy and sure blessings promised to David.",note:"Paul connects the resurrection to the Davidic covenant: the 'holy and sure blessings of David' — promised as eternal and indestructible — could not be fulfilled by the historical David who died and decayed. They must be fulfilled through one raised from the dead.",type:"quotation"}],
  "Acts 13:41":[{src:"Habakkuk 1:5",srcText:"Look, you scoffers, wonder and perish, for I am going to do something in your days that you would never believe, even if someone told you.",note:"Paul closes his sermon with a warning drawn from Habakkuk — YHWH's announcement of judgment through Babylon, which Israel refused to believe. The pattern: God acts in a way so unexpected that those who should believe reject it. The resurrection is that act in Paul's time.",type:"quotation"}],
  "Acts 28:26":[{src:"Isaiah 6:9-10",srcText:"You will be ever hearing but never understanding; you will be ever seeing but never perceiving.",note:"Paul's final word to the Roman Jewish community — the same Isaiah passage Jesus cited (Matt 13:14) and John cited (12:40). Its appearance at the opening of Jesus's ministry, at a pivotal moment in John, and at the close of Acts forms a frame around the NT's story of Jewish rejection and Gentile inclusion.",type:"quotation"}],
  // Romans (additional)
  "Romans 3:10":[{src:"Psalms 14:1-3",srcText:"There is no one righteous, not even one; there is no one who understands; there is no one who seeks God.",note:"Paul's catena (chain) of OT citations in Romans 3:10-18 draws from Psalms 14, 5, 140, 10, 36, and Isaiah 59 — a rhetorical accumulation of every OT indictment of human sin. The effect: the whole OT witness agrees that all humanity stands condemned before God.",type:"quotation"}],
  "Romans 9:25":[{src:"Hosea 2:23",srcText:"I will call them 'my people' who are not my people; and I will call her 'my loved one' who is not my loved one.",note:"Paul applies Hosea's prophecy about Israel's restoration after exile to Gentile inclusion. In Hosea, 'not my people' refers to Israel under judgment. Paul extends the logic: if God can call rejected Israel 'my people' again, he can call Gentiles — who were never his people — 'my people' too.",type:"quotation"}],
  "Romans 10:16":[{src:"Isaiah 53:1",srcText:"Lord, who has believed our message?",note:"Paul quotes Isaiah's lament about rejection of the servant's report to explain that Israel's failure to respond to the gospel is not surprising — Isaiah predicted it. The same verse John quotes (12:38) is used here in a different argumentative context.",type:"quotation"}],
  "Romans 10:20":[{src:"Isaiah 65:1",srcText:"I was found by those who did not seek me; I revealed myself to those who did not ask for me.",note:"Isaiah's word about Gentiles who find God without seeking him — Paul applies it directly to the Gentile mission. The reversal is complete: the ones who 'did not seek' are finding; the ones who should have been waiting have rejected.",type:"quotation"}],
  "Romans 15:3":[{src:"Psalms 69:9",srcText:"The insults of those who insult you have fallen on me.",note:"Paul quotes this christologically — the same verse John cited at the Temple cleansing (2:17). Here Paul uses it to ground the ethic of bearing others' weaknesses: even Christ did not please himself but bore insults meant for God. The Psalm becomes an ethical template.",type:"quotation"}],
  "Romans 15:9":[{src:"Psalms 18:49 / 2 Samuel 22:50",srcText:"Therefore I will praise you among the Gentiles; I will sing the praises of your name.",note:"The first of four OT citations in Romans 15:9-12 that all mention Gentiles — proving from Law, Prophets, and Writings that Gentile inclusion was always God's plan. Paul puts this verse on the lips of Christ: the risen Jesus praises God among the nations.",type:"quotation"}],
  "Romans 15:10":[{src:"Deuteronomy 32:43",srcText:"Rejoice, you Gentiles, with his people.",note:"From the Song of Moses — the same passage Hebrews 1:6 cites (in the longer LXX form). Paul quotes the shorter Hebrew version here. The Song of Moses, which begins with Israel's failure and ends with YHWH vindicating his people before the nations, concludes with Gentile rejoicing.",type:"quotation"}],
  "Romans 15:12":[{src:"Isaiah 11:10",srcText:"The Root of Jesse will spring up, one who will arise to rule over the nations; in him the Gentiles will hope.",note:"The climax of Paul's four-citation chain. Isaiah's messianic branch — the shoot from Jesse's stump — becomes the one in whom the Gentiles hope. Paul's entire argument for Jewish-Gentile unity in Romans 14-15 rests here: it was always the Messiah's job to unite the nations.",type:"quotation"}],
  // 2 Corinthians
  "2 Corinthians 3:3":[{src:"Jeremiah 31:33 / Ezekiel 36:26",srcText:"I will put my law in their minds and write it on their hearts... I will give you a new heart.",note:"Paul describes the Corinthians as 'a letter from Christ written not with ink but with the Spirit of the living God, not on tablets of stone but on tablets of human hearts.' Jeremiah's new covenant promise and Ezekiel's new heart promise are fulfilled in the Spirit-formed community.",type:"quotation"}],
  "2 Corinthians 6:2":[{src:"Isaiah 49:8",srcText:"In the time of my favour I heard you, and in the day of salvation I helped you.",note:"Paul quotes this Servant Song passage and then says 'I tell you, now is the time of God's favour, now is the day of salvation.' The 'acceptable year' of Isaiah's second servant song is declared present — the age of fulfilment has arrived.",type:"quotation"}],
  "2 Corinthians 6:16":[{src:"Leviticus 26:12 / Ezekiel 37:27",srcText:"I will be their God, and they will be my people.",note:"Paul applies the covenant formula — God's repeated promise to Israel — to the church as the temple of the living God. The covenant 'I will be your God and you will be my people' reaches its intended fulfilment in the Spirit-indwelt community.",type:"quotation"}],
  // Galatians (additional)
  "Galatians 4:27":[{src:"Isaiah 54:1",srcText:"Be glad, barren woman, you who never bore a child; shout for joy and cry aloud, you who were never in labour; because more are the children of the desolate woman than of her who has a husband.",note:"Paul's Sarah/Hagar allegory culminates with this Isaiah citation. The barren woman (Sarah/the heavenly Jerusalem) has more children than the fertile one (Hagar/the earthly Jerusalem). The Gentile converts are the fulfilment of Isaiah's promise to barren Zion — more children through the Spirit than through the law.",type:"quotation"}],
  // Ephesians (additional)
  "Ephesians 2:17":[{src:"Isaiah 57:19",srcText:"Peace, peace, to those far and near, says the LORD.",note:"'Far' and 'near' (Isaiah's description of the returning exiles) are applied by Paul to Gentiles and Jews respectively. Christ 'came and preached peace to you who were far away and peace to those who were near' — the reconciliation of Jew and Gentile fulfils Isaiah's restoration promise.",type:"quotation"}],
  "Ephesians 5:31":[{src:"Genesis 2:24",srcText:"For this reason a man will leave his father and mother and be united to his wife, and the two will become one flesh.",note:"Paul quotes the foundational marriage text and then says 'this is a profound mystery — but I am talking about Christ and the church.' The one-flesh union of marriage was always carrying a deeper meaning: the union of Christ and his people. The mystery hidden in Genesis 2 is now revealed.",type:"quotation"}],
  // Philippians
  "Philippians 2:10":[{src:"Isaiah 45:23",srcText:"Before me every knee will bow; by me every tongue will swear.",note:"YHWH's declaration of universal sovereignty applied to Jesus: 'at the name of Jesus every knee should bow... and every tongue acknowledge that Jesus Christ is Lord.' The transfer of YHWH's universal worship to Jesus is one of the clearest Pauline assertions of Christ's divine identity.",type:"quotation"}],
  // Hebrews (additional)
  "Hebrews 2:13":[{src:"Isaiah 8:17-18",srcText:"Here am I, and the children God has given me.",note:"Hebrews applies two Isaiah texts to Jesus in 2:12-13 (Psalm 22:22 and Isaiah 8:17-18). Isaiah 8 describes the prophet and his children as signs — Hebrews reads this as a type of Christ and his spiritual children, who together share in flesh and blood (2:14).",type:"quotation"}],
  "Hebrews 4:3":[{src:"Psalms 95:11",srcText:"So I declared on oath in my anger, 'They shall never enter my rest.'",note:"Hebrews develops a theology of rest across chapters 3-4: the Sabbath rest of creation (Gen 2), the rest of Canaan (Deut 12), and the deeper rest still available (Ps 95's 'today'). The warning is that unbelief excludes from this rest — as it did the wilderness generation.",type:"quotation"}],
  "Hebrews 6:14":[{src:"Genesis 22:17",srcText:"I will surely bless you and give you many descendants.",note:"The oath God swore to Abraham after the offering of Isaac — cited to prove that God's promises are secured by his own oath. Since God cannot swear by anything greater, he swears by himself. The two unchangeable things (his promise and his oath) are the anchor for the believer's hope.",type:"quotation"}],
  "Hebrews 10:30":[{src:"Deuteronomy 32:35-36",srcText:"It is mine to avenge; I will repay... The Lord will vindicate his people.",note:"From the Song of Moses — cited as a warning against apostasy. YHWH's reserved right to vengeance is presented not as cruelty but as the counterweight to his covenant loyalty: he vindicates his people and judges those who betray them.",type:"quotation"}],
  "Hebrews 13:5":[{src:"Deuteronomy 31:6",srcText:"Never will I leave you; never will I forsake you.",note:"Moses's charge to Israel before entering Canaan — applied directly to the Christian's contentment with what they have. The promise given to Israel at the Jordan becomes the ground of every believer's security: the same God who promised not to abandon Israel going into the land is present with every believer.",type:"quotation"}],
  // James
  "James 2:8":[{src:"Leviticus 19:18",srcText:"Love your neighbour as yourself.",note:"James calls this 'the royal law found in Scripture.' The same verse Jesus called the second great commandment (Matt 22:39), Paul called the fulfilment of the law (Rom 13:9, Gal 5:14). Its 'royal' status: it is the law of the King, governing his kingdom community.",type:"quotation"}],
  "James 2:23":[{src:"Genesis 15:6",srcText:"Abraham believed God, and it was credited to him as righteousness.",note:"James's use of this verse (also cited by Paul in Rom 4:3 and Gal 3:6) focuses on a different moment than Paul: not the initial crediting of righteousness but its demonstration in Genesis 22 (the offering of Isaac). Faith was credited; works demonstrated it was real. James and Paul are not contradicting each other — they are addressing different misunderstandings.",type:"quotation"}],
  "James 4:6":[{src:"Proverbs 3:34",srcText:"He mocks proud mockers but shows favour to the humble and oppressed.",note:"Also quoted in 1 Peter 5:5. The LXX and Hebrew agree. This verse became a foundational text in early Christianity for the theology of divine grace toward the humble — the counter-cultural reversal that runs through the Beatitudes and the Magnificat.",type:"quotation"}],
  // 1 Peter (additional)
  "1 Peter 1:16":[{src:"Leviticus 11:44",srcText:"Be holy, because I am holy.",note:"The call to holiness at the heart of the Levitical law — applied directly to Gentile converts. Peter addresses people who have no Levitical heritage, but the same command from the same God applies. The holy life is not a Jewish ethnic identity but a participation in the character of God himself.",type:"quotation"}],
  "1 Peter 1:24":[{src:"Isaiah 40:6-8",srcText:"All people are like grass, and all their glory is like the flowers of the field; the grass withers and the flowers fall, but the word of the Lord endures forever.",note:"Peter quotes the opening of Isaiah 40 (the great comfort chapter) to ground the imperishable nature of the new birth. Human life is as transient as grass; the seed of the word is as enduring as God himself.",type:"quotation"}],
  "1 Peter 3:10":[{src:"Psalms 34:12-16",srcText:"Whoever would love life and see good days must keep their tongue from evil and their lips from deceitful speech.",note:"A sustained quotation from Psalm 34 supporting Peter's ethics of suffering without retaliation. The Psalm of the one who 'cried out and the LORD heard him' becomes the ethics guide for those suffering unjustly — keep the tongue, turn from evil, pursue peace.",type:"quotation"}],
  "1 Peter 5:5":[{src:"Proverbs 3:34",srcText:"God opposes the proud but shows favour to the humble.",note:"The same verse James 4:6 cites. In 1 Peter it grounds the exhortation to mutual humility in the community — elders toward the young, all toward each other. God's active opposition to pride and favour toward humility is the community's structural principle.",type:"quotation"}],
  // 2 Peter
  "2 Peter 2:22":[{src:"Proverbs 26:11",srcText:"As a dog returns to its vomit, so fools repeat their folly.",note:"Peter applies this proverb to false teachers who have known the truth and turned back — the most vivid image of apostasy in the NT. The combination with the washed pig returning to the mud makes the double image of irreversible regression.",type:"quotation"}],
  // Revelation (additional)
  "Revelation 1:8":[{src:"Isaiah 44:6",srcText:"I am the first and I am the last; apart from me there is no God.",note:"YHWH's declaration of his eternal uniqueness in Isaiah is placed in the mouth of the risen Christ in Revelation (and again in 1:17, 2:8, 22:13). The Alpha and Omega, the First and Last, is the divine self-identification of the God of Isaiah — applied directly to Jesus throughout Revelation.",type:"quotation"}],
  "Revelation 4:8":[{src:"Isaiah 6:3",srcText:"Holy, holy, holy is the LORD Almighty; the whole earth is full of his glory.",note:"The Trisagion of Isaiah's throne room vision becomes the continuous praise of the four living creatures around the heavenly throne. The seraphim of Isaiah 6 and the living creatures of Revelation 4 sing the same song — the eternal holiness of YHWH, now shared with the Lamb (5:12).",type:"quotation"}],
  "Revelation 7:17":[{src:"Isaiah 25:8",srcText:"He will swallow up death forever. The Sovereign LORD will wipe away the tears from all faces.",note:"Isaiah's eschatological promise — God wiping away every tear — appears twice in Revelation (7:17 and 21:4). The fulfilment scene of the new creation explicitly quotes the OT vision. What Isaiah could only promise from a distance, John sees enacted in the new Jerusalem.",type:"quotation"}],
  "Revelation 19:11":[{src:"Isaiah 11:4",srcText:"He will strike the earth with the rod of his mouth; with the breath of his lips he will slay the wicked.",note:"The rider on the white horse (Rev 19:11-16) is drawn from Isaiah's messianic branch — who 'judges the needy with righteousness' and strikes the earth with the rod of his mouth. The white horse, the robe dipped in blood, the name 'Word of God,' and the sharp sword from his mouth are all OT royal/messianic imagery.",type:"quotation"}],
  "Revelation 20:9":[{src:"Ezekiel 38:22 / 39:6",srcText:"I will execute judgment on him with plague and bloodshed; I will pour down torrents of rain, hailstones and burning sulfur.",note:"The Gog and Magog battle of Revelation 20:7-10 is drawn directly from Ezekiel 38-39. Revelation recontextualises Ezekiel's vision of the final attack on restored Israel as the final assault of all nations against the redeemed community — ended by divine fire from heaven.",type:"quotation"}],
  "Revelation 22:2":[{src:"Ezekiel 47:12",srcText:"Fruit trees of all kinds will grow on both banks of the river... Their fruit will serve for food and their leaves for healing.",note:"The river of life and the tree of life in Revelation 22:1-2 directly echo Ezekiel's vision of the river flowing from the eschatological Temple, with fruit trees on both banks. The new Jerusalem is the fulfilment of Ezekiel's temple-city vision — and the reversal of the Eden expulsion (Gen 3:24).",type:"quotation"}],

const S = {
  G1722:{l:"\u1f10\u03bd",t:"en",p:"Preposition",d:"In, on, at, by, with, among. Denotes position and instrumentality. One of the most frequent words in the Greek NT."},
  G746:{l:"\u1f00\u03c1\u03c7\u03ae",t:"arch\u0113",p:"Noun, Feminine",d:"Beginning, origin; rule, authority. In John 1:1, refers to the eternal pre-existence of the Logos before creation began."},
  G1510:{l:"\u03b5\u1f34\u03bc\u03b9",t:"eimi",p:"Verb",d:"To be, to exist. The imperfect \u1f26\u03bd (en) indicates continuous existence — the Word was already there, contrasted with created things which came into being (egeneto)."},
  G3588:{l:"\u1f41, \u1f21, \u03c4\u03cc",t:"ho, h\u0113, to",p:"Definite Article",d:"The. Its presence or absence is theologically significant — in John 1:1, ho Theos (with article) refers to the Father, while Theos en ho Logos (anarthrous) is central to Trinitarian debate."},
  G3056:{l:"\u03bb\u03cc\u03b3\u03bf\u03c2",t:"logos",p:"Noun, Masculine",d:"Word, speech, divine utterance; reason. John's title for the pre-existent Christ draws on Hebrew Wisdom traditions and the creative word of God in Genesis 1."},
  G2532:{l:"\u03ba\u03b1\u03af",t:"kai",p:"Conjunction",d:"And, also, even, indeed. The most common Greek conjunction; can carry emphatic force depending on context."},
  G4314:{l:"\u03c0\u03c1\u03cc\u03c2",t:"pros",p:"Preposition",d:"To, toward, with, near. With the accusative, pros ton Theon in John 1:1-2 implies a face-to-face, intimate relationship between the Logos and the Father."},
  G2316:{l:"\u03b8\u03b5\u03cc\u03c2",t:"theos",p:"Noun, Masculine",d:"God, a god, divine being. In John 1:1, used with the article (ho Theos = the Father) and without (Theos en ho Logos). The anarthrous use is central in Trinitarian Christology."},
  G3778:{l:"\u03bf\u1f57\u03c4\u03bf\u03c2",t:"houtos",p:"Demonstrative Pronoun",d:"This, this one, he. In John 1:2, refers back to the Logos of v.1, anchoring his eternal identity with God before moving to the act of creation."},
  G3956:{l:"\u03c0\u1fb6\u03c2",t:"pas",p:"Adjective",d:"All, every, whole. In John 1:3, makes an absolute claim: all things — without exception — came into being through the Logos."},
  G1223:{l:"\u03b4\u03b9\u03ac",t:"dia",p:"Preposition",d:"Through, by means of. With the genitive, denotes agency — through him identifies the Logos as the instrumental cause of all creation."},
  G846:{l:"\u03b1\u1f50\u03c4\u03cc\u03c2",t:"autos",p:"Personal Pronoun",d:"He, she, it; self, same. In John 1:3-4, refers to the Logos as the subject of creation and the source of life."},
  G1096:{l:"\u03b3\u03af\u03bd\u03bf\u03bc\u03b1\u03b9",t:"ginomai",p:"Verb",d:"To become, to come into being. Contrasts with eimi — the Logos was (en) eternally; created things came into being (egeneto). This is the theological backbone of John's prologue."},
  G5565:{l:"\u03c7\u03c9\u03c1\u03af\u03c2",t:"ch\u014dris",p:"Preposition",d:"Apart from, without. In John 1:3, an absolute claim: not even one thing came into existence apart from the Word."},
  G3761:{l:"\u03bf\u1f50\u03b4\u03ad",t:"oude",p:"Negative Conjunction",d:"And not, nor, not even. Strengthens the preceding negative, reinforcing the totality of the Logos's creative role."},
  G1520:{l:"\u03b5\u1f37\u03c2",t:"heis",p:"Cardinal Number",d:"One. In John 1:3 (oude hen), not even one thing — leaving absolutely no exception."},
  G3739:{l:"\u1f45\u03c2",t:"hos",p:"Relative Pronoun",d:"Who, which, that. In John 1:3, ho gegonen (that has come into being) refers to all created reality."},
  G2222:{l:"\u03b6\u03c9\u03ae",t:"z\u014d\u0113",p:"Noun, Feminine",d:"Life; divine, eternal life. A key Johannine term — occurs 36 times in John's Gospel. The life of God himself communicated through the Logos."},
  G5457:{l:"\u03c6\u1ff6\u03c2",t:"ph\u014ds",p:"Noun, Neuter",d:"Light. Used in John's Gospel as a metaphor for truth, holiness, and divine revelation. Jesus identifies himself as the light of the world (John 8:12)."},
  G444:{l:"\u1f04\u03bd\u03b8\u03c1\u03c9\u03c0\u03bf\u03c2",t:"anthr\u014dpos",p:"Noun, Masculine",d:"Human being, person. In John 1:4, the light of humanity is universal — the Logos's light is for all people."},
  G4653:{l:"\u03c3\u03ba\u03bf\u03c4\u03af\u03b1",t:"skotia",p:"Noun, Feminine",d:"Darkness. A pervasive Johannine symbol for spiritual evil and separation from God. The hostile environment into which the light shines."},
  G5316:{l:"\u03c6\u03b1\u03af\u03bd\u03c9",t:"phain\u014d",p:"Verb",d:"To shine, to appear. The present tense phainei in John 1:5 signals continuous, ongoing action — the light keeps shining regardless of the darkness."},
  G3756:{l:"\u03bf\u1f50",t:"ou",p:"Negative Particle",d:"No, not. The primary Greek negative for indicative statements. An unqualified assertion."},
  G2638:{l:"\u03ba\u03b1\u03c4\u03b1\u03bb\u03b1\u03bc\u03b2\u03ac\u03bd\u03c9",t:"katalamban\u014d",p:"Verb",d:"To seize, to overcome; also to comprehend. Likely both senses in John 1:5 — the darkness neither overcame nor comprehended the light."},
  H7225:{l:"\u05e8\u05b5\u05d0\u05e9\u05c1\u05b4\u05d9\u05ea",t:"reshit",p:"Noun, Feminine",d:"Beginning, first, chief. The opening bereshit has been debated for millennia — absolute (In the beginning) or construct? Most modern scholars favor the absolute reading."},
  H1254:{l:"\u05d1\u05bc\u05b8\u05e8\u05b8\u05d0",t:"bara",p:"Verb (Qal)",d:"To create, to form. Used exclusively with God as subject throughout the OT — never of human making. This signals a uniquely divine mode of creation."},
  H430:{l:"\u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd",t:"Elohim",p:"Noun, Masculine Plural",d:"God, gods, divine beings. A plural form used as the primary name for the God of Israel — a plural of majesty. Occurs 2,570 times in the OT."},
  H853:{l:"\u05d0\u05b5\u05ea",t:"et",p:"Particle",d:"Definite direct object marker. Has no English equivalent — it marks the definite direct object of a verb."},
  H8064:{l:"\u05e9\u05c1\u05b8\u05de\u05b7\u05d9\u05b4\u05dd",t:"shamayim",p:"Noun, Masculine Plural",d:"Heaven, sky, heavens. Always in plural or dual form. Refers to both the visible sky and the abode of God. Paired with ha'aretz in the merism the heavens and the earth = the entire universe."},
  H776:{l:"\u05d0\u05b6\u05e8\u05b6\u05e5",t:"eretz",p:"Noun, Feminine",d:"Earth, land, ground. In Gen 1:1, the second half of the foundational merism. In 1:2, described as tohu wavohu before God's ordering work begins."},
  H1961:{l:"\u05d4\u05b8\u05d9\u05b8\u05d4",t:"hayah",p:"Verb (Qal)",d:"To be, to become, to exist. The primary Hebrew verb of existence. YHWH is likely derived from this root — He who is or He who causes to be."},
  H8414:{l:"\u05ea\u05b9\u05d4\u05d5\u05bc",t:"tohu",p:"Noun, Masculine",d:"Formlessness, chaos, emptiness. Describes disordered, uninhabitable space. Paired with bohu in the famous tohu wavohu — the state of the earth before God's creative ordering."},
  H922:{l:"\u05d1\u05b9\u05d4\u05d5\u05bc",t:"bohu",p:"Noun, Masculine",d:"Emptiness, void. Occurs only three times in the OT, always paired with tohu: Gen 1:2; Isa 34:11; Jer 4:23. Together they describe total desolation."},
  H2822:{l:"\u05d7\u05b9\u05e9\u05c1\u05b6\u05da\u05b0",t:"choshek",p:"Noun, Masculine",d:"Darkness, obscurity. Both physical and metaphorical. In Gen 1:2, it characterizes the pre-light state of creation. God's first word stands in direct contrast."},
  H5921:{l:"\u05e2\u05b7\u05dc",t:"al",p:"Preposition",d:"Upon, over, above, against, concerning. In Gen 1:2, used twice — darkness over the deep, the Spirit over the waters."},
  H6440:{l:"\u05e4\u05bc\u05b8\u05e0\u05b4\u05d9\u05dd",t:"panim",p:"Noun, Masculine Plural",d:"Face, surface, presence. Always in plural form. In Gen 1:2, the face of the deep and the face of the waters."},
  H8415:{l:"\u05ea\u05bc\u05b0\u05d4\u05d5\u05b9\u05dd",t:"tehom",p:"Noun, Feminine",d:"The deep, abyss, primordial ocean. The vast, dark waters before creation's ordering. In Genesis it carries no divine status — a material reality over which the Spirit hovers."},
  H7307:{l:"\u05e8\u05d5\u05bc\u05d7\u05b7",t:"ruach",p:"Noun, Common",d:"Spirit, wind, breath. In Gen 1:2, ruach Elohim is variously translated Spirit of God, wind of God, or mighty wind. The Christian reading sees the Holy Spirit brooding over creation."},
  H7363:{l:"\u05e8\u05b8\u05d7\u05b7\u05e3",t:"rachap",p:"Verb (Piel)",d:"To hover, to flutter — as a bird over its young. The Spirit's hovering in Gen 1:2 suggests nurturing, life-giving presence. Same verb in Deut 32:11."},
  H4325:{l:"\u05de\u05b7\u05d9\u05b4\u05dd",t:"mayim",p:"Noun, Masculine Plural",d:"Water, waters. Always in plural form. In Gen 1, the waters are both the primordial chaos over which the Spirit hovers and the substance God gathers to reveal dry land."},
  H559:{l:"\u05d0\u05b8\u05de\u05b7\u05e8",t:"amar",p:"Verb (Qal)",d:"To say, to speak, to command. The repeated And God said in Gen 1 establishes that creation is accomplished through divine speech — resonating directly with John 1:1."},
  H216:{l:"\u05d0\u05d5\u05b9\u05e8",t:"or",p:"Noun, Masculine",d:"Light, daylight. The first element created by divine speech in Gen 1:3. Used as a metaphor for life, salvation, and divine presence throughout the OT."},
  G4100:{l:"\u03c0\u03b9\u03c3\u03c4\u03b5\u03cd\u03c9",t:"pisteuo",p:"Verb",d:"Believe, trust, have faith in. The NT\u2019s central term for saving faith \u2014 an active, relational trust rather than mere intellectual assent. Used 241 times in the NT, 98 in John alone. In the LXX, pisteuo renders the Hebrew aman (Gen 15:6): Abraham believed God \u2014 the same verb, the same act of trust, across both Testaments."},
  G4102:{l:"\u03c0\u03af\u03c3\u03c4\u03b9\u03c2",t:"pistis",p:"Noun, Feminine",d:"Faith, trust, faithfulness. The noun form of pisteuo. In Paul, pistis is the means of justification (Rom 3:22; Gal 2:16). Renders the Hebrew emunah (faithfulness) in the LXX \u2014 Hab 2:4, the righteous will live by emunah/pistis, underlies Paul\u2019s entire argument in Romans and Galatians."},
  G4771:{l:"\u03c3\u03cd",t:"sy",p:"Personal Pronoun",d:"You (singular). The second-person singular pronoun. Emphatic when used with a verb whose ending already marks person."},
  G4335:{l:"\u03c0\u03c1\u03bf\u03c3\u03b5\u03c5\u03c7\u03ae",t:"proseuche",p:"Noun, Feminine",d:"Prayer, place of prayer. Specifically the devotional address to God, often corporate or habitual. Distinguished from deomai (petition from need) and eucharisteo (thanksgiving)."},
  G3417:{l:"\u03bc\u03bd\u03b5\u03af\u03b1",t:"mneia",p:"Noun, Feminine",d:"Remembrance, mention, memory. Used in the context of prayer and gratitude \u2014 making mention of someone before God. Paul uses mneia in his letter openings (Rom 1:9; Eph 1:16; Phil 1:3; 1 Thess 1:2) to describe unceasing intercessory prayer."},
  G3421:{l:"\u03bc\u03bd\u03b7\u03bc\u03bf\u03bd\u03b5\u03cd\u03c9",t:"mnemoneuo",p:"Verb",d:"To remember, to call to mind, to think of. Deliberate, sustained remembrance \u2014 of people, deeds, or covenant history. In 1 Thess 1:3, Paul remembers the Thessalonians' work of faith, labor of love, and endurance of hope before God."},
  G2873:{l:"\u03ba\u03cc\u03c0\u03bf\u03c2",t:"kopos",p:"Noun, Masculine",d:"Labor, toil, trouble \u2014 exhausting physical or spiritual work. Kopos implies effort that costs something. Paired with agape (love) in 1 Thess 1:3 to describe self-giving Christian service that is not merely emotional but demanding."},
  G5281:{l:"\u1f51\u03c0\u03bf\u03bc\u03bf\u03bd\u03ae",t:"hypomone",p:"Noun, Feminine",d:"Endurance, patient steadfastness \u2014 not passive resignation but active perseverance under pressure. The Pauline triad of faith (pistis), love (agape), and hope (elpis) with its corresponding virtues \u2014 work, labor, endurance \u2014 is a signature NT summary of Christian life."},
  G2331:{l:"\u0398\u03b5\u03c3\u03c3\u03b1\u03bb\u03bf\u03bd\u03b9\u03ba\u03b5\u03cd\u03c2",t:"thessalonikeus",p:"Noun, Masculine \u2014 Proper Name",d:"A Thessalonian \u2014 an inhabitant of Thessalonica, a major Roman city in Macedonia. Paul founded the church there on his second journey (Acts 17:1-9). The Thessalonian letters are the earliest of Paul's surviving correspondence, written around AD 50."},
  G4610:{l:"\u03a3\u03b9\u03bb\u03bf\u03c5\u03b1\u03bd\u03cc\u03c2",t:"silouanos",p:"Noun, Masculine \u2014 Proper Name",d:"Silvanus \u2014 the Roman form of Silas (Acts 15:22). A leading figure in Jerusalem, a Roman citizen (Acts 16:37), and Paul's co-worker on the second missionary journey. Co-sender of both Thessalonian letters and 1 Peter (1 Pet 5:12)."},
  G2168:{l:"\u03b5\u1f50\u03c7\u03b1\u03c1\u03b9\u03c3\u03c4\u03ad\u03c9",t:"eucharisteo",p:"Verb",d:"To give thanks, to be grateful. The root of the word Eucharist. In Paul's letters, thanksgiving (eucharisteo) at the opening signals the spiritual vitality of the church addressed. Its notable absence in Galatians is a marker of that letter's urgency."},
  G4012:{l:"\u03c0\u03b5\u03c1\u03af",t:"peri",p:"Preposition",d:"About, concerning, around, on behalf of. With the genitive, denotes reference or subject matter. Common in prayer and intercession contexts: making mention peri (concerning) someone before God."},
  G3842:{l:"\u03c0\u03ac\u03bd\u03c4\u03bf\u03c4\u03b5",t:"pantote",p:"Adverb",d:"Always, at all times. From pas (all) + pote (when/ever). Emphasizes unbroken continuity. Paul's always in 1 Thess 1:2 is not rhetorical \u2014 it reflects the rhythm of his sustained intercessory life."},
  G1909:{l:"\u1f10\u03c0\u03af",t:"epi",p:"Preposition",d:"On, upon, over, at, on the basis of. Extremely versatile. With the genitive (position): upon. With the dative (contact/basis): on/at. With the accusative (motion): onto/over. In 1 Thess 1:2, epi ton proseuchon = in/at our prayers."},
  G4160:{l:"\u03c0\u03bf\u03b9\u03ad\u03c9",t:"poieo",p:"Verb",d:"To do, make, produce, perform. One of the most common verbs in the NT. In 1 Thess 1:2, poioumenoi mneian = making mention \u2014 an idiom for including someone in prayer. The same phrase appears in Eph 1:16 and Phil 1:4."},
  G3956:{l:"\u03c0\u1fb6\u03c2",t:"pas",p:"Adjective/Pronoun",d:"All, every, whole, each. In 1 Thess 1:2, panton hymon = all of you, emphasizing that Paul's gratitude encompasses the entire congregation, not just some members."},
  G80:{l:"\u1f00\u03b4\u03b5\u03bb\u03c6\u03cc\u03c2",t:"adelphos",p:"Noun, Masculine",d:"Brother \u2014 in the NT almost always a fellow believer, member of the covenant community. The address adelphoi (brothers and sisters) is Paul's characteristic way of addressing his congregations as beloved family."},
  G2316:{l:"\u03b8\u03b5\u03cc\u03c2",t:"theos",p:"Noun, Masculine",d:"God, deity. The standard Greek word for the God of Israel in the LXX (translating Elohim and YHWH) and NT. In 1 Thess 1:1, the assembly is described as in God the Father \u2014 a distinctly Christian theological formulation."},
  G3962:{l:"\u03c0\u03b1\u03c4\u03ae\u03c1",t:"pater",p:"Noun, Masculine",d:"Father. Applied to God throughout the NT, especially in Paul and John. The Aramaic Abba (Mark 14:36; Rom 8:15; Gal 4:6) underlies the Greek pater, suggesting an intimate, familial address rooted in Jesus's own prayer language."},
  G2962:{l:"\u03ba\u03cd\u03c1\u03b9\u03bf\u03c2",t:"kyrios",p:"Noun, Masculine",d:"Lord, master, owner. In the LXX, kyrios renders the divine name YHWH thousands of times. The NT's application of kyrios to Jesus (Phil 2:11; Acts 2:36) is among its most theologically dense claims \u2014 placing Jesus in the identity of Israel's God."},
  G2424:{l:"\u1f38\u03b7\u03c3\u03bf\u1fe6\u03c2",t:"iesous",p:"Noun, Masculine \u2014 Proper Name",d:"Jesus \u2014 Greek form of the Hebrew Yeshua (Joshua), meaning YHWH saves. The name given by the angel before his birth (Matt 1:21). As Joshua led Israel into the promised land, Jesus leads humanity into eternal life."},
  G5547:{l:"\u03a7\u03c1\u03b9\u03c3\u03c4\u03cc\u03c2",t:"christos",p:"Noun, Masculine \u2014 Title",d:"Christ \u2014 the Greek translation of the Hebrew Mashiach (Messiah), meaning Anointed One. In the NT, Christos moves quickly from title to virtual second name. Its full weight as the fulfillment of Israel's royal, priestly, and prophetic anointing traditions is never far beneath the surface."},
  G5485:{l:"\u03c7\u03ac\u03c1\u03b9\u03c2",t:"charis",p:"Noun, Feminine",d:"Grace, favor, gift, gratitude. The central Pauline term for God's unmerited favor in salvation. Charis in the greeting (grace to you) is likely a Christianized form of the standard Greek greeting chairein, reloaded with theological content."},
  G1515:{l:"\u03b5\u1f30\u03c1\u03ae\u03bd\u03b7",t:"eirene",p:"Noun, Feminine",d:"Peace \u2014 in the LXX, eirene renders the Hebrew shalom. Shalom is not merely the absence of conflict but wholeness, flourishing, covenant harmony. The Pauline greeting grace and peace pairs Greek (charis) and Hebrew (shalom) conceptual worlds in a single formula."},
};

function extractBSBText(content) {
  return (content||[]).map(item=>{
    if(typeof item==='string') return item;
    if(item && item.text) return item.text;
    return '';
  }).join('').replace(/\s+/g,' ').trim();
}

async function fetchBSBChapter(book, ch) {
  const osisId = OSIS_ID[book];
  if(!osisId) return null;
  const key = osisId+'|'+ch;
  if(bsbCache[key]) return bsbCache[key];
  try {
    const r = await fetch('https://bible.helloao.org/api/BSB/'+osisId+'/'+ch+'.json');
    if(!r.ok) return null;
    const data = await r.json();
    const verses = {};
    if(data.chapter && data.chapter.content){
      data.chapter.content.forEach(item=>{
        if(item.type==='verse') verses[item.number]=extractBSBText(item.content);
      });
    }
    bsbCache[key] = verses;
    return verses;
  } catch(e){ return null; }
}

async function fetchChapterFromApiBible(bibleId, book, ch) {
  const key = bibleId+"|"+book+"|"+ch;
  if (translationCache[key]) return translationCache[key];
  const osisId = OSIS_ID[book];
  if (!osisId) return null;
  const chapterId = osisId+"."+ch;
  try {
    const r = await fetch(
      `https://rest.api.bible/v1/bibles/${bibleId}/chapters/${chapterId}?content-type=json&include-titles=false&include-chapter-numbers=false&include-notes=false&fums-version=3`,
      {headers:{"api-key":API_BIBLE_KEY}}
    );
    if (!r.ok) return null;
    const data = await r.json();
    const verses = parseApiBibleJson(data.data && data.data.content ? data.data.content : []);
    const copyright = (data.data && data.data.copyright) || "";
    const fumsToken = data.meta && data.meta.fumsToken;
    if (fumsToken && typeof window.fums === "function") window.fums("trackView", fumsToken);
    if (verses.length) translationCache[key] = {verses, copyright};
    return verses.length ? {verses, copyright} : null;
  } catch(e) { return null; }
}

function parseApiBibleJson(nodes) {
  const verses = {};
  let cur = null;
  function walk(arr) {
    if (!Array.isArray(arr)) return;
    for (const n of arr) {
      if (n && n.name === "verse" && n.attrs && n.attrs.number) {
        cur = parseInt(n.attrs.number);
        if (!verses[cur]) verses[cur] = "";
        walk(n.items || []);
      } else if (n && (n.name === "versenum" || (n.attrs && n.attrs.style === "v"))) {
        // skip verse-number display nodes
      } else if (n && n.text !== undefined && cur !== null) {
        verses[cur] = (verses[cur] || "") + n.text;
      } else if (n && n.items) {
        walk(n.items);
      }
    }
  }
  walk(nodes);
  return Object.entries(verses)
    .map(([v,t]) => {
      const num = parseInt(v);
      let text = t.trim().replace(/\s+/g," ");
      // Strip leading verse number if API.Bible included it as a text node
      const ns = String(num);
      if (text.startsWith(ns) && (text.length === ns.length || !/\d/.test(text[ns.length]))) {
        text = text.slice(ns.length).trim();
      }
      return {v:num, text};
    })
    .sort((a,b) => a.v - b.v)
    .filter(x => x.text);
}

async function fetchInterlinearBook(testament, book) {
  const key = testament + "|" + book;
  if (bookCache[key]) return bookCache[key];
  const fname = book.replace(/ /g, "_") + ".json";
  const url = GITHUB_RAW + "/" + testament + "/" + fname;
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    const data = await r.json();
    bookCache[key] = data;
    return data;
  } catch(e) {
    return null;
  }
}

// ── Ambient Audio ────────────────────────────────────────────────────────────
// Rhubarb-style devotional pad: detuned sine clusters, per-voice amplitude
// breathing, cathedral reverb dominates (70% wet). 1.0s attack/release.
function buildAmbient(){
  var AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return null;
  var ctx=new AudioCtx();

  // 4-chord loop — bass (vi 0-1) + pad (vi 2-5) per chord
  // G3 and D4 are locked across Gadd9/Cadd9/Cadd9; A4 appears as the magic 9th
  var PROG=[
    //  bass──────────────  pad──────────────────────────────
    [49.00, 98.00,  196.00, 246.94, 293.66, 440.00], // Gadd9  G1 G2 | G3 B3 D4 A4
    [65.41, 130.81, 196.00, 261.63, 293.66, 392.00], // Cadd9  C2 C3 | G3 C4 D4 G4
    [73.42, 146.83, 220.00, 293.66, 392.00, 440.00], // Dsus4  D2 D3 | A3 D4 G4 A4
    [65.41, 130.81, 196.00, 261.63, 293.66, 392.00], // Cadd9  C2 C3 | G3 C4 D4 G4
  ];
  var CHORD_DUR=14;
  var FADE_IN=3.0;
  var FADE_OUT=3.0;
  // vi 0-1 = bass (quiet, centred); vi 2-5 = pad (louder, spread)
  var VOLS=[0.18, 0.15, 0.38, 0.32, 0.28, 0.25];
  var PANS=[0,    0,   -0.45, 0.45, -0.24, 0.24];

  // ── Master
  var master=ctx.createGain();
  master.gain.setValueAtTime(0,ctx.currentTime);
  master.gain.linearRampToValueAtTime(0.42,ctx.currentTime+4.0);
  master.connect(ctx.destination);

  // ── Cathedral reverb: two long filtered-feedback delays
  // Very high wet level — the reverb IS the sound, the direct signal is ghostly
  // Shorter delays = echo cycles faster = old chord drains in ~2s not ~6s
  var rev1=ctx.createDelay(4.0); rev1.delayTime.value=1.8;
  var rlp1=ctx.createBiquadFilter(); rlp1.type='lowpass'; rlp1.frequency.value=3000;
  var rfb1=ctx.createGain(); rfb1.gain.value=0.58;
  var ro1=ctx.createGain(); ro1.gain.value=0.72;
  rev1.connect(rlp1); rlp1.connect(rfb1); rfb1.connect(rev1);
  rev1.connect(ro1); ro1.connect(master);

  var rev2=ctx.createDelay(5.0); rev2.delayTime.value=2.9;
  var rlp2=ctx.createBiquadFilter(); rlp2.type='lowpass'; rlp2.frequency.value=2400;
  var rfb2=ctx.createGain(); rfb2.gain.value=0.50;
  var ro2=ctx.createGain(); ro2.gain.value=0.56;
  rev2.connect(rlp2); rlp2.connect(rfb2); rfb2.connect(rev2);
  rev2.connect(ro2); ro2.connect(master);

  // Pre-delay 50ms: sense of physical space before reverb arrives
  var preDly=ctx.createDelay(0.1); preDly.delayTime.value=0.05;
  preDly.connect(rev1); preDly.connect(rev2);

  // ── Soft lowpass: rolls off harshness, keeps the pad warm and breathy
  var lp=ctx.createBiquadFilter();
  lp.type='lowpass'; lp.frequency.value=1000; lp.Q.value=0.7;
  var dryGain=ctx.createGain(); dryGain.gain.value=0.18; // barely audible direct
  lp.connect(dryGain); dryGain.connect(master);
  // reverbSendGain gates what enters the delay lines — lets us mute the INPUT
  // without ever touching the OUTPUT, so the room never goes silent
  var reverbSendGain=ctx.createGain(); reverbSendGain.gain.value=1.0;
  lp.connect(reverbSendGain); reverbSendGain.connect(preDly);

  // ── Active voice management
  var activeVoiceSets=[];
  var chordIdx=0;

  function createVoiceSet(chord,immediate){
    var vg=ctx.createGain(); vg.gain.value=0;
    vg.connect(lp);

    var allOscs=[];
    for(var vi=0;vi<6;vi++){
      (function(freq,vol,pan,isBass){
        if(isBass){
          // ── Bass voice: pure sine, centred, no detune (detune is muddy at 49-147 Hz)
          var osc=ctx.createOscillator();
          var og=ctx.createGain();
          osc.type='sine';
          osc.frequency.value=freq;
          og.gain.value=vol;
          osc.connect(og); og.connect(vg);
          var bLfo=ctx.createOscillator(); var bLg=ctx.createGain();
          bLfo.type='sine';
          bLfo.frequency.value=0.03+Math.random()*0.03; // very slow, subtle
          bLg.gain.value=vol*0.12;
          bLfo.connect(bLg); bLg.connect(og.gain);
          bLfo.start();
          osc.start(ctx.currentTime);
          allOscs.push(osc,bLfo);
        } else {
          // ── Pad voice: detuned triangle cluster + sine support
          var dets=[-7,0,6];
          var wts=[0.35,0.38,0.27];
          for(var di=0;di<3;di++){
            (function(det,wt){
              var osc=ctx.createOscillator();
              var og=ctx.createGain();
              var panner=ctx.createStereoPanner();
              osc.type='triangle';
              osc.frequency.value=freq;
              osc.detune.value=det+(Math.random()-0.5)*2;
              panner.pan.value=pan*(0.6+di*0.2);
              og.gain.value=vol*wt;
              osc.connect(og); og.connect(panner); panner.connect(vg);
              var bLfo=ctx.createOscillator(); var bLg=ctx.createGain();
              bLfo.type='sine';
              bLfo.frequency.value=0.06+Math.random()*0.08;
              bLg.gain.value=vol*wt*0.22;
              bLfo.connect(bLg); bLg.connect(og.gain);
              bLfo.start();
              osc.start(ctx.currentTime);
              allOscs.push(osc,bLfo);
            })(dets[di],wts[di]);
          }
          // Pure sine under the triangle for warm fundamental
          (function(){
            var sOsc=ctx.createOscillator();
            var sGain=ctx.createGain();
            var sPan=ctx.createStereoPanner();
            sOsc.type='sine';
            sOsc.frequency.value=freq;
            sPan.pan.value=pan*0.4;
            sGain.gain.value=vol*0.28;
            sOsc.connect(sGain); sGain.connect(sPan); sPan.connect(vg);
            var sLfo=ctx.createOscillator(); var sLg=ctx.createGain();
            sLfo.type='sine';
            sLfo.frequency.value=0.04+Math.random()*0.05;
            sLg.gain.value=vol*0.28*0.18;
            sLfo.connect(sLg); sLg.connect(sGain.gain);
            sLfo.start();
            sOsc.start(ctx.currentTime);
            allOscs.push(sOsc,sLfo);
          })();
        }
      })(chord[vi],VOLS[vi],PANS[vi],vi<2);
    }

    var now=ctx.currentTime;
    vg.gain.setValueAtTime(0,now);
    vg.gain.linearRampToValueAtTime(1.0,now+(immediate?0.8:FADE_IN));

    function stop(){
      var n=ctx.currentTime;
      vg.gain.cancelScheduledValues(n);
      vg.gain.setValueAtTime(1.0,n);
      vg.gain.linearRampToValueAtTime(0,n+FADE_OUT);
      setTimeout(function(){
        allOscs.forEach(function(o){try{o.stop();}catch(e){}});
      },(FADE_OUT+0.5)*1000);
    }
    return {stop:stop};
  }

  activeVoiceSets.push(createVoiceSet(PROG[0],true));

  function advanceChord(){
    // Pure crossfade: old chord fades out over FADE_OUT, new chord blooms in over FADE_IN.
    // Reverb, feedback, and send gain are left completely untouched — the room stays wide open.
    // Old and new oscillator sets are separate nodes so notes overlap naturally.
    activeVoiceSets.forEach(function(vs){vs.stop();});
    activeVoiceSets=[];
    chordIdx=(chordIdx+1)%PROG.length;
    activeVoiceSets.push(createVoiceSet(PROG[chordIdx],false));
  }
  var timer=setInterval(advanceChord,CHORD_DUR*1000);

  function stopAll(){
    activeVoiceSets.forEach(function(vs){try{vs.stop();}catch(e){}});
    activeVoiceSets=[];
  }

  return {ctx,master,rev1,rev2,timer,stopAll:stopAll};
}

function teardownAmbient(amb){
  if(!amb)return;
  if(amb.timer)clearInterval(amb.timer);
  if(amb.stopAll)amb.stopAll();
  var now=amb.ctx.currentTime;
  amb.master.gain.setValueAtTime(amb.master.gain.value,now);
  amb.master.gain.linearRampToValueAtTime(0,now+2.5);
  setTimeout(function(){try{amb.ctx.close();}catch(e){}},3500);
}

function NoteModal({verse,onSave,onClose}){
  const [type,setType]=useState("note");
  const [text,setText]=useState("");
  const [ref,setRef]=useState("");
  const [listening,setListening]=useState(false);
  const recogRef=useRef(null);
  const SpeechRecog=window.SpeechRecognition||window.webkitSpeechRecognition;
  const micSupported=!!SpeechRecog;

  function toggleListen(){
    if(!micSupported)return;
    if(listening){
      recogRef.current&&recogRef.current.stop();
      setListening(false);
      return;
    }
    var recog=new SpeechRecog();
    recog.continuous=true;
    recog.interimResults=false;
    recog.lang='en-US';
    recog.onresult=function(e){
      var t='';
      for(var i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal)t+=e.results[i][0].transcript;
      }
      if(t)setText(function(prev){return prev+(prev&&!prev.endsWith(' ')?' ':'')+t;});
    };
    recog.onend=function(){setListening(false);};
    recog.onerror=function(){setListening(false);};
    recogRef.current=recog;
    recog.start();
    setListening(true);
  }

  function save(){
    if(recogRef.current)recogRef.current.stop();
    if(type==="note"&&!text.trim())return;
    if(type==="link"&&!ref.trim())return;
    onSave({type,text:text.trim(),ref:ref.trim()});
  }

  return(
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div><div className="modal-title">Add to verse {verse}</div><div className="modal-sub">Attach a note or cross-reference</div></div>
        <div className="type-row">
          <button className={"type-btn"+(type==="note"?" on":"")} onClick={()=>setType("note")}>📝 Note</button>
          <button className={"type-btn"+(type==="link"?" on":"")} onClick={()=>setType("link")}>🔗 Verse Link</button>
        </div>
        {type==="note"
          ?<div style={{position:'relative'}}>
            <textarea placeholder="Your note…" value={text} onChange={e=>setText(e.target.value)} autoFocus style={{paddingRight:micSupported?'2.5rem':undefined}}/>
            {micSupported&&(
              <button className={"mic-btn"+(listening?" mic-on":"")} onClick={toggleListen}
                title={listening?"Stop recording":"Tap to dictate"}>
                {listening?'⏹':'🎙'}
              </button>
            )}
            {listening&&<div className="mic-indicator">● Listening…</div>}
          </div>
          :<input type="text" placeholder="e.g. Gen 1:1 or John 3:16" value={ref} onChange={e=>setRef(e.target.value)} autoFocus/>}
        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={save}>Save</button>
        </div>
      </div>
    </div>
  );
}

// Lazy-loaded Strong's dictionary cache
const _SD = {}; // { G: {G2316:{l,t,d,k},...}|null, H: {...}|null }

// Patch for words where the source data has s:"" — keyed by normalized Greek/Hebrew form.
// Normalize: strip text-critical markers (⸀⸁⸂⸃) and trailing punctuation before lookup.
function _normGreek(s){return s?s.replace(/[⸀⸁⸂⸃]/g,'').replace(/[.,;:!?⸃·]+$/g,'').trim():'';}
const STRONGS_PATCH={
  // Matthew data gaps
  "Βίβλος":"G976","Θαμάρ":"G2283","Ῥαχάβ":"G4477","Ῥούθ":"G4503",
  "Οὐρίου":"G3774","μνηστευθείσης":"G3423","δειγματίσαι":"G1165",
  "γεννᾶται":"G1080","ἐξετάσατε":"G1833","φαίνεται":"G5316",
  "κατωτέρω":"G2736","ἄγριον":"G66",
};

function shortGloss(s){
  if(!s)return "";
  if(GLOSS[s])return GLOSS[s].l;
  const loc=S[s];
  if(loc){const d=loc.d;if(!d)return loc.l||"";const cut=d.split(/[,;]/)[0].trim();return cut.length>22?cut.slice(0,20)+"…":cut;}
  // Use lazy-loaded dict if already cached
  const kind=s[0];
  if(_SD[kind]&&_SD[kind][s]){const e=_SD[kind][s];const d=e.d||e.k||"";if(!d)return e.l||"";const cut=d.split(/[,;]/)[0].trim();return cut.length>22?cut.slice(0,20)+"…":cut;}
  return "";
}

function WordCell({word,vNum,isNT,selKey,onClick}){
  const key=vNum+"-"+word.id;
  const sel=selKey===key;
  const heb=!isNT;
  // Resolve effective Strong's: 1. data  2. static patch  3. transliteration reverse-index
  const _tNorm=word.t?word.t.toLowerCase().replace(/[^a-z]/g,''):'';
  const ws=word.s||STRONGS_PATCH[_normGreek(word.o)]||(isNT?_SD_TLIT_G[_tNorm]:_SD_TLIT_H[_tNorm])||'';
  const hasLxx=!!LXX[ws];
  const _wb=word.b!=null?String(word.b).trim():"";
  const gloss=_wb||shortGloss(ws);
  // Pass patched word so the Strong's panel receives a valid number
  const _word=ws!==word.s?Object.assign({},word,{s:ws}):word;
  return(
    <div className={"wc"+(sel?" sel"+(isNT?"":" ot"):"")+(hasLxx?" lxx":"")} onClick={()=>onClick(key,_word)} title={hasLxx?"LXX bridge — click for details":"Click for Strong's definition"}>
      <span className={"w-o"+(heb?" heb":"")}>{word.o}</span>
      <span className="w-t">{word.t}</span>
      <span className={"w-s "+(isNT?"nt":"ot")}>{ws}</span>
      {hasLxx&&<span className="lxx-dot">◆◆</span>}
      {gloss&&<span className="w-b">{gloss}</span>}
    </div>
  );
}

function LeftVerse({verse,isNT,isActive,noteItems,onAddNote,onDeleteNoteItem,onNavigate,onSelect,hlMode,hlBg,hlHex,onHighlight,book,ch,onCompare}){
  const [showPop,setShowPop]=useState(false);
  const [showQt,setShowQt]=useState(false);
  const hasNote=noteItems&&noteItems.length>0;
  var qtKey=book&&ch?(book+' '+ch+':'+verse.v):null;
  var qtData=qtKey&&OT_QUOTES[qtKey]?OT_QUOTES[qtKey]:null;
  var nqKey=(!isNT&&book&&ch)?(book+' '+ch+':'+verse.v):null;
  var nqData=nqKey&&NT_QUOTES[nqKey]?NT_QUOTES[nqKey]:null;
  const [showNq,setShowNq]=useState(false);
  function handleClick(){
    if(hlMode){onHighlight&&onHighlight(verse.v);return;}
    onSelect&&onSelect(verse.v);
    const el=document.getElementById("rv-"+verse.v);
    if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"});
  }
  var rowStyle={position:"relative"};
  if(hlBg){rowStyle.background=hlBg;rowStyle.borderLeft="3px solid "+(hlHex||'transparent');}

    <div id={"lv-"+verse.v} className={"lv-row"+(isActive&&!hlMode?(isNT?" active":" active ot"):"")}

          {qtData&&!hlMode&&<span className="qt-badge" title="OT Quotation" onClick={e=>{e.stopPropagation();setShowQt(p=>!p);}}>OT</span>}
          {nqData&&!hlMode&&<span className="nt-badge" title="Quoted in NT" onClick={e=>{e.stopPropagation();setShowNq(p=>!p);}}>NT</span>}
        </span>

        {!hlMode&&<button className="lv-note-btn" title="Add note or link" onClick={e=>{e.stopPropagation();onAddNote(verse.v);}}>+</button>}
        {hlMode&&hlBg&&<span style={{fontSize:'.7rem',opacity:.6,paddingTop:'2px'}}>✓</span>}
      </div>

      {showQt&&qtData&&<QuotePopover quotes={qtData} onClose={()=>setShowQt(false)} onNavigate={onNavigate}/>}
      {showNq&&nqData&&<NTQuotePopover quotes={nqData} onClose={()=>setShowNq(false)} onNavigate={onNavigate}/>}
    </div>
  );
}

  var [tab, setTab] = useState('chapter');

  // Compute places for this chapter (plain loop, no for-of)
  var chapterPlaces = [];
  var allNames = Object.keys(PLACES_DATA);
  for(var pi = 0; pi < allNames.length; pi++){
    var pname = allNames[pi];
    var pdata = PLACES_DATA[pname];
    var phit = null;
    for(var ei = 0; ei < pdata.events.length; ei++){
      var ev = pdata.events[ei];
      if(ev.book === book && parseInt(ev.ch,10) === chNum){ phit = ev; break; }
    }
    if(phit){
      chapterPlaces.push({name:pname, type:pdata.type, region:pdata.region,
        desc:pdata.desc, also:pdata.also, events:pdata.events, highlight:phit});

  var browsePlaces = [];

        desc:bd.desc, also:bd.also, events:bd.events});

function ParallelPanel({book,ch,verseNum,isNT,interlinearVerses,onClose}){
  const allTrans=[{id:"BSB",label:"BSB — Berean Standard"}, ...TRANSLATIONS];
  const [sel,setSel]=useState(allTrans.map(t=>t.id));
  const [texts,setTexts]=useState({});

  useEffect(()=>{
    setTexts({});
    // BSB — fetch from bible.helloao.org (github data files have empty bsb fields)
    fetchBSBChapter(book,ch).then(verses=>{
      if(verses&&verses[verseNum]) setTexts(prev=>({...prev,BSB:verses[verseNum]}));
    }).catch(()=>{});
    // API translations
    TRANSLATIONS.forEach(t=>{
      const key=t.id+'|'+book+'|'+ch;
      if(translationCache[key]){
        const vt=translationCache[key].verses&&translationCache[key].verses.find(v=>v.v===verseNum);
        if(vt)setTexts(prev=>({...prev,[t.id]:vt.text}));
        return;
      }
      if(t.id==="WEB"){
        fetch("https://bible-api.com/"+bookUrl(book,ch)+"?translation=web")
          .then(r=>r.json()).then(data=>{
            if(data.verses){
              const vt=data.verses.find(v=>v.verse===verseNum);
              if(vt)setTexts(prev=>({...prev,WEB:vt.text.trim()}));
            }
          }).catch(()=>{});
      }else{
        fetchChapterFromApiBible(t.id,book,ch).then(result=>{
          if(result&&result.verses){
            const vt=result.verses.find(v=>v.v===verseNum);
            if(vt)setTexts(prev=>({...prev,[t.id]:vt.text}));
          }
        });
      }
    });
  },[book,ch,verseNum]);

  const shown=allTrans.filter(t=>sel.includes(t.id));
  const cols=Math.max(1,shown.length);

  return(
    <div className="parallel-overlay" onClick={onClose}>
      <div className="parallel-modal" onClick={e=>e.stopPropagation()}>
        <div className="parallel-hdr">
          <span className="parallel-ref">{book} {ch}:{verseNum}</span>
          <button className="parallel-close" onClick={onClose}>×</button>
        </div>
        <div className="parallel-toggles">
          {allTrans.map(t=>(
            <span key={t.id} className={"parallel-toggle"+(sel.includes(t.id)?" on"+(isNT?"":" ot"):"")} onClick={()=>setSel(s=>s.includes(t.id)?s.length>1?s.filter(x=>x!==t.id):s:[...s,t.id])}>
              {t.label.split('—')[0].trim()||t.id}
            </span>
          ))}
        </div>
        <div className="parallel-grid" style={{gridTemplateColumns:`repeat(${cols},1fr)`}}>
          {shown.map(t=>(
            <div key={t.id} className="parallel-col">
              <div className="parallel-col-label">{t.label.split('—')[0].trim()}</div>
              <div className="parallel-col-text">{texts[t.id]||<span style={{color:"var(--text3)",fontStyle:"normal",fontSize:".78rem"}}>Loading…</span>}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function HotTopicsPanel({onClose, onNavigate}){
  const [sel,setSel]=useState(null);
  const topic=sel!=null?HOT_TOPICS[sel]:null;
  const bodyRef=useRef(null);

  function goSel(i){
    setSel(i);
    if(bodyRef.current)bodyRef.current.scrollTop=0;
  }
  function goBack(){
    setSel(null);
    if(bodyRef.current)bodyRef.current.scrollTop=0;
  }

  function handleVerse(ref){
    if(onNavigate){
      var m=ref.match(/^(.*)\s(\d+):(\d+)/);
      if(m) onNavigate(m[1]+" "+m[2]+":"+m[3]);
    }
    onClose();

  return(
    <div className="theo-overlay" onClick={onClose}>
      <div className="theo-panel" onClick={function(e){e.stopPropagation();}}>
        <div className="theo-header">
          {topic&&<button className="theo-back" onClick={goBack}>←</button>}
          <span className="theo-title">{topic ? topic.icon+" "+topic.title : "🔥 Hot Topics"}</span>
          <button className="theo-close" onClick={onClose}>×</button>
        </div>
        <div className="theo-body" style={{padding:0}} ref={bodyRef}>

            <>
              <p style={{fontSize:'.8rem',color:'var(--text3)',margin:'0',lineHeight:1.6,padding:'1rem 1rem .5rem'}}>
