const GITHUB_RAW = "https://raw.githubusercontent.com/pilgrimtozion/interlinear-bible/main/data";
const bookCache = {};

async function fetchInterlinearBook(testament, book) {
  const key = testament + "|" + book;
  if (bookCache[key]) return bookCache[key];
  const fname = book.replace(/ /g, "_") + ".json";
  const url = GITHUB_RAW + "/" + testament + "/" + fname;
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    const data = await r.json();
    bookCache[key] = data;
    return data;
  } catch(e) {
    return null;
  }
}

const NOTES_KEY = "bib_notes_v2";
function loadNotes(){try{return JSON.parse(localStorage.getItem(NOTES_KEY)||"{}")}catch{return {}}}
function saveNotes(n){localStorage.setItem(NOTES_KEY,JSON.stringify(n))}
function nk(t,b,c,v){return t+"|"+b+"|"+c+"|"+v}
function bookUrl(book,ch){return book.toLowerCase().replace(/ /g,"+")+"+"+ch}

function NotePopover({note,isNT,onDelete,onClose,onNavigate}){
  const ref=useRef();
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))onClose();};
    document.addEventListener("mousedown",h);
    return()=>document.removeEventListener("mousedown",h);
  },[onClose]);
  return(
    <div className={"note-pop"+(isNT?"":" ot")} ref={ref} onClick={e=>e.stopPropagation()}>
      <div className={"note-pop-label"+(isNT?"":" ot")}>{note.type==="link"?"🔗 Verse Link":"📝 Note"}</div>
      <div className="note-pop-text">{note.type==="link"
        ?<span style={{color:"var(--nt)",cursor:"pointer",textDecoration:"underline"}} onClick={()=>{if(onNavigate)onNavigate(note.ref);}}>{note.ref}</span>
        :note.text}</div>
      <div className="note-pop-actions">
        <button className="btn btn-danger" style={{fontSize:".7rem",padding:"3px 10px"}} onClick={onDelete}>Remove</button>
      </div>
    </div>
  );
}

function NoteModal({verse,onSave,onClose}){
  const [type,setType]=useState("note");
  const [text,setText]=useState("");
  const [ref,setRef]=useState("");
  function save(){
    if(type==="note"&&!text.trim())return;
    if(type==="link"&&!ref.trim())return;
    onSave({type,text:text.trim(),ref:ref.trim()});
  }
  return(
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div><div className="modal-title">Add to verse {verse}</div><div className="modal-sub">Attach a note or cross-reference</div></div>
        <div className="type-row">
          <button className={"type-btn"+(type==="note"?" on":"")} onClick={()=>setType("note")}>📝 Note</button>
          <button className={"type-btn"+(type==="link"?" on":"")} onClick={()=>setType("link")}>🔗 Verse Link</button>
        </div>
        {type==="note"
          ?<textarea placeholder="Your note…" value={text} onChange={e=>setText(e.target.value)} autoFocus/>
          :<input type="text" placeholder="e.g. Gen 1:1 or John 3:16" value={ref} onChange={e=>setRef(e.target.value)} autoFocus/>}
        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={save}>Save</button>
        </div>
      </div>
    </div>
  );
}

function shortGloss(s){
  if(!s)return "";
  if(GLOSS[s])return GLOSS[s].l;
  if(!S[s])return "";
  const d=S[s].d;
  if(!d)return S[s].l||"";
  const cut=d.split(/[,;]/)[0].trim();
  return cut.length>22?cut.slice(0,20)+"…":cut;
}

function WordCell({word,vNum,isNT,selKey,onClick}){
  const key=vNum+"-"+word.id;
  const sel=selKey===key;
  const heb=!isNT;
  const hasLxx=!!LXX[word.s];
  const gloss=word.b||shortGloss(word.s);
  return(
    <div className={"wc"+(sel?" sel"+(isNT?"":" ot"):"")+(hasLxx?" lxx":"")} onClick={()=>onClick(key,word)} title={hasLxx?"LXX bridge — click for details":"Click for Strong's definition"}>
      <span className={"w-o"+(heb?" heb":"")}>{word.o}</span>
      <span className="w-t">{word.t}</span>
      <span className={"w-s "+(isNT?"nt":"ot")}>{word.s}</span>
      {hasLxx&&<span className="lxx-dot">◆◆</span>}
      {gloss&&<span className="w-b">{gloss}</span>}
    </div>
  );
}

function VerseBlock({verse,isNT,activeV,selKey,onClick,id}){
  return(
    <div id={id} className={"verse-block"+(activeV===verse.v?(isNT?" v-active":" v-active ot"):"")}>
      <div className="v-head-slim">
        <span className={"v-num-r"+(isNT?"":" ot")}>{verse.v}</span>
      </div>
      <div className="word-grid">
        {verse.words.map(w=><WordCell key={verse.v+"-"+w.id} word={w} vNum={verse.v} isNT={isNT} selKey={selKey} onClick={onClick}/>)}
      </div>
    </div>
  );
}

function LeftVerse({verse,isNT,isActive,note,onAddNote,onDeleteNote,onNavigate}){
  const [showPop,setShowPop]=useState(false);
  return(
    <div className={"lv-row"+(isActive?(isNT?" active":" active ot"):"")} style={{position:"relative"}}
         onClick={()=>{const el=document.getElementById("rv-"+verse.v);if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"});}}>
      <div className="lv-header">
        <span className={"lv-num"+(isNT?"":" ot")}>{verse.v}</span>
        <span className="lv-text">
          {verse.text}
          {note&&<span className="note-star" title="View note" onClick={e=>{e.stopPropagation();setShowPop(p=>!p);}}>&#x2726;</span>}
        </span>
        <button className="lv-note-btn" title="Add note or link" onClick={e=>{e.stopPropagation();onAddNote(verse.v);}}>+</button>
      </div>
      {showPop&&note&&<NotePopover note={note} isNT={isNT} onDelete={()=>{onDeleteNote(verse.v);setShowPop(false);}} onClose={()=>setShowPop(false)} onNavigate={ref=>{onNavigate&&onNavigate(ref);setShowPop(false);}}/>}
    </div>
  );
}

function StrongsPanel({entry,strongs,word,isNT,onClose}){
  if(!entry&&!word)return null;
  const heb=strongs&&strongs[0]==="H";
  const bridge=LXX[strongs];
  return(
    <div className="overlay" onClick={onClose}>
      <div className="sp" onClick={e=>e.stopPropagation()}>
        <button className="close-btn" onClick={onClose}>×</button>
        {strongs&&<div className={"sp-num"+(isNT?"":" ot")}>{strongs}</div>}
        <div className={"sp-lemma"+(heb?" heb":"")}>{entry?entry.l:(word&&word.o)||""}</div>
        <div className="sp-tr">{entry?entry.t:(word&&word.t)||""}</div>
        {entry&&<span className="sp-pos">{entry.p}</span>}
        {entry&&<p className="sp-def">{entry.d}</p>}
        {!entry&&strongs&&GLOSS[strongs]&&<p className="sp-def">{GLOSS[strongs].l}</p>}
        {!entry&&(!strongs||!GLOSS[strongs])&&<p className="sp-def" style={{color:"var(--text3)",fontSize:".82rem"}}>No lexical data available for this word.</p>}
        {bridge&&<div className="lxx-bridge">
          <div className="lxx-title">⧁ Septuagint Bridge</div>
          <div className="lxx-pair"><span className="lxx-word">{bridge.lbl}</span><span className="lxx-code">{bridge.cp}</span></div>
          <p className="lxx-note">{bridge.note}</p>
        </div>}
      </div>
    </div>
  );
}


const BOOK_MAP = {
  "gen":"Genesis","ex":"Exodus","exo":"Exodus","lev":"Leviticus","num":"Numbers","deut":"Deuteronomy","deu":"Deuteronomy",
  "josh":"Joshua","jdg":"Judges","judg":"Judges","ruth":"Ruth","1sam":"1 Samuel","2sam":"2 Samuel",
  "1kgs":"1 Kings","1ki":"1 Kings","2kgs":"2 Kings","2ki":"2 Kings","1chr":"1 Chronicles","2chr":"2 Chronicles",
  "ezra":"Ezra","neh":"Nehemiah","esth":"Esther","job":"Job","ps":"Psalms","psa":"Psalms","prov":"Proverbs",
  "eccl":"Ecclesiastes","song":"Song of Solomon","sos":"Song of Solomon","isa":"Isaiah","jer":"Jeremiah",
  "lam":"Lamentations","ezek":"Ezekiel","eze":"Ezekiel","dan":"Daniel","hos":"Hosea","joel":"Joel",
  "amos":"Amos","obad":"Obadiah","jon":"Jonah","mic":"Micah","nah":"Nahum","hab":"Habakkuk",
  "zeph":"Zephaniah","hag":"Haggai","zech":"Zechariah","mal":"Malachi",
  "matt":"Matthew","mt":"Matthew","mark":"Mark","mk":"Mark","luke":"Luke","lk":"Luke",
  "john":"John","jn":"John","acts":"Acts","rom":"Romans","1cor":"1 Corinthians","2cor":"2 Corinthians",
  "gal":"Galatians","eph":"Ephesians","phil":"Philippians","php":"Philippians","col":"Colossians",
  "1thess":"1 Thessalonians","1th":"1 Thessalonians","2thess":"2 Thessalonians","2th":"2 Thessalonians",
  "1tim":"1 Timothy","1ti":"1 Timothy","2tim":"2 Timothy","2ti":"2 Timothy","titus":"Titus","tit":"Titus",
  "phlm":"Philemon","heb":"Hebrews","jas":"James","1pet":"1 Peter","1pe":"1 Peter",
  "2pet":"2 Peter","2pe":"2 Peter","1john":"1 John","1jn":"1 John","2john":"2 John","2jn":"2 John",
  "3john":"3 John","3jn":"3 John","jude":"Jude","rev":"Revelation",
  // also full names lowercased:
  "genesis":"Genesis","exodus":"Exodus","matthew":"Matthew","revelation":"Revelation",
};
function parseRef(ref){
  if(!ref)return null;
  const m=ref.trim().match(/^(\d?\s*[a-zA-Z]+(?:\s+[a-zA-Z]+)?)\s+(\d+)(?::\s*(\d+))?$/);
  if(!m)return null;
  const raw=m[1].trim().toLowerCase().replace(/\s+/g,"");
  const book=BOOK_MAP[raw];
  if(!book)return null;
  const ch=parseInt(m[2]);
  const v=m[3]?parseInt(m[3]):1;
  const test=BOOKS.NT[book]?"NT":BOOKS.OT[book]?"OT":null;
  if(!test)return null;
  return{test,book,ch,v};
}

function App(){
  const [test,setTest]=useState("NT");
  const [book,setBook]=useState("John");
  const [ch,setCh]=useState(1);
  const [dark,setDark]=useState(true);
  const [sel,setSel]=useState(null);
  const [activeV,setActiveV]=useState(null);
  const [notes,setNotes]=useState(loadNotes);
  const [addingNote,setAddingNote]=useState(null);
  const [leftVerses,setLeftVerses]=useState([]);
  const [loading,setLoading]=useState(false);

  const isNT=test==="NT";
  function handleNavigate(refStr){
    const p=parseRef(refStr);
    if(!p)return;
    if(p.test!==test)setTest(p.test);
    setBook(p.book);
    setCh(p.ch);
    setSel(null);
    setActiveV(p.v);
    setTimeout(()=>{
      const el=document.getElementById("rv-"+p.v);
      if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"});
    },600);
  }

  const bookNames=Object.keys(BOOKS[test]);
  const chCount=BOOKS[test][book]||1;
  const chapters=Array.from({length:chCount},(_,i)=>i+1);
  const iData=(INTERLINEAR[test]||{})[book]||{};
  const [fetchedVerses,setFetchedVerses]=useState(null);
  const [fetchingInterlinear,setFetchingInterlinear]=useState(false);
  const interlinearVerses=iData[ch]||(fetchedVerses&&fetchedVerses[String(ch)])||null;

  useEffect(()=>{document.body.className=dark?"":"light";},[dark]);

  useEffect(()=>{
    setFetchedVerses(null);
    const iDataCheck=(INTERLINEAR[test]||{})[book]||{};
    if(!iDataCheck[ch]){
      setFetchingInterlinear(true);
      fetchInterlinearBook(test,book).then(data=>{
        if(data&&data.chapters){
          setFetchedVerses(data.chapters);
        }
        setFetchingInterlinear(false);
      });
    }
  },[test,book]);

  useEffect(()=>{
    setLoading(true);
    setLeftVerses([]);
    fetch("https://bible-api.com/"+bookUrl(book,ch)+"?translation=web")
      .then(r=>r.json())
      .then(data=>{
        if(data.verses){
          setLeftVerses(data.verses.map(v=>({v:v.verse,text:v.text.trim()})));
        }
        setLoading(false);
      })
      .catch(()=>{
        // fallback to interlinear BSB data if available
        if(interlinearVerses){
          setLeftVerses(interlinearVerses.map(v=>({v:v.v,text:v.bsb})));
        }
        setLoading(false);
      });
  },[book,ch,test]);

  const switchTest=t=>{setTest(t);const b=Object.keys(BOOKS[t])[0];setBook(b);setCh(1);setSel(null);setActiveV(null);};
  const handleWord=(key,word)=>setSel(s=>s&&s.key===key?null:{key,word});
  const getNote=v=>notes[nk(test,book,ch,v)];
  const handleSaveNote=(v,data)=>{const n={...notes,[nk(test,book,ch,v)]:data};setNotes(n);saveNotes(n);setAddingNote(null);};
  const handleDeleteNote=v=>{const n={...notes};delete n[nk(test,book,ch,v)];setNotes(n);saveNotes(n);};
  const entry=sel?S[sel.word.s]:null;

  return(
    <div>
      <header>
        <div>
          <div className="app-title">Berean Interlinear Bible</div>
          <div className="app-subtitle">BSB · Greek NT · Hebrew OT · Strong's · LXX Bridges</div>
        </div>
        <div className="header-right">
          <div className="lxx-legend"><div className="lxx-line"/><span>LXX bridge</span></div>
          <span className="badge">PROTOTYPE</span>
          <div className="testament-toggle">
            <button className={"t-btn"+(test==="NT"?" nt-on":"")} onClick={()=>switchTest("NT")}>NT</button>
            <button className={"t-btn"+(test==="OT"?" ot-on":"")} onClick={()=>switchTest("OT")}>OT</button>
          </div>
          <button className="theme-btn" onClick={()=>setDark(d=>!d)} title="Toggle light/dark mode">{dark?"☀️":"🌙"}</button>
        </div>
      </header>
      <div className="nav-bar">
        <select className={"nav-select"+(isNT?"":" ot")} value={book} onChange={e=>{setBook(e.target.value);setCh(1);setSel(null);setActiveV(null);}}>
          {bookNames.map(b=><option key={b}>{b}</option>)}
        </select>
        <select className={"nav-select"+(isNT?"":" ot")} value={ch} onChange={e=>{setCh(+e.target.value);setSel(null);setActiveV(null);}}>
          {chapters.map(c=><option key={c} value={c}>Chapter {c}</option>)}
        </select>
        {loading&&<span className="fetch-badge">Loading…</span>}
        {!interlinearVerses&&!loading&&<span className="badge">Interlinear: John 1 · Genesis 1</span>}
        <span className="hint">Click verse to sync · Click word for Strong's · ✦ = note · hover verse for +</span>
      </div>
      <div className="main-layout">
        <div className="left-col">
          {loading&&<div className="loading">Loading…</div>}
          {leftVerses.map(v=>(
            <LeftVerse key={v.v} verse={v} isNT={isNT} isActive={activeV===v.v}
              note={getNote(v.v)} onAddNote={vn=>setAddingNote(vn)} onDeleteNote={handleDeleteNote} onNavigate={handleNavigate}/>
          ))}
          <div className="footer">
            Left column: World English Bible (WEB, Public Domain) via bible-api.com<br/>
            Interlinear: BSB · {isNT?"SBL Greek NT":"Westminster Leningrad Codex"} · Strong's (Public Domain)
          </div>
        </div>
        <div className="right-col">
          {interlinearVerses
            ?interlinearVerses.map(v=><VerseBlock key={v.v} id={"rv-"+v.v} verse={v} isNT={isNT} activeV={activeV} selKey={sel?sel.key:null} onClick={handleWord}/>)
            :<div className="no-interlinear">
              {fetchingInterlinear
                ?"Loading interlinear data…"
                :<span>No interlinear data found for {book} {ch}.<br/>
                  <span style={{fontSize:".78rem"}}>Add data files to your GitHub repo by running <code>generate_interlinear_data.py</code>.</span>
                </span>
              }
            </div>
          }
        </div>
      </div>
      {sel&&<StrongsPanel entry={entry} strongs={sel.word.s} word={sel.word} isNT={isNT} onClose={()=>setSel(null)}/>}
      {addingNote&&<NoteModal verse={addingNote} onSave={data=>handleSaveNote(addingNote,data)} onClose={()=>setAddingNote(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App,null));
</script>
</body>
</html>
