async function fetchChapterFromApiBible(bibleId, book, ch) {
  const key = bibleId+"|"+book+"|"+ch;
  if (translationCache[key]) return translationCache[key];
  const osisId = OSIS_ID[book];
  if (!osisId) return null;
  const chapterId = osisId+"."+ch;
  try {
    const r = await fetch(
      `https://rest.api.bible/v1/bibles/${bibleId}/chapters/${chapterId}?content-type=json&include-titles=false&include-chapter-numbers=false&include-notes=false&fums-version=3`,
      {headers:{"api-key":API_BIBLE_KEY}}
    );
    if (!r.ok) return null;
    const data = await r.json();
    const verses = parseApiBibleJson(data.data && data.data.content ? data.data.content : []);
    const copyright = (data.data && data.data.copyright) || "";
    const fumsToken = data.meta && data.meta.fumsToken;
    if (fumsToken && typeof window.fums === "function") window.fums("trackView", fumsToken);
    if (verses.length) translationCache[key] = {verses, copyright};
    return verses.length ? {verses, copyright} : null;
  } catch(e) { return null; }
}

function parseApiBibleJson(nodes) {
  const verses = {};
  let cur = null;
  function walk(arr) {
    if (!Array.isArray(arr)) return;
    for (const n of arr) {
      if (n && n.name === "verse" && n.attrs && n.attrs.number) {
        cur = parseInt(n.attrs.number);
        if (!verses[cur]) verses[cur] = "";
        walk(n.items || []);
      } else if (n && (n.name === "versenum" || (n.attrs && n.attrs.style === "v"))) {
        // skip verse-number display nodes
      } else if (n && n.text !== undefined && cur !== null) {
        verses[cur] = (verses[cur] || "") + n.text;
      } else if (n && n.items) {
        walk(n.items);
      }
    }
  }
  walk(nodes);
  return Object.entries(verses)
    .map(([v,t]) => {
      const num = parseInt(v);
      let text = t.trim().replace(/\s+/g," ");
      // Strip leading verse number if API.Bible included it as a text node
      const ns = String(num);
      if (text.startsWith(ns) && (text.length === ns.length || !/\d/.test(text[ns.length]))) {
        text = text.slice(ns.length).trim();
      }
      return {v:num, text};
    })
    .sort((a,b) => a.v - b.v)
    .filter(x => x.text);
}

async function fetchInterlinearBook(testament, book) {
  const key = testament + "|" + book;
  if (bookCache[key]) return bookCache[key];
  const fname = book.replace(/ /g, "_") + ".json";
  const url = GITHUB_RAW + "/" + testament + "/" + fname;
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    const data = await r.json();
    bookCache[key] = data;
    return data;
  } catch(e) {
    return null;
  }
}

// Lazy-loaded Strong's dictionary cache
const _SD = {}; // { G: {G2316:{l,t,d,k},...}|null, H: {...}|null }

function shortGloss(s){
  if(!s)return "";
  if(GLOSS[s])return GLOSS[s].l;
  const loc=S[s];
  if(loc){const d=loc.d;if(!d)return loc.l||"";const cut=d.split(/[,;]/)[0].trim();return cut.length>22?cut.slice(0,20)+"…":cut;}
  // Use lazy-loaded dict if already cached
  const kind=s[0];
  if(_SD[kind]&&_SD[kind][s]){const e=_SD[kind][s];const d=e.d||e.k||"";if(!d)return e.l||"";const cut=d.split(/[,;]/)[0].trim();return cut.length>22?cut.slice(0,20)+"…":cut;}
  return "";
}

function GeoPanel({book, ch, onClose}){
  const mapContainerRef = useRef(null);
  const mapRef = useRef(null);
  const markersRef = useRef([]);
  const trailLayersRef = useRef([]);
  const [showTrails, setShowTrails] = useState(false);
  const [activeTrail, setActiveTrail] = useState(null);

  const chPlaces = (GEO_DATA[book]||{})[String(ch)]||[];

  // Only contextually relevant trails for this book
  const relevantTrailKeys = TRAIL_BOOK_RELEVANCE[book]||[];
  const relevantTrails = Object.entries(TRAILS_DATA).filter(([key])=>relevantTrailKeys.includes(key));

  const TRAIL_COLORS = {
    exodus:"#e67e22", conquest:"#27ae60", paul1:"#8e44ad",
    paul2:"#2980b9", paul3:"#e74c3c", jesus_ministry:"#c0392b"
  };

  useEffect(()=>{
    if(!mapContainerRef.current || mapRef.current) return;
    const L = window.L;
    if(!L) return;
    const isDark = !document.body.classList.contains("light");
    const tileUrl = isDark
      ? "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
      : "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png";
    const tileAttrib = isDark ? "© CARTO © OSM contributors" : "© OpenStreetMap contributors";
    const map = L.map(mapContainerRef.current,{
      center:[31.5,35.2], zoom:7, zoomControl:true, preferCanvas:true
    });
    L.tileLayer(tileUrl,{attribution:tileAttrib,maxZoom:18}).addTo(map);
    mapRef.current = map;
    return ()=>{ if(mapRef.current){mapRef.current.remove();mapRef.current=null;} };
  },[]);

  useEffect(()=>{
    const L = window.L;
    const map = mapRef.current;
    if(!L || !map) return;
    markersRef.current.forEach(m=>map.removeLayer(m));
    markersRef.current = [];
    const bounds = [];
    chPlaces.forEach(place=>{
      const c = place.c;
      const colors = {k:"#3b82f6", a:"#f59e0b", d:"#ef4444", r:"#10b981"};
      const color = colors[c]||"#3b82f6";
      const isRegion = c==="r", isDisputed = c==="d", isApprox = c==="a";
      const m = L.circleMarker([place.la,place.lo],{
        radius: isRegion?14:8,
        fillColor: color, color:"#fff",
        weight: isDisputed?2:1.5, opacity:1,
        fillOpacity: isRegion?0.25 : isApprox?0.55 : 0.88,
        dashArray: isDisputed?"6,4":null
      });
      let badge = "";
      if(isApprox) badge = "<div style=\"color:#b8860b;font-size:11px;margin-top:4px\">Location approximate</div>";
      if(isDisputed) badge = "<div style=\"background:#fef2f2;border:1px solid #fca5a5;border-radius:4px;padding:4px 6px;margin-top:5px;font-size:11px;color:#991b1b\"><strong>&#9888; Disputed Location</strong><br/>Scholars disagree on the exact site. No consensus exists.</div>";
      if(isRegion) badge = "<div style=\"color:#047857;font-size:11px;margin-top:4px\">General region, not a specific city</div>";
      const noteHtml = place.nt ? "<div style=\"color:#666;font-style:italic;font-size:11px;margin-top:3px\">"+place.nt+"</div>" : "";
      m.bindPopup("<div style=\"font-family:Georgia,serif;min-width:160px\"><strong style=\"font-size:13px\">"+place.n+"</strong>"+badge+noteHtml+"</div>",{maxWidth:240});
      m.addTo(map);
      markersRef.current.push(m);
      bounds.push([place.la,place.lo]);
    });
    if(bounds.length===1) map.setView(bounds[0],9);
    else if(bounds.length>1) map.fitBounds(bounds,{padding:[50,50],maxZoom:10});
    setTimeout(()=>map.invalidateSize(),120);
  },[chPlaces]);

  // Render only relevant trails (filtered by TRAIL_BOOK_RELEVANCE)
  useEffect(()=>{
    const L = window.L;
    const map = mapRef.current;
    if(!L || !map) return;
    trailLayersRef.current.forEach(l=>map.removeLayer(l));
    trailLayersRef.current = [];
    if(!showTrails) return;
    relevantTrails.forEach(([key,trail])=>{
      if(activeTrail && activeTrail!==key) return;
      const color = TRAIL_COLORS[key]||"#888";
      const line = L.polyline(trail.waypoints.map(w=>[w.la,w.lo]),{
        color, weight:2.5, opacity:0.7, dashArray:"6,5"
      });
      line.addTo(map);
      trailLayersRef.current.push(line);
      trail.waypoints.forEach(w=>{
        const dot = L.circleMarker([w.la,w.lo],{
          radius:5, fillColor:color, color:"#fff", weight:1.5, opacity:1, fillOpacity:0.9
        });
        const nt = w.note ? "<div style=\"font-style:italic;color:#666;font-size:11px;margin-top:3px\">"+w.note+"</div>" : "";
        dot.bindPopup("<div style=\"font-family:Georgia,serif\"><strong>"+w.label+"</strong>"+nt+"<div style=\"font-size:11px;color:#888;margin-top:2px\">"+trail.label+"</div></div>",{maxWidth:220});
        dot.addTo(map);
        trailLayersRef.current.push(dot);
      });
    });
  },[showTrails,activeTrail,relevantTrails]);

  return (
    <div className="geo-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="geo-panel">
        <div className="geo-header">
          <span role="img" aria-label="map">&#128506;</span>
          <span className="geo-title">Geography &#8212; {book} {ch}</span>
          <button className="geo-close" onClick={onClose}>&#x2715;</button>
        </div>
        {relevantTrails.length>0&&(
          <div className="geo-controls">
            <button
              className={"geo-trail-btn"+(showTrails&&!activeTrail?" active":"")}
              style={showTrails&&!activeTrail?{background:"#475569"}:{}}
              onClick={()=>{setShowTrails(s=>!s);setActiveTrail(null);}}>
              {showTrails&&!activeTrail?"Hide Trails":"Show Journey Trails"}
            </button>
            {showTrails&&relevantTrails.map(([key,trail])=>(
              <button key={key}
                className={"geo-trail-btn"+(activeTrail===key?" active":"")}
                style={activeTrail===key?{background:TRAIL_COLORS[key]}:{borderColor:TRAIL_COLORS[key],color:TRAIL_COLORS[key]}}
                onClick={()=>setActiveTrail(p=>p===key?null:key)}>
                {trail.label}
              </button>
            ))}
          </div>
        )}
        <div className="geo-map-wrap" ref={mapContainerRef}/>
        {chPlaces.length===0&&(
          <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8,padding:"1.2rem 2rem",pointerEvents:"none",zIndex:1000,textAlign:"center",color:"var(--text3)",fontSize:".85rem",lineHeight:1.8}}>
            No mapped locations for {book} {ch}.<br/>
            <span style={{fontSize:".75rem"}}>Many chapters don&#39;t reference specific geographic locations.</span>
          </div>
        )}
        <div className="geo-legend">
          <span className="geo-legend-item"><span className="geo-dot known"></span>Known</span>
          <span className="geo-legend-item"><span className="geo-dot approx"></span>Approximate</span>
          <span className="geo-legend-item"><span className="geo-dot disputed"></span>&#9888; Disputed</span>
          <span className="geo-legend-item"><span className="geo-dot region"></span>Region</span>
          <span className="geo-legend-item" style={{marginLeft:"auto",fontSize:".62rem",opacity:.6}}>Geocoding: OpenBible.info (CC BY)</span>
        </div>
      </div>
    </div>
  );
}

// ── Strong's Word Study search ─────────────────────────────────────────────
function WordStudyResults({strongs, isNT, onNavigate, onClose}){
  const [results,setResults]=useState(null);
  const [loading,setLoading]=useState(false);

  async function runSearch(){
    setLoading(true);
    // Determine which testaments to fetch based on Strong's prefix
    const toFetch = strongs.startsWith("G") ? ["NT"] : strongs.startsWith("H") ? ["OT"] : ["NT","OT"];
    // Fetch all books for relevant testaments, store into INTERLINEAR for searching
    await Promise.all(toFetch.flatMap(t=>
      Object.keys(BOOKS[t]||{}).map(async book=>{
        const data = await fetchInterlinearBook(t, book);
        if(data&&data.chapters){
          if(!INTERLINEAR[t][book]) INTERLINEAR[t][book]={};
          Object.entries(data.chapters).forEach(([ch,verses])=>{
            const n=parseInt(ch);
            if(!INTERLINEAR[t][book][n]) INTERLINEAR[t][book][n]=verses;
          });
        }
      })
    ));
    // Search all loaded data
    const hits={};
    ["NT","OT"].forEach(t=>{
      Object.entries(INTERLINEAR[t]||{}).forEach(([bk,chaps])=>{
        Object.entries(chaps).forEach(([ch,verses])=>{
          const vArr=Array.isArray(verses)?verses:Object.values(verses);
          vArr.forEach(verse=>{
            (verse.words||[]).forEach(w=>{
              if(w.s===strongs){
                if(!hits[bk])hits[bk]={test:t,refs:[]};
                hits[bk].refs.push({ch:parseInt(ch),v:verse.v,o:w.o,t:w.t});
              }
            });
          });
        });
      });
    });
    Object.values(hits).forEach(h=>{
      const seen=new Set();
      h.refs=h.refs.filter(r=>{const k=r.ch+":"+r.v;if(seen.has(k))return false;seen.add(k);return true;});
    });
    setResults(hits);
    setLoading(false);
  }

  if(!results&&!loading) return(
    <button className={"ws-btn"+(isNT?"":" ot")} onClick={runSearch}>
      📖 Find {strongs} across all books
    </button>
  );

  if(loading) return(
    <div className="ws-results">
      <div className="ws-results-hdr">Searching all books…</div>
      <div className="ws-hit-none">Fetching scripture data, please wait…</div>
    </div>
  );

  const _bookOrder=[...Object.keys(BOOKS.NT||{}),...Object.keys(BOOKS.OT||{})];
  const _bookIdx=Object.fromEntries(_bookOrder.map((b,i)=>[b,i]));
  const books=Object.keys(results).sort((a,b)=>(_bookIdx[a]??999)-(_bookIdx[b]??999));
  const total=books.reduce((s,b)=>s+results[b].refs.length,0);
  return(
    <div className="ws-results">
      <div className="ws-results-hdr">
        {total>0?`${total} occurrence${total>1?"s":""} across ${books.length} book${books.length>1?"s":""}`:
          `${strongs} not found in any book`}
      </div>
      {total===0&&<div className="ws-hit-none">This Strong's number was not found.</div>}
      {books.map(bk=>{
        const {test,refs}=results[bk];
        return(
          <div key={bk} className="ws-book-group">
            <div className="ws-book-name">{bk}</div>
            {refs.slice(0,30).map((r,i)=>(
              <div key={i} className="ws-hit" onClick={()=>{onNavigate&&onNavigate(bk+" "+r.ch+":"+r.v);onClose&&onClose();}}>
                <span className={"ws-hit-ref "+(test==="NT"?"nt":"ot")}>{r.ch}:{r.v}</span>
                <span className="ws-hit-word">{r.o}</span>
                <span style={{fontSize:".7rem",color:"var(--text3)",fontStyle:"italic",marginLeft:".2rem"}}>{r.t}</span>
              </div>
            ))}
            {refs.length>30&&<div className="ws-hit-none">+ {refs.length-30} more…</div>}
          </div>
        );
      })}
    </div>
  );
}

function StrongsPanel({entry,strongs,word,isNT,onClose,onNavigate}){
  const [sdEntry,setSdEntry]=useState(null);
  const [sdLoading,setSdLoading]=useState(false);

  useEffect(()=>{
    if(entry||!strongs){setSdEntry(null);return;}
    const kind=strongs[0]; // 'G' or 'H'
    if(_SD[kind]){setSdEntry(_SD[kind][strongs]||null);return;}
    setSdLoading(true);
    fetch('/interlinear-bible/data/strongs_'+kind.toLowerCase()+'.json')
      .then(r=>r.json())
      .then(data=>{_SD[kind]=data;setSdEntry(data[strongs]||null);setSdLoading(false);})
      .catch(()=>setSdLoading(false));
  },[strongs,entry]);

  if(!entry&&!word&&!strongs)return null;
  const eff=entry||sdEntry;
  const heb=strongs&&strongs[0]==="H";
  const bridge=LXX[strongs];
  return(
    <div className="overlay" onClick={onClose}>
      <div className="sp" onClick={e=>e.stopPropagation()}>
        <button className="close-btn" onClick={onClose}>×</button>
        {strongs&&<div className={"sp-num"+(isNT?"":" ot")}>{strongs}</div>}
        <div className={"sp-lemma"+(heb?" heb":"")}>{eff?eff.l:(word&&word.o)||""}</div>
        <div className="sp-tr">{eff?eff.t:(word&&word.t)||""}</div>
        {eff&&eff.p&&<span className="sp-pos">{eff.p}</span>}
        {eff&&eff.d&&<p className="sp-def">{eff.d}</p>}
        {eff&&eff.k&&!eff.p&&<p className="sp-def" style={{fontSize:".82rem",color:"var(--text3)",marginTop:".2rem"}}><em>KJV:</em> {eff.k}</p>}
        {!eff&&sdLoading&&<p className="sp-def" style={{color:"var(--text3)",fontSize:".82rem",fontStyle:"italic"}}>Loading definition…</p>}
        {!eff&&!sdLoading&&strongs&&GLOSS[strongs]&&<p className="sp-def">{GLOSS[strongs].l}</p>}
        {!eff&&!sdLoading&&(!strongs||!GLOSS[strongs])&&<p className="sp-def" style={{color:"var(--text3)",fontSize:".82rem"}}>No lexical data available for this word.</p>}
        {bridge&&<div className="lxx-bridge">
          <div className="lxx-title">{heb?"⧁ LXX Greek Translation":"⧁ Hebrew Background (LXX)"}</div>
          {heb&&<p style={{fontSize:".7rem",color:"var(--text3)",margin:"-.2rem 0 .4rem"}}>In the Septuagint, this Hebrew word is translated:</p>}
          <div className="lxx-pair"><span className={"lxx-word"+(heb?"":" heb")}>{bridge.lbl}</span><span className="lxx-code">{bridge.cp}</span></div>
          <p className="lxx-note">{bridge.note}</p>
        </div>}
        {strongs&&<WordStudyResults strongs={strongs} isNT={isNT} onNavigate={onNavigate} onClose={onClose}/>}
      </div>
    </div>
  );
}


const BOOK_MAP = {
  "gen":"Genesis","ex":"Exodus","exo":"Exodus","lev":"Leviticus","num":"Numbers","deut":"Deuteronomy","deu":"Deuteronomy",
  "josh":"Joshua","jdg":"Judges","judg":"Judges","ruth":"Ruth","1sam":"1 Samuel","2sam":"2 Samuel",
  "1kgs":"1 Kings","1ki":"1 Kings","2kgs":"2 Kings","2ki":"2 Kings","1chr":"1 Chronicles","2chr":"2 Chronicles",
  "ezra":"Ezra","neh":"Nehemiah","esth":"Esther","job":"Job","ps":"Psalms","psa":"Psalms","prov":"Proverbs",
  "eccl":"Ecclesiastes","song":"Song of Solomon","sos":"Song of Solomon","isa":"Isaiah","jer":"Jeremiah",
  "lam":"Lamentations","ezek":"Ezekiel","eze":"Ezekiel","dan":"Daniel","hos":"Hosea","joel":"Joel",
  "amos":"Amos","obad":"Obadiah","jon":"Jonah","mic":"Micah","nah":"Nahum","hab":"Habakkuk",
  "zeph":"Zephaniah","hag":"Haggai","zech":"Zechariah","mal":"Malachi",
  "matt":"Matthew","mt":"Matthew","mark":"Mark","mk":"Mark","luke":"Luke","lk":"Luke",
  "john":"John","jn":"John","acts":"Acts","rom":"Romans","1cor":"1 Corinthians","2cor":"2 Corinthians",
  "gal":"Galatians","eph":"Ephesians","phil":"Philippians","php":"Philippians","col":"Colossians",
  "1thess":"1 Thessalonians","1th":"1 Thessalonians","2thess":"2 Thessalonians","2th":"2 Thessalonians",
  "1tim":"1 Timothy","1ti":"1 Timothy","2tim":"2 Timothy","2ti":"2 Timothy","titus":"Titus","tit":"Titus",
  "phlm":"Philemon","heb":"Hebrews","jas":"James","1pet":"1 Peter","1pe":"1 Peter",
  "2pet":"2 Peter","2pe":"2 Peter","1john":"1 John","1jn":"1 John","2john":"2 John","2jn":"2 John",
  "3john":"3 John","3jn":"3 John","jude":"Jude","rev":"Revelation",
  // also full names lowercased:
  "genesis":"Genesis","exodus":"Exodus","matthew":"Matthew","revelation":"Revelation",
};
function parseRef(ref){
  if(!ref)return null;
  const m=ref.trim().match(/^(\d?\s*[a-zA-Z]+(?:\s+[a-zA-Z]+)?)\s+(\d+)(?::\s*(\d+))?$/);
  if(!m)return null;
  const raw=m[1].trim().toLowerCase().replace(/\s+/g,"");
  const book=BOOK_MAP[raw];
  if(!book)return null;
  const ch=parseInt(m[2]);
  const v=m[3]?parseInt(m[3]):1;
  const test=BOOKS.NT[book]?"NT":BOOKS.OT[book]?"OT":null;
  if(!test)return null;
  return{test,book,ch,v};
}

// ── All Notes Panel ────────────────────────────────────────────────────────────
function NotesPanel({notes, onClose, onNavigate}){
  const migrateNote=raw=>Array.isArray(raw)?raw:(raw?[raw]:[]);
  const NT_ORDER=Object.keys(BOOKS.NT||{});
  const OT_ORDER=Object.keys(BOOKS.OT||{});
  const BOOK_ORDER=[...NT_ORDER,...OT_ORDER];
  const bkIdx=Object.fromEntries(BOOK_ORDER.map((b,i)=>[b,i]));

  // Build grouped structure: { "NT|John|3" : {test,book,ch,isNT, verses:[{v, items:[]}]} }
  const grouped={};
  Object.entries(notes).forEach(([key,raw])=>{
    const items=migrateNote(raw);
    if(!items.length)return;
    const parts=key.split("|");
    if(parts.length<4)return;
    const [t,bk,chStr,vStr]=parts;
    const gk=t+"|"+bk+"|"+chStr;
    if(!grouped[gk])grouped[gk]={test:t,book:bk,ch:parseInt(chStr),isNT:t==="NT",verses:[]};
    grouped[gk].verses.push({v:parseInt(vStr),items});
  });

  const sortedGroups=Object.entries(grouped).sort(([,a],[,b])=>{
    const bi=(bkIdx[a.book]??999)-(bkIdx[b.book]??999);
    return bi!==0?bi:a.ch-b.ch;
  });

  return(
    <div className="theo-overlay" onClick={onClose}>
      <div className="theo-panel" onClick={e=>e.stopPropagation()}>
        <div className="theo-header">
          <span className="theo-title">📝 My Notes</span>
          <button className="theo-close" onClick={onClose}>×</button>
        </div>
        <div className="theo-body">
          {sortedGroups.length===0
            ?<div style={{padding:"2rem 1rem",color:"var(--text3)",textAlign:"center",fontSize:".85rem",lineHeight:1.7}}>No notes yet.<br/>Hover over any verse and tap <strong>+</strong> to add one.</div>
            :sortedGroups.map(([gk,grp])=>(
              <div key={gk} style={{marginBottom:"1.1rem"}}>
                <div style={{fontSize:".72rem",fontWeight:700,color:grp.isNT?"var(--nt)":"var(--ot)",marginBottom:".4rem",textTransform:"uppercase",letterSpacing:".06em"}}>
                  {grp.book} {grp.ch}
                </div>
                {grp.verses.sort((a,b)=>a.v-b.v).map(({v,items})=>(
                  <div key={v} className={"arc-verse"+(grp.isNT?"":" ot")} style={{cursor:"pointer"}}
                    onClick={()=>{onNavigate&&onNavigate(`${grp.book} ${grp.ch}:${v}`);onClose();}}>
                    <span className={"arc-verse-ref "+(grp.isNT?"nt":"ot")}>v.{v}</span>
                    <div style={{flex:1}}>
                      {items.map((item,i)=>(
                        <div key={i} style={{fontSize:".8rem",color:"var(--text)",lineHeight:1.55}}>
                          {item.type==="link"
                            ?<span>🔗 <em style={{color:"var(--text2)"}}>{item.ref}</em></span>
                            :<span>📝 {item.text&&item.text.length>90?item.text.slice(0,87)+"…":item.text}</span>}
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            ))
          }
        </div>
      </div>
    </div>
  );
}

function App(){
  const [test,setTest]=useState("NT");
  const [book,setBook]=useState("John");
  const [ch,setCh]=useState(1);
  const [dark,setDark]=useState(true);
  const [sel,setSel]=useState(null);
  const [activeV,setActiveV]=useState(null);
  const [notes,setNotes]=useState(loadNotes);
  const [addingNote,setAddingNote]=useState(null);
  const [leftVerses,setLeftVerses]=useState([]);
  const [loading,setLoading]=useState(false);
  const [mobileView,setMobileView]=useState("interlinear"); // "list" | "interlinear"
  const [showTheo,setShowTheo]=useState(false);
  const [showNotes,setShowNotes]=useState(false);
  const [showMap,setShowMap]=useState(false);
  const [translation,setTranslation]=useState("WEB");
  const [translationCopyright,setTranslationCopyright]=useState("");

  const isNT=test==="NT";
  function handleNavigate(refStr){
    const p=parseRef(refStr);
    if(!p)return;
    if(p.test!==test)setTest(p.test);
    setBook(p.book);
    setCh(p.ch);
    setSel(null);
    setActiveV(p.v);
    setTimeout(()=>{
      const el=document.getElementById("rv-"+p.v);
      if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"});
    },600);
  }

  const bookNames=Object.keys(BOOKS[test]);
  const chCount=BOOKS[test][book]||1;
  const chapters=Array.from({length:chCount},(_,i)=>i+1);
  const iData=(INTERLINEAR[test]||{})[book]||{};
  const [fetchedVerses,setFetchedVerses]=useState(null);
  const [fetchingInterlinear,setFetchingInterlinear]=useState(false);
  const interlinearVerses=iData[ch]||(fetchedVerses&&fetchedVerses[String(ch)])||null;

  useEffect(()=>{document.body.className=dark?"":"light";},[dark]);

  // Preload Strong's dict in background when testament changes
  useEffect(()=>{
    const kind=isNT?"G":"H";
    if(_SD[kind])return;
    fetch('/interlinear-bible/data/strongs_'+kind.toLowerCase()+'.json')
      .then(r=>r.json())
      .then(data=>{_SD[kind]=data;})
      .catch(()=>{});
  },[isNT]);

  useEffect(()=>{
    setFetchedVerses(null);
    const iDataCheck=(INTERLINEAR[test]||{})[book]||{};
    const preloadedCount=Object.keys(iDataCheck).length;
    const totalChapters=(BOOKS[test]||{})[book]||1;
    if(preloadedCount<totalChapters){
      setFetchingInterlinear(true);
      fetchInterlinearBook(test,book).then(data=>{
        if(data&&data.chapters){
          setFetchedVerses(data.chapters);
        }
        setFetchingInterlinear(false);
      });
    }
  },[test,book]);

  useEffect(()=>{
    setLoading(true);
    setLeftVerses([]);
    if(translation==="WEB"){
      setTranslationCopyright("");
      fetch("https://bible-api.com/"+bookUrl(book,ch)+"?translation=web")
        .then(r=>r.json())
        .then(data=>{
          if(data.verses){
            setLeftVerses(data.verses.map(v=>({v:v.verse,text:v.text.trim()})));
          }
          setLoading(false);
        })
        .catch(()=>{
          if(interlinearVerses){
            setLeftVerses(interlinearVerses.map(v=>({v:v.v,text:v.bsb})));
          }
          setLoading(false);
        });
    }else{
      fetchChapterFromApiBible(translation,book,ch).then(result=>{
        if(result&&result.verses&&result.verses.length){
          setLeftVerses(result.verses);
          if(result.copyright) setTranslationCopyright(result.copyright);
        }else if(interlinearVerses){
          setLeftVerses(interlinearVerses.map(v=>({v:v.v,text:v.bsb})));
        }
        setLoading(false);
      });
    }
  },[book,ch,test,translation]);

  const switchTest=t=>{setTest(t);const b=Object.keys(BOOKS[t])[0];setBook(b);setCh(1);setSel(null);setActiveV(null);};
  const handleWord=(key,word)=>setSel(s=>s&&s.key===key?null:{key,word});
  const migrateNote=raw=>Array.isArray(raw)?raw:(raw?[raw]:[]);
  const getNote=v=>migrateNote(notes[nk(test,book,ch,v)]);
  const handleSaveNote=(v,item)=>{
    const key=nk(test,book,ch,v);
    const updated=[...migrateNote(notes[key]),item];
    const n={...notes,[key]:updated};setNotes(n);saveNotes(n);setAddingNote(null);
  };
  const handleDeleteNoteItem=(v,idx)=>{
    const key=nk(test,book,ch,v);
    const updated=migrateNote(notes[key]).filter((_,i)=>i!==idx);
    const n={...notes};
    if(updated.length===0)delete n[key]; else n[key]=updated;
    setNotes(n);saveNotes(n);
  };
  const entry=sel?S[sel.word.s]:null;

  return(
    <div>
      <header>
        <div>
          <div className="app-title">Jammin Interlinear App</div>
          <div className="app-subtitle">BSB · Greek NT · Hebrew OT · Strong's · LXX Bridges</div>
        </div>
        <div className="header-right">
          <div className="lxx-legend"><div className="lxx-line"/><span>LXX bridge</span></div>
          <span className="badge">PROTOTYPE</span>
          <div className="testament-toggle">
            <button className={"t-btn"+(test==="NT"?" nt-on":"")} onClick={()=>switchTest("NT")}>NT</button>
            <button className={"t-btn"+(test==="OT"?" ot-on":"")} onClick={()=>switchTest("OT")}>OT</button>
          </div>
          <button className="theme-btn" onClick={()=>setDark(d=>!d)} title="Toggle light/dark mode">{dark?"☀️":"🌙"}</button>
        </div>
      </header>
      <div className="nav-bar">
        <select className={"nav-select"+(isNT?"":" ot")} value={book} onChange={e=>{setBook(e.target.value);setCh(1);setSel(null);setActiveV(null);}}>
          {bookNames.map(b=><option key={b}>{b}</option>)}
        </select>
        <select className={"nav-select"+(isNT?"":" ot")} value={ch} onChange={e=>{setCh(+e.target.value);setSel(null);setActiveV(null);}}>
          {chapters.map(c=><option key={c} value={c}>Chapter {c}</option>)}
        </select>
        {loading&&<span className="fetch-badge">Loading…</span>}
        {!interlinearVerses&&!loading&&<span className="badge">Interlinear: John 1 · Genesis 1</span>}
        <button className="topics-btn" onClick={()=>setShowNotes(true)}>📝 Notes</button>
        <button className="topics-btn" onClick={()=>setShowMap(true)}>🗺 Map</button>
        <button className="topics-btn" onClick={()=>setShowTheo(true)}>⧁ Topics</button>
        <span className="hint">Click verse to sync · Click word for Strong's · ✦ = note · hover verse for +</span>
      </div>
      <div className="main-layout">
        <div className={"left-col"+(mobileView==="list"?" mob-show":"")}>
          <div style={{padding:".4rem .6rem .2rem",display:"flex",alignItems:"center",gap:".5rem",borderBottom:"1px solid var(--border)",flexShrink:0}}>
            <span style={{fontSize:".72rem",color:"var(--text3)",whiteSpace:"nowrap"}}>Translation:</span>
            <select className={"nav-select"+(isNT?"":" ot")} style={{fontSize:".78rem",padding:"3px 8px",flex:1,minWidth:0}} value={translation} onChange={e=>setTranslation(e.target.value)}>
              {TRANSLATIONS.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}
            </select>
          </div>
          {loading&&<div className="loading">Loading…</div>}
          {leftVerses.map(v=>(
            <LeftVerse key={v.v} verse={v} isNT={isNT} isActive={activeV===v.v}
              noteItems={getNote(v.v)} onAddNote={vn=>setAddingNote(vn)} onDeleteNoteItem={handleDeleteNoteItem} onNavigate={handleNavigate}
              onSelect={vn=>{setActiveV(vn);setMobileView("interlinear");}}/>
          ))}
          <div className="footer">
            <strong style={{color:"var(--text3)"}}>Jammin Interlinear App</strong><br/>
            English text:{" "}
            {translation==="WEB"
              ?<><a href="https://ebible.org/eng-web/copyright.htm" target="_blank" rel="noopener" style={{color:"inherit"}}>World English Bible</a> (Public Domain)</>
              :<span>{translationCopyright||TRANSLATIONS.find(t=>t.id===translation)?.label||""}</span>
            } ·{" "}
            Interlinear: <a href="https://interlinearbible.com" target="_blank" rel="noopener" style={{color:"inherit"}}>Berean Interlinear Bible</a> (Public Domain) ·{" "}
            {isNT?"Greek NT: SBL Greek New Testament":"Hebrew OT: Westminster Leningrad Codex"}<br/>
            Strong&#39;s Hebrew &amp; Greek: <a href="https://github.com/openscriptures/strongs" target="_blank" rel="noopener" style={{color:"inherit"}}>OpenScriptures</a> (CC&#8209;BY 4.0)
          </div>
        </div>
        <div className={"right-col"+(mobileView==="list"?" mob-hide":"")}>
          {interlinearVerses
            ?interlinearVerses.map(v=><VerseBlock key={v.v} id={"rv-"+v.v} verse={v} isNT={isNT} activeV={activeV} selKey={sel?sel.key:null} onClick={handleWord}/>)
            :<div className="no-interlinear">
              {fetchingInterlinear
                ?"Loading interlinear data…"
                :<span>No interlinear data found for {book} {ch}.<br/>
                  <span style={{fontSize:".78rem"}}>Add data files to your GitHub repo by running <code>generate_interlinear_data.py</code>.</span>
                </span>
              }
            </div>
          }
        </div>
      </div>
      {/* Mobile bottom tab bar */}
      <div className="mob-tabs">
        <button className={"mob-tab"+(mobileView==="list"?" mob-on"+(isNT?"":" mob-ot"):"")}
                onClick={()=>setMobileView("list")}>
          <span className="mob-tab-icon">☰</span>
          <span>Verses</span>
        </button>
        <button className={"mob-tab"+(mobileView==="interlinear"?" mob-on"+(isNT?"":" mob-ot"):"")}
                onClick={()=>setMobileView("interlinear")}>
          <span className="mob-tab-icon">{isNT?"α":"א"}</span>
          <span>Interlinear</span>
        </button>
      </div>
      {sel&&<StrongsPanel entry={entry} strongs={sel.word.s} word={sel.word} isNT={isNT} onClose={()=>setSel(null)} onNavigate={ref=>{handleNavigate(ref);setSel(null);}}/>}
      {addingNote&&<NoteModal verse={addingNote} onSave={data=>handleSaveNote(addingNote,data)} onClose={()=>setAddingNote(null)}/>}
      {showNotes&&<NotesPanel notes={notes} onClose={()=>setShowNotes(false)} onNavigate={handleNavigate}/>}
      {showMap&&<GeoPanel book={book} ch={ch} onClose={()=>setShowMap(false)}/>}
      {showTheo&&<TheologyPanel onClose={()=>setShowTheo(false)} onNavigate={ref=>{handleNavigate(ref);setShowTheo(false);}}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App,null));
</script>
